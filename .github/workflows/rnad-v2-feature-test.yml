name: RNAD-003 semantic matchup v2 feature contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ml/rnad-phase-features-v2.js'
      - 'test/rnad-three-phase-features-v2.test.js'
      - '.github/workflows/rnad-v2-feature-test.yml'
permissions: {}
jobs:
  feature-contract:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify seat-local semantic matchup feature projection
        run: |
          node scripts/verify-snapshot.mjs
          node --test test/rnad-three-phase-features-v2.test.js
