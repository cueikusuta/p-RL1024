name: I5 G137 onward verified 10-hour league continuation
on:
  push:
    branches: [research/5-g49-strength-continuation]
    paths:
      - docs/research/rnad/G137_G237_TEN_HOUR_LAUNCH_2026-11-21.json
permissions: {}
concurrency:
  group: rnad-i5-g49-strength-single-writer
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Confirm exact G136 source and authorized one-shot 10-hour launch
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          path='docs/research/rnad/G137_G237_TEN_HOUR_LAUNCH_2026-11-21.json'
          x=json.loads(Path(path).read_text())
          previous=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          assert changed==[path], 'Launch commit must change only the authorization record'
          assert x=={
            'schema':'rnad-i5-g137-source-pinned-ten-hour-v1',
            'workflow_prelaunch_sha':previous,
            'training_source_sha':'4ac6ad652365318aa4f8b9736dffdd00cf696915',
            'previous_completed_run_id':44770410066,
            'previous_completed_run_sha':'02b7c60b83b899985082554149a44b22964b252b',
            'g137_bootstrap_artifact_id':14686545955,
            'g136_learner_result_artifact_id':14685704164,
            'first_generation':137,'last_generation':237,
            'budget_seconds':36000,
            'actor_count':20,'matches_per_generation':1280,'updates_per_generation':40,
            'github_hosted_cpu_only':True,
            'preserve_full_main_target_optimizer_magnet_rng':True,
            'no_champion_promotion':True
          },'Launch scope/source changed'
          PY
          python -m py_compile scripts/rnad/g137_strength_resume_migration.py scripts/rnad/shared_league_artifact_recovery.py scripts/rnad/shared_league_parallel_download.py
          python -m unittest discover -s test -p rnad_shared_league_artifact_recovery_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_parallel_download_test.py -v
          python - <<'PY'
          from scripts.rnad.shared_league_artifact_recovery import artifact_name,MAX_RECOVERY_GENERATION
          assert MAX_RECOVERY_GENERATION==240
          assert all(artifact_name(g,19)==f'rnad-i5-cont-g{g}-actor-19' for g in (136,137,160,237,240))
          try: artifact_name(241,0)
          except ValueError: pass
          else: raise AssertionError('Unapproved generation accepted')
          PY
          gh api repos/cueikusuta/p-RL1024/actions/runs/44770410066 \
            --jq '{id,head_sha,status,conclusion}' > prior-run.json
          test "$(jq -r .head_sha prior-run.json)" = '02b7c60b83b899985082554149a44b22964b252b'
          test "$(jq -r .status prior-run.json)" = completed
          test "$(jq -r .conclusion prior-run.json)" = success
          for record in "14686545955 rnad-i5-cont-next-bootstrap-after-g136" "14685704164 rnad-i5-cont-g136-full-learner-result"; do
            set -- $record
            gh api "repos/cueikusuta/p-RL1024/actions/artifacts/$1" \
              --jq '{id,name,expired,workflow_run}' > "artifact-$1.json"
            test "$(jq -r .id "artifact-$1.json")" = "$1"
            test "$(jq -r .name "artifact-$1.json")" = "$2"
            test "$(jq -r .expired "artifact-$1.json")" = false
            test "$(jq -r .workflow_run.id "artifact-$1.json")" = 44770410066
          done

  bridge:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4ac6ad652365318aa4f8b9736dffdd00cf696915
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Migrate exact SHA-pinned G136 full-state checkpoint into 10-hour G137 bootstrap
        run: |
          set -euo pipefail
          for record in "rnad-i5-cont-next-bootstrap-after-g136 previous-g137" "rnad-i5-cont-g136-full-learner-result prior-result"; do
            set -- $record
            for attempt in 1 2 3 4 5 6 7; do
              rm -rf "$2"; mkdir -p "$2"
              if gh run download 44770410066 --repo cueikusuta/p-RL1024 \
                   --name "$1" --dir "$2"; then break; fi
              if [ "$attempt" -eq 7 ]; then exit 1; fi
              sleep "$((attempt*10))"
            done
          done
          (cd previous-g137 && sha256sum -c file-pins.sha256)
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
          python -m scripts.rnad.g137_strength_resume_migration --source previous-g137 --out bootstrap
          (cd bootstrap && sha256sum -c file-pins.sha256)
      - name: Verify previous learner G136 result and exact G137 tensor/provenance continuity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          import torch
          b,o,r=Path('bootstrap'),Path('previous-g137'),Path('prior-result')
          rd=lambda p:json.loads(p.read_text())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m,idx,mig,ctx=[rd(b/x) for x in ('generation-manifest.json','checkpoint-index.json','migration-report.json','continuation-context.json')]
          om,oi,hand=[rd(o/x) for x in ('generation-manifest.json','checkpoint-index.json','handoff-report.json')]
          report,reportidx=[rd(r/x) for x in ('generation137-report.json','generation137-index.json')]
          src='4ac6ad652365318aa4f8b9736dffdd00cf696915';old='26bcb35e6a1e7e74daa7e05c74c4b381c751188b'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==src
          assert om['source_sha']==old and m['source_sha']==src
          assert m['generation']==om['generation']==idx['generation']==137
          assert m['seed_start']==9900001+137*640 and m['actor_count']==20 and m['seeds_per_actor']==32
          assert report['generation']==hand['previous_generation']==136
          assert report['accepted_complete_four_win_matches']==hand['exact_previous_complete_matches']==1280
          assert report['optimizer_updates_completed']==hand['prior_optimizer_updates']==40
          assert report['cumulative_complete_matches']==137*1280
          assert report['cumulative_optimizer_updates']==137*40
          assert report['champion_promoted'] is False
          assert reportidx['full_checkpoint_sha256']==hand['prior_checkpoint_sha256']==oi['prior_generation_checkpoint_sha256']
          assert mig['previous_source_sha']==old and mig['source_sha']==src
          assert mig['old_checkpoint_sha256']==oi['sha256']==sha(o/'checkpoint-g0.pt')
          assert mig['new_checkpoint_sha256']==idx['sha256']==sha(b/'checkpoint-g0.pt')
          assert idx['prior_generation_checkpoint_sha256']==oi['sha256']
          assert mig['verified_model_target_magnet_optimizer_scheduler_rng'] is True
          assert [x['id'] for x in m['opponents']['historical']]==['past-g134','past-g135','past-g136']
          cp=torch.load(b/'checkpoint-g0.pt',map_location='cpu',weights_only=True)
          assert cp['generation']==137 and cp['source_sha']==src and cp['is_champion'] is False
          assert cp['cumulative_complete_matches']==137*1280 and cp['cumulative_optimizer_updates']==137*40
          assert all(k in cp for k in ('model','target','magnet','optimizer','scheduler','torch_rng','python_rng'))
          assert ctx['schema']=='rnad-i5-shared-league-handoff-v1'
          assert ctx['source_run_id']==44318145987 and ctx['budget_seconds']==36000
          assert ctx['deadline_epoch']==ctx['start_epoch']+36000
          assert ctx['new_budget_phase']=='g137-user-approved-ten-hour-continuation'
          assert ctx['original_generation']==137 and ctx['previous_budget_context_sha256']==sha(o/'continuation-context.json')
          assert all(hand[k] is True for k in ('optimizer_full_state_preserved','target_full_state_preserved','magnet_full_state_preserved','rng_full_state_preserved'))
          (b/'previous-budget-context.json').write_bytes((o/'continuation-context.json').read_bytes())
          files=sorted(x for x in b.rglob('*') if x.is_file() and x.name!='file-pins.sha256')
          (b/'file-pins.sha256').write_text(''.join(f'{sha(x)}  {x.relative_to(b)}\n' for x in files))
          print(json.dumps({'first_generation':137,'cumulative_matches':137*1280,'cumulative_updates':137*40,'preserved_optimizer_magnet_rng':True,'champion_promoted':False}))
          PY
          (cd bootstrap && sha256sum -c file-pins.sha256)
      - name: Verify frozen game engine and 6 real accepted Match smoke
        run: |
          set -euo pipefail
          if ! command -v node || ! node --version | grep -Eq '^v22\.'; then
            archive=node-v22.14.0-linux-x64.tar.xz
            curl -fsSL --retry 3 "https://nodejs.org/dist/v22.14.0/$archive" -o "$RUNNER_TEMP/$archive"
            curl -fsSL --retry 3 "https://nodejs.org/dist/v22.14.0/SHASUMS256.txt" -o "$RUNNER_TEMP/SHASUMS256.txt"
            (cd "$RUNNER_TEMP" && grep -F " $archive" SHASUMS256.txt | sha256sum --check)
            tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/node-v22.14.0-linux-x64/bin" >> "$GITHUB_PATH"
          fi
          node scripts/verify-snapshot.mjs
          for actor in 0 8 16; do
            python -m scripts.rnad.shared_league_collect --bootstrap bootstrap --actor-id "$actor" --smoke --out "smoke/$actor" --match-workers 2
          done
          test "$(find smoke -name '*.json.gz' | wc -l)" -eq 6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rnad-i5-cont-next-bootstrap-after-g136
          path: bootstrap/
          retention-days: 30
          if-no-files-found: error

