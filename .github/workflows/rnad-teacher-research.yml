name: RNAD-001 optional fixed-Policy imitation (GitHub-hosted only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/rnad/export-teacher.mjs'
      - 'scripts/rnad/train_teacher.py'
      - '.github/workflows/rnad-teacher-research.yml'
permissions: {}
concurrency:
  group: rnad-001-teacher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  imitation:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest # GitHub-hosted only; never self-hosted.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Verify immutable engine and run 32 real accepted teacher Matches
        run: |
          node scripts/verify-snapshot.mjs
          python -m scripts.rnad.train_teacher --out artifacts/rnad-teacher
      - name: Untrained model paired baseline, independent 32 seeds
        run: |
          node scripts/rnad/evaluate.mjs --model artifacts/rnad-teacher/initial-model.json --seed 988001 --pairs 32 --out artifacts/rnad-teacher/initial-heldout.json
      - name: Imitation model on same paired seeds, NOT R-NaD Champion
        run: |
          node scripts/rnad/evaluate.mjs --model artifacts/rnad-teacher/trained-model.json --seed 988001 --pairs 32 --out artifacts/rnad-teacher/teacher-heldout.json
      - name: Preserve research evidence (no promotion)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-001-optional-teacher-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rnad-teacher/teacher-report.json
            artifacts/rnad-teacher/initial-model.json
            artifacts/rnad-teacher/trained-model.json
            artifacts/rnad-teacher/initial-heldout.json
            artifacts/rnad-teacher/teacher-heldout.json
          if-no-files-found: warn
          retention-days: 30
