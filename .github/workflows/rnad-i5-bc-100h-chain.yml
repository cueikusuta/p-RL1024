          gh api "repos/cueikusuta/p-RL1024/actions/runs/$PRIOR" > previous.json
          jq -e --argjson id "$PRIOR" '.id==$id and .status=="completed" and .conclusion=="success" and .head_branch=="research/5-bc-100h-league" and .run_attempt==1' previous.json >/dev/null
          if [ "$START" = 299 ]; then
            test "$GITHUB_EVENT_NAME" = push
            jq -e '.id==45287065252 and .head_sha=="efd3415c4590939c7b2edf0d7170c57a6f6989bb" and .path==".github/workflows/rnad-i5-bc-100h-wave05-recovery-resume.yml"' previous.json >/dev/null
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            jq -e --arg sha "$GITHUB_SHA" --arg title "I5 B+C chain G$((START-20))" '.head_sha==$sha and .path==".github/workflows/rnad-i5-bc-100h-chain.yml" and .display_title==$title' previous.json >/dev/null
          fi
