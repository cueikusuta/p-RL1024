name: I5 B+C autonomous bounded continuation
run-name: I5 B+C chain G${{ inputs.start_generation || '299' }}
on:
  push:
    branches: [research/5-bc-100h-league]
    paths: [.github/workflows/rnad-i5-bc-100h-chain.yml]
  workflow_dispatch:
    inputs:
      start_generation:
        required: true
        type: string
      prior_run:
        required: true
        type: string
      controller_sha:
        required: true
        type: string
permissions: {}
concurrency:
  group: rnad-i5-bc-100h-single-writer
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'cueikusuta/p-RL1024' && github.ref_name == 'research/5-bc-100h-league'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, actions: read, pull-requests: read}
    outputs:
      should_continue: ${{ steps.boundary.outputs.should_continue }}
      generations: ${{ steps.boundary.outputs.generations }}
      bootstraps: ${{ steps.boundary.outputs.bootstraps }}
      next_start: ${{ steps.boundary.outputs.next_start }}
    env:
      GH_TOKEN: ${{ github.token }}
      START: ${{ inputs.start_generation || '299' }}
      PRIOR: ${{ inputs.prior_run || '45287065252' }}
      EXPECTED_CONTROLLER: ${{ inputs.controller_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 6a11eee1a011dcc65ac80e3b5f2c3c0b57341494, persist-credentials: false}
      - name: Verify unique reviewed chain, predecessor and complete immutable checkpoint
        id: boundary
        run: |
          set -euo pipefail
          [[ "$START" =~ ^[0-9]{3}$ && "$PRIOR" =~ ^[0-9]+$ ]]
          (( START >= 299 && START <= 579 && (START-299)%20 == 0 ))
          test "$GITHUB_SHA" = "$EXPECTED_CONTROLLER"
          test "$GITHUB_RUN_ATTEMPT" = 1
          (( PRIOR < GITHUB_RUN_ID ))
          if [ "$((1795640581-$(date +%s)))" -le 1200 ]; then
            echo should_continue=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate 'repos/cueikusuta/p-RL1024/actions/runs?branch=research%2F5-bc-100h-league&per_page=100&created=%3E%3D2026-11-22' > runs.json
          # A superseded pending reservation with no jobs may be replaced; no started training may be replayed.
          jq -sr --arg title "I5 B+C chain G$START" --argjson current "$GITHUB_RUN_ID" '.[].workflow_runs[]|select(.path==".github/workflows/rnad-i5-bc-100h-chain.yml" and .display_title==$title and .id<$current)|[.id,.status,.conclusion]|@tsv' runs.json > earlier.tsv
          while IFS=
          gh api --paginate "repos/cueikusuta/p-RL1024/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > ci.json
          jq -se --arg sha "$GITHUB_SHA" 'any(.[].workflow_runs[]; .path==".github/workflows/rnad-i5-bc-100h-auto-chain-contract-ci.yml" and .head_sha==$sha and .status=="completed" and .conclusion=="success")' ci.json >/dev/null
          gh api --paginate 'repos/cueikusuta/p-RL1024/issues/14/comments?per_page=100' > review.json
          jq -se --arg marker "RNAD_AUTO_CHAIN_REVIEW_GO $GITHUB_SHA" 'any(.[][]; .user.login=="cueikusuta" and (.body|split("\n")|index($marker))!=null)' review.json >/dev/null
          gh api "repos/cueikusuta/p-RL1024/actions/runs/$PRIOR" > previous.json
          jq -e --argjson id "$PRIOR" '.id==$id and .status=="completed" and .conclusion=="success" and .head_branch=="research/5-bc-100h-league" and .run_attempt==1' previous.json >/dev/null
          if [ "$START" = 299 ]; then
            test "$GITHUB_EVENT_NAME" = push
            jq -e '.id==45287065252 and .head_sha=="efd3415c4590939c7b2edf0d7170c57a6f6989bb" and .path==".github/workflows/rnad-i5-bc-100h-wave05-recovery-resume.yml"' previous.json >/dev/null
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            jq -e --arg sha "$GITHUB_SHA" --arg title "I5 B+C chain G$((START-20))" '.head_sha==$sha and .path==".github/workflows/rnad-i5-bc-100h-chain.yml" and .display_title==$title' previous.json >/dev/null
          fi
          gh api --paginate "repos/cueikusuta/p-RL1024/actions/runs/$PRIOR/jobs?per_page=100" > jobs.json
          jq -se --arg suffix "g$((START-1)) shared single writer and next handoff" '([.[].jobs[]|select((.name|endswith($suffix)) and .conclusion=="success")]|length)==1' jobs.json >/dev/null
          gh api --paginate "repos/cueikusuta/p-RL1024/actions/runs/$PRIOR/artifacts?per_page=100" > artifacts.json
          jq -se --arg n "rnad-i5-cont-next-bootstrap-after-g$((START-1))" '([.[].artifacts[]|select(.name==$n and .expired==false)]|if length==1 then .[0] else error("unique predecessor bootstrap required") end)' artifacts.json > selected.json
          aid=$(jq -er '.id|tostring|select(test("^[0-9]+$"))' selected.json)
          digest=$(jq -er '.digest|select(test("^sha256:[0-9a-f]{64}$"))|sub("^sha256:";"")' selected.json)
          for attempt in 1 2 3 4 5; do
            rm -f bootstrap.zip
            if gh api "repos/cueikusuta/p-RL1024/actions/artifacts/$aid/zip" > bootstrap.zip && echo "$digest  bootstrap.zip" | sha256sum -c -; then break; fi
            test "$attempt" -lt 5 || exit 1
            sleep "$((attempt*15))"
          done
          mkdir bootstrap
          unzip -q bootstrap.zip -d bootstrap
          (cd bootstrap && sha256sum -c file-pins.sha256)
          python - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          from scripts.rnad.shared_league_contract import verify_manifest,canonical_hash
          root=Path("bootstrap"); start=int(os.environ["START"])
          obj=lambda n:json.loads((root/n).read_text())
          m=obj("generation-manifest.json");idx=obj("checkpoint-index.json")
          ctx=obj("continuation-context.json");h=obj("handoff-report.json")
          pins=[l.split(maxsplit=1)[1].lstrip("*") for l in (root/"file-pins.sha256").read_text().splitlines() if l.strip()]
          actual={str(p.relative_to(root)) for p in root.rglob("*") if p.is_file() and p!=root/"file-pins.sha256"}
          assert len(pins)==len(set(pins)) and set(pins)==actual
          sha=lambda n:hashlib.sha256((root/n).read_bytes()).hexdigest()
          assert m["generation"]==start and m["seed_start"]==9900001+start*640
          assert m["source_sha"]==h["source_sha"]=="6a11eee1a011dcc65ac80e3b5f2c3c0b57341494"
          assert verify_manifest(m)==canonical_hash(m)==h["new_generation_manifest_sha256"]
          assert m["actor_count"]==20 and m["optimizer_steps"]==40
          assert m["league_opponent_profile"]=="rnad-i5-opponents-b-v1" and m["battle_feature_schema"]=="rnad-three-phase-features-v6"
          assert {x["id"] for x in m["opponents"]["fixed"]}=={"fixed-aqbase001","fixed-coretrioaq001","fixed-base256","fixed-c005"}
          assert idx["generation"]==start and idx["sha256"]==sha("checkpoint-g0.pt")==h["new_full_checkpoint_sha256"]
          assert m["main_sha256"]==sha("actor/manifest.json")==h["main_sha256"]
          assert m["magnet_sha256"]==sha("magnet/manifest.json")==h["magnet_sha256"]
          assert h["previous_generation"]==start-1 and h["generation"]==start
          assert h["exact_previous_complete_matches"]==1280 and h["prior_optimizer_updates"]==40
          assert h["prior_checkpoint_sha256"]==idx["prior_generation_checkpoint_sha256"]
          assert h["new_seed_start"]==m["seed_start"]
          assert all(h[k] is True for k in ("optimizer_full_state_preserved","target_full_state_preserved","magnet_full_state_preserved","rng_full_state_preserved","research_only"))
          assert h["champion_promoted"] is False
          assert ctx["budget_seconds"]==360000 and ctx["deadline_epoch"]==1795640581 and h["next_wall_clock_deadline_epoch"]==ctx["deadline_epoch"]
          cont=ctx["deadline_epoch"]-time.time()>1200
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"should_continue={str(cont).lower()}\n")
              f.write("generations="+json.dumps(list(range(start,start+20)),separators=(",",":"))+"\n")
              f.write("bootstraps="+json.dumps(["rnad-i5-bc-auto-bootstrap"]+[f"rnad-i5-cont-next-bootstrap-after-g{g}" for g in range(start,start+19)],separators=(",",":"))+"\n")
              f.write(f"next_start={start+20}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.boundary.outputs.should_continue == 'true'
        with:
          name: rnad-i5-bc-auto-bootstrap
          path: bootstrap/
          retention-days: 7
          if-no-files-found: error
  g0:
    needs: [prepare]
    if: needs.prepare.outputs.should_continue == 'true'
    uses: ./.github/workflows/rnad-i5-bc-100h-generation-reusable.yml
    with:
      generation: ${{ fromJSON(needs.prepare.outputs.generations)[0] }}
      bootstrap_artifact: ${{ fromJSON(needs.prepare.outputs.bootstraps)[0] }}
      last_generation: 598
      source_ref: 6a11eee1a011dcc65ac80e3b5f2c3c0b57341494
    permissions: {contents: read, actions: write}
