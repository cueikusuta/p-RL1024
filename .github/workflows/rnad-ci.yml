name: RNAD-001 Stage 0 contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ml/**'
      - 'scripts/dev/simulator/rnad-match.js'
      - 'scripts/dev/simulator/phase-match.js'
      - 'src/ai/phase-pipeline.js'
      - 'scripts/rnad/**'
      - 'test/rnad-*.test.js'
      - 'test/rnad_*_test.py'
      - 'requirements-rnad.txt'
      - 'scripts/rnad/compare_warmstart_eval.mjs'
      - 'test/rnad-warmstart-eval.test.js'
      - 'scripts/rnad/evaluate-direct.mjs'
      - 'test/rnad-direct-eval.test.js'
      - '.github/workflows/rnad-ci.yml'
      - 'docs/research/rnad/**'
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-stage0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify frozen source snapshot
        run: node scripts/verify-snapshot.mjs
      - name: Configure Python 3.11 (GitHub-hosted CPU)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch CPU and ONNX validation packages
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
      - name: Verify RNAD two-player V-trace, neural gradients, ONNX and checkpoint runtime
        run: python -m unittest discover -s test -p 'rnad_*_test.py' -v
      - name: Verify RNAD Stage 0 and phase pipeline contracts
        run: node --test test/rnad-stage0-contract.test.js test/rnad-receipts.test.js test/rnad-authority-match.test.js test/rnad-full-match.test.js test/rnad-toy.test.js test/rnad-evaluation.test.js test/rnad-warmstart-eval.test.js test/phase-pipeline-contract.test.js test/pure-rl-phases.test.js test/pure-rl-acceptance.test.js
