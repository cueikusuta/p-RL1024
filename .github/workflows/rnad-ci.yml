name: RNAD-001 Stage 0 contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ml/**'
      - 'test/rnad-*.test.js'
      - '.github/workflows/rnad-ci.yml'
      - 'docs/research/rnad/**'
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-stage0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify frozen source snapshot
        run: node scripts/verify-snapshot.mjs
      - name: Verify RNAD Stage 0 and phase pipeline contracts
        run: node --test test/rnad-stage0-contract.test.js test/phase-pipeline-contract.test.js test/pure-rl-phases.test.js test/pure-rl-acceptance.test.js
