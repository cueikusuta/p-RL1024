name: RNAD I5 prospective paired league evaluation contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/rnad/paired-league-*.mjs'
      - 'test/rnad-paired-league-eval.test.js'
      - 'docs/research/rnad/PAIRED_LEAGUE_EVALUATION_2026-11-19.md'
      - 'docs/research/rnad/FUTURE_EVALUATION_CONFIDENCE_POLICY_2026-11-17.md'
      - '.github/workflows/rnad-i5-paired-evaluation-contracts.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-i5-paired-evaluation-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify immutable engine and prospective paired analysis syntax
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          node --check scripts/rnad/paired-league-stats.mjs
          node --check scripts/rnad/paired-league-eval.mjs
      - name: Paired seed-block tests, multiplicity and fail-closed negative controls
        run: node --test test/rnad-paired-league-eval.test.js
