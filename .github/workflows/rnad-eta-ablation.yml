name: RNAD-001 GitHub-hosted 64-Match magnet/eta ablation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/rnad/research_eta_ablation.py'
      - '.github/workflows/rnad-eta-ablation.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-001-disposable-eta64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  eta-ablation:
    if: github.repository == 'cueikusuta/p-RL1024' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest # GitHub-hosted only; self-hosted prohibited.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      GH_REPO: cueikusuta/p-RL1024
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch CPU and NumPy
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Verify frozen battle engine and source checkout
        run: |
          node scripts/verify-snapshot.mjs
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Download previously verified, immutable teacher/256 research models
        run: |
          gh run download 43683127479 --repo "$GH_REPO" \
            --name rnad-001-warmstart-256-43683127479-1 \
            --dir artifacts/teacher-archive
      - name: Verify actual teacher checkpoint, model bytes and provenance
        run: |
          python -m scripts.rnad.verify_warmstart_artifact \
            --root artifacts/teacher-archive \
            --source-sha ca3e69afc1208c5fc68e1cd6d5403f032348e988
      - name: Train exactly 64 complete Matches with eta=0.05, magnet period=16
        run: |
          python -m scripts.rnad.research_eta_ablation \
            --teacher artifacts/teacher-archive/teacher/trained-model.json \
            --seed 976201 --out artifacts/eta64
      - name: Compare teacher vs 64-Match ablation directly on unused 32 seeds
        run: |
          node scripts/rnad/evaluate-direct.mjs \
            --teacher artifacts/teacher-archive/teacher/trained-model.json \
            --rnad artifacts/eta64/selfplay/final-model.json \
            --seed 988701 --pairs 32 --out artifacts/eta64-v-teacher.json
      - name: Compare archived 256-Match RNAD vs 64-Match ablation on same 32 seeds
        run: |
          node scripts/rnad/evaluate-direct.mjs \
            --teacher artifacts/teacher-archive/selfplay/final-model.json \
            --rnad artifacts/eta64/selfplay/final-model.json \
            --seed 988701 --pairs 32 --out artifacts/eta64-v-eta256.json
      - name: Preserve bounded research evidence with full checkpoint file
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-001-eta64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/eta64/ablation-report.json
            artifacts/eta64/selfplay/report.json
            artifacts/eta64/selfplay/final-model.json
            artifacts/eta64/selfplay/checkpoints/latest.json
            artifacts/eta64/selfplay/checkpoints/checkpoint-u64-*.pt
            artifacts/eta64-v-teacher.json
            artifacts/eta64-v-eta256.json
          if-no-files-found: warn
          retention-days: 30
