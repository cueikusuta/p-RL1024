name: RNAD-003 opportunity genuine checkpoint continuation 64 to 128 and c005 128 to 256
on:
  # The bounded research job has already been queued. Re-run only when explicitly needed.
  workflow_dispatch:
permissions: {}
jobs:
  continue:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, actions: read}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [base128, base256, c005]
    env:
      GH_TOKEN: ${{ github.token }}
      MODEL: ${{ matrix.model }}
      SOURCE_SHA: '03bbd42b9aa393aa8af3ede9bdb2b3ba87fdc9ea'
      SEED: '1770001'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '03bbd42b9aa393aa8af3ede9bdb2b3ba87fdc9ea', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install identical CPU training environment and recover immutable original and checkpoint
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/verify-snapshot.mjs
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p models "artifacts/opportunity-$MODEL"
          gh run download 43757054212 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-queue-models-43757054212 --dir models
          gh run download 43787170970 --repo cueikusuta/p-RL1024 \
            --name "rnad-i5-opportunity-learn-$MODEL-43787170970" \
            --dir "artifacts/opportunity-$MODEL"
          test -f "artifacts/opportunity-$MODEL/selfplay/checkpoints/latest.json"
      - name: Resume SAME optimizer, magnet, target and RNG only from verified full-state checkpoint
        run: |
          python - <<'PY'
          import hashlib,json,math,os,shutil
          from pathlib import Path
          from scripts.rnad.train import train,current_git_sha,frozen_engine_sha
          name=os.environ['MODEL'];root=Path('artifacts')/('opportunity-'+name)
          src=current_git_sha();engine=frozen_engine_sha()
          manifest=json.loads(Path('models/manifest.json').read_text())
          old=Path('models')/(name+'.json')
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          study=json.loads((root/'study-report.json').read_text())
          first=128 if name=='c005' else 64
          last=256 if name=='c005' else 128
          checkpoint_dir=root/'selfplay'/'checkpoints'
          latest=json.loads((checkpoint_dir/'latest.json').read_text())
          meta=latest['metadata']
          source=os.environ['SOURCE_SHA']
          assert src==source==study['source_sha']==meta['source_sha']==meta['training_code_sha']
          assert engine==study['engine_sha']==meta['engine_snapshot_sha']==manifest['engine_sha']
          assert manifest['schema']=='rnad-i5-queued-evaluation-models-v1'
          assert manifest['source_sha']=='f08a9587d6a7033546eab00ffa6479399ca71c2f'
          assert manifest['models'][name]==study['original_model_sha256']==h(old)
          assert manifest['is_champion'] is False and study['is_champion'] is False
          assert study['guard']=='anti-loop-v1' and study['reward_objective']=='opportunity-v1'
          assert study['complete_matches']==meta['completed_matches']==meta['updates']==first
          assert meta['model_id']=='RNAD-003-3phase-v2-anti-loop-v1-opportunity-v1'
          assert meta['switch_guard']=='anti-loop-v1' and meta['reward_objective']=='opportunity-v1'
          assert meta['initialization_sha256']==h(old)
          assert meta['initial_seed']==1770001 and meta['next_match_seed']==1770001+first
          assert len(meta['completed_match_ids'])==first and len(set(meta['completed_match_ids']))==first
          assert meta['completed_match_ids']==['rnad-match-'+str(1770001+i) for i in range(first)]
          assert latest['checkpoint_sha256']==study['latest_checkpoint_sha256']
          assert h(checkpoint_dir/latest['checkpoint_file'])==latest['checkpoint_sha256']
          for n,d in study['model_snapshots'].items():
              assert h(root/('model-u'+n+'.json'))==d
          snapshot=first;previous_sha=latest['checkpoint_sha256'];history=[]
          for block in range((last-first)//16):
              result=train(seed=1770001,matches=16,out=str(root/'selfplay'),resume=True,
                           initial_model=str(old),three_phase=True,features_v2=True,
                           switch_guard='anti-loop-v1',switch_cost='opportunity-v1',
                           eta=.2,magnet_period=4)
              completed=first+16*(block+1)
              assert result['completed_matches']==result['updates']==completed
              assert result['source_sha']==source and result['engine_sha']==engine
              assert result['initialization_sha256']==h(old)
              assert result['model_id']==meta['model_id']
              assert result['reward_objective']=='opportunity-v1' and result['switch_guard']=='anti-loop-v1'
              assert result['is_champion'] is False and len(result['results'])==16
              assert [q['seed'] for q in result['results']]==list(range(1770001+completed-16,1770001+completed))
              assert all(q['accepted_decisions']>0 and 0<=q['shaped_switches']<=q['accepted_voluntary_switches']
                and all(math.isfinite(q[k]) for k in ['loss','policy_loss','critic_loss','behavior_ratio_max'])
                and len(q['switch_cost_by_seat'])==2 and
                all(0<=x<=.200000001 for x in q['switch_cost_by_seat']) for q in result['results'])
              current=json.loads((checkpoint_dir/'latest.json').read_text())
              m=current['metadata']
              assert m['completed_matches']==m['updates']==completed
              assert m['source_sha']==m['training_code_sha']==source
              assert m['next_match_seed']==1770001+completed
              assert m['model_id']==meta['model_id'] and m['reward_objective']=='opportunity-v1'
              assert m['initial_seed']==1770001 and m['initialization_sha256']==h(old)
              assert len(set(m['completed_match_ids']))==completed
              assert m['completed_match_ids']==['rnad-match-'+str(1770001+i) for i in range(completed)]
              assert current['checkpoint_sha256']==result['last_match_checkpoint_sha']
              assert h(checkpoint_dir/current['checkpoint_file'])==current['checkpoint_sha256']
              assert current['checkpoint_sha256']!=previous_sha
              previous_sha=current['checkpoint_sha256']
              history.append({'block':block+1,'completed_matches':completed,
                'model_state_sha256':result['model_sha256'],
                'checkpoint_sha256':previous_sha,
                'accepted_decisions':sum(x['accepted_decisions'] for x in result['results']),
                'voluntary_switches':sum(x['accepted_voluntary_switches'] for x in result['results']),
                'shaped_switches':sum(x['shaped_switches'] for x in result['results'])})
              if completed in (128,192,256):
                  checkpoint=root/('model-u'+str(completed)+'.json')
                  if checkpoint.exists():
                      assert h(checkpoint)==study['model_snapshots'][str(completed)]
                  else:
                      shutil.copyfile(root/'selfplay'/'final-model.json',checkpoint)
                  assert h(checkpoint)!=h(old)
              for stale in checkpoint_dir.glob('checkpoint-u*.pt'):
                  if stale!=checkpoint_dir/current['checkpoint_file']:stale.unlink()
              print(json.dumps({'model':name,**history[-1]}),flush=True)
          summary={'schema':'rnad-i5-opportunity-full-state-continuation-v1',
              'source_sha':source,'engine_sha':engine,'parent_run':43787170970,
              'model':name,'original_sha256':h(old),
              'initial_checkpoint_sha256':study['latest_checkpoint_sha256'],
              'final_checkpoint_sha256':previous_sha,
              'start_completed_matches':first,'end_completed_matches':last,
              'initial_seed':1770001,'next_seed':1770001+last,
              'policy':'anti-loop-v1','reward_objective':'opportunity-v1',
              'retained_original_optimizer_magnet_rng':True,
              'model_snapshot_sha256':{str(x):h(root/('model-u'+str(x)+'.json'))
                for x in ([64,128,192,256] if name=='c005' else [64,128])},
              'additional_blocks':history,
              'is_champion':False,'independent_review_complete':False}
          (root/'followon-study-report.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-opportunity-followon-train-${{ matrix.model }}-${{ github.run_id }}
          path: |
            artifacts/opportunity-${{ matrix.model }}/followon-study-report.json
            artifacts/opportunity-${{ matrix.model }}/model-u*.json
            artifacts/opportunity-${{ matrix.model }}/selfplay/checkpoints/latest.json
            artifacts/opportunity-${{ matrix.model }}/selfplay/checkpoints/checkpoint-u*.pt
          if-no-files-found: warn
          retention-days: 30

  evaluate:
    needs: continue
    if: needs.continue.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, actions: read}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [base128, base256, c005]
    env:
      GH_TOKEN: ${{ github.token }}
      MODEL: ${{ matrix.model }}
      SOURCE_SHA: '03bbd42b9aa393aa8af3ede9bdb2b3ba87fdc9ea'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '03bbd42b9aa393aa8af3ede9bdb2b3ba87fdc9ea', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - name: Retrieve exact completed full-state study snapshots
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/verify-snapshot.mjs
          mkdir -p "artifacts/opportunity-$MODEL" results
          gh run download "$GITHUB_RUN_ID" --repo cueikusuta/p-RL1024 \
            --name "rnad-i5-opportunity-followon-train-$MODEL-$GITHUB_RUN_ID" \
            --dir "artifacts/opportunity-$MODEL"
      - name: Compare new and previous checkpoints at fresh held-out paired seeds
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          model=os.environ['MODEL']
          root=Path('artifacts')/('opportunity-'+model)
          study=json.loads((root/'followon-study-report.json').read_text())
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          if not(study['source_sha']==os.environ['SOURCE_SHA']
             and study['policy']=='anti-loop-v1'
             and study['reward_objective']=='opportunity-v1'
             and study['retained_original_optimizer_magnet_rng'] is True
             and study['end_completed_matches']==(256 if model=='c005' else 128)
             and study['is_champion'] is False):
              raise ValueError('Wrong full-state continuation source and policy')
          versions=['u128','u192','u256'] if model=='c005' else ['u64','u128']
          models={v:root/('model-'+v+'.json') for v in versions}
          for v,p in models.items():
              if not p.is_file() or h(p)!=study['model_snapshot_sha256'][v[1:]]:
                  raise ValueError('Wrong immutable model snapshot '+v)
          result=Path('results');result.mkdir(exist_ok=True)
          score={}
          for version,p in models.items():
              dest=result/('basic-'+version+'.json')
              cmd=['node','scripts/rnad/evaluate-neural-basic.mjs',
                '--model',str(p),'--seed','1791001','--pairs','64',
                '--selection-mode','greedy','--switch-guard','anti-loop-v1',
                '--out',str(dest)]
              subprocess.run(cmd,check=True,timeout=2700)
              d=json.loads(dest.read_text())
              score['basic-'+version]=d
          pairs=[('u64','u128')] if model!='c005' else [
                ('u128','u192'),('u128','u256'),('u192','u256')]
          for teacher,student in pairs:
              dest=result/('direct-'+student+'-vs-'+teacher+'.json')
              subprocess.run(['node','scripts/rnad/evaluate-direct.mjs',
                '--teacher',str(models[teacher]),'--rnad',str(models[student]),
                '--seed','1790001','--pairs','64','--selection-mode','greedy',
                '--guard-teacher','anti-loop-v1','--guard-rnad','anti-loop-v1',
                '--out',str(dest)],check=True,timeout=2700)
              score['direct-'+student+'-vs-'+teacher]=json.loads(dest.read_text())
          observed={}
          for key,d in score.items():
              direct=key.startswith('direct-')
              side='rnadSeat' if direct else 'candidateSeat'
              seed=1790001 if direct else 1791001
              if not (d['source_sha']==os.environ['SOURCE_SHA']
                and d['engine_sha']==study['engine_sha']
                and d['pairs']==64 and d['matches']==128
                and d['wins']==sum(1 for x in d['rows'] if x['won'])
                and len(d['rows'])==128
                and d['inference_selection_mode']=='greedy'
                and {(x['seed'],x[side]) for x in d['rows']}==
                  {(i,seat) for i in range(seed,seed+64) for seat in [0,1]}
                and all(x['score'][x[side] if x['won'] else 1-x[side]]==4
                  for x in d['rows'])
                and d['schema']==('rnad-direct-switch-guard-paired-v1' if direct else
                  'rnad-three-phase-switch-guard-vs-basic-paired-v1')):
                  raise ValueError('Incomplete/wrong source held-out 4-win pairs '+key)
              if direct:
                  student,teacher=key[7:].split('-vs-')
                  if not (d['teacher_model_sha256']==h(models[teacher]) and
                    d['rnad_model_sha256']==h(models[student])):
                      # key: direct-u128-vs-u64 => rnad=u128, teacher=u64
                      raise ValueError('Wrong direct actor SHA')
                  if d['deployment_policy']!={'teacher_switch_guard':'anti-loop-v1',
                    'rnad_switch_guard':'anti-loop-v1'} or d['is_champion'] is not False:
                      raise ValueError('Wrong direct guard')
              else:
                  version=key[6:]
                  if not (d['model_sha256']==h(models[version])
                    and d['deployment_policy']=={'switch_guard':'anti-loop-v1'}
                    and d['champion_promoted'] is False):
                      raise ValueError('Wrong Basic model or policy')
              observed[key]={'wins':d['wins'],'matches':d['matches']}
          output={'schema':'rnad-i5-opportunity-followon-eval-v1',
            'source_sha':os.environ['SOURCE_SHA'],'engine_sha':study['engine_sha'],
            'model':model,'train_completed_matches':study['end_completed_matches'],
            'evaluations':observed,'holdout_direct_seed':1790001,
            'holdout_basic_seed':1791001,'is_champion':False,
            'strength_proven':False,'independent_review_complete':False}
          (result/'verified-evaluation.json').write_text(json.dumps(output,indent=2)+'\n')
          print(json.dumps(output),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-opportunity-followon-eval-${{ matrix.model }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: evaluate
    if: needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Restore exactly three verified held-out evaluation reports
        run: |
          set -euo pipefail
          mkdir -p reports
          gh run download "$GITHUB_RUN_ID" --repo cueikusuta/p-RL1024 \
            --pattern "rnad-i5-opportunity-followon-eval-*-$GITHUB_RUN_ID" --dir reports
          python - <<'PY'
          from pathlib import Path
          import json
          found={}
          for p in Path('reports').rglob('verified-evaluation.json'):
              x=json.loads(p.read_text())
              n=x['model']
              if n in found or x['schema']!='rnad-i5-opportunity-followon-eval-v1':
                  raise ValueError('Wrong or duplicate evaluation')
              found[n]=x
          if set(found)!={'base128','base256','c005'}:
              raise ValueError('Missing one comparable model')
          if len({(x['source_sha'],x['engine_sha']) for x in found.values()})!=1:
              raise ValueError('Mixed source and engine in next research cohort')
          data={'schema':'rnad-i5-opportunity-followon-aggregate-v1',
            'sources':{k:v['source_sha'] for k,v in found.items()},
            'results':found,
            'proven_strength_improvement':False,'is_champion':False,
            'independent_review_complete':False}
          Path('reports/summary.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps({k:v['evaluations'] for k,v in found.items()}),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-i5-opportunity-followon-summary-${{ github.run_id }}
          path: reports/summary.json
          if-no-files-found: error
          retention-days: 30
