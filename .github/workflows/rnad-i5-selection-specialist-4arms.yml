name: RNAD I5 selection specialist four-arm imitation study
on:
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths:
      - docs/research/rnad/SELECTION_SPECIALIST_4ARMS_LAUNCH_2026-11-17.json
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-i5-selection-specialist-reuse-256-exploratory
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    env: {PYTHONHASHSEED: '0', OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Verify registered reuse-only data, frozen model, 4 arms and no league start
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/research/rnad/SELECTION_SPECIALIST_4ARMS_LAUNCH_2026-11-17.json')
          m=json.loads(p.read_text())
          assert set(m)=={'schema','source_teacher_run','source_sha','train_seed','train_matches',
                          'heldout_seed','heldout_matches','arms','epochs',
                          'research_only','league_training_started'}
          assert m['schema']=='rnad-i5-selection-specialist-fourarms-v1'
          assert m['source_teacher_run']==44032488678
          assert m['source_sha']=='022aa9cd5b4ac37514df1d845ea00c11c3c13a5c'
          assert m['train_seed']==2471001 and m['train_matches']==256
          assert m['heldout_seed']==2472001 and m['heldout_matches']==128
          assert m['arms']==['flat-hard','structured-hard','flat-mixed','structured-mixed']
          assert m['epochs']==6 and m['research_only'] is True
          assert m['league_training_started'] is False
          print('Frozen input and four preselected ablation arms verified',flush=True)
          PY
      - name: Exact authority 60-choice order and public-only feature tests
        run: node --test test/rnad-selection-specialist.test.js test/rnad-v5-features.test.js test/rnad-selection-oracle.test.js
      - name: Pinned torch, selection gradients, loss and alias checks
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
          python -m unittest discover -s test -p 'rnad_selection_specialist_test.py' -v
  compare:
    needs: preflight
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU torch
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
      - name: Download original accepted teacher data and frozen v5 selection student only once
        run: |
          set -euo pipefail
          mkdir -p original-selection original-traces
          gh run download 44032488678 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-3phase-256-accepted-teacher-data \
            --dir original-traces
          gh run download 44032488678 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-256-selection-battle-imitation \
            --dir original-selection
          test "$(find original-traces/traces/train -name 'teacher-*.json' | wc -l)" -eq 256
          test "$(find original-traces/traces/heldout -name 'teacher-*.json' | wc -l)" -eq 128
          test -s original-selection/selection/trained-model.json
          test -s original-selection/selection-heldout/heldout-imitation.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('original-selection/selection-heldout/heldout-imitation.json').read_text())
          assert b['source_sha']=='022aa9cd5b4ac37514df1d845ea00c11c3c13a5c'
          assert b['teacher_id']=='rnad-aq-public-strategy-selection-v1'
          assert b['feature_schema']=='rnad-three-phase-features-v5'
          assert b['seed']==2472001 and b['matches']==128
          assert b['utility_labels']=='aq-public-phase-rank-v1'
          assert 0.2648 < b['phases']['selection']['top1_accuracy'] < 0.2650
          assert b['is_champion'] is False
          print('Original 256+128 accepted data and 26.49% frozen comparison confirmed',flush=True)
          PY
      - name: Train four selection-only model/loss arms and compare same frozen teacher decisions
        run: |
          set -euo pipefail
          python -m scripts.rnad.train_selection_specialist \
            --train-dir original-traces/traces/train \
            --heldout-dir original-traces/traces/heldout \
            --frozen-selection-model original-selection/selection/trained-model.json \
            --baseline-report original-selection/selection-heldout/heldout-imitation.json \
            --out results/selection-specialist
          cat results/selection-specialist/SELECTION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          test -s results/selection-specialist/selection-four-arm-report.json
          test "$(find results/selection-specialist -maxdepth 1 -name '*.json' | wc -l)" -eq 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-selection-specialist-fourarms
          path: results/selection-specialist/
          if-no-files-found: warn
          retention-days: 90
