name: I5 Learner staging real 1280-Match CPU profile
on:
  push:
    branches: [perf/5-rnad-shared-league-throughput]
    paths:
      - scripts/rnad/shared_league_staging.py
      - scripts/rnad/shared_league_prep_profile.py
      - scripts/rnad/shared_league_learner.py
      - test/rnad_shared_league_staging_test.py
      - .github/workflows/rnad-i5-learner-staging-profile.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: i5-learner-staging-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU dependencies for contract fixtures
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Run strict staging syntax and contract tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/rnad/shared_league_staging.py scripts/rnad/shared_league_learner.py scripts/rnad/shared_league_prep_profile.py
          python -m unittest discover -s test -p rnad_shared_league_staging_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_contract_test.py -v
          python -m unittest discover -s test -p rnad_shared_learner_checkpoint_test.py -v
  historical-staging:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install exact CPU torch and NumPy for historical accepted replay
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Download original immutable authority-accepted 1280 Match G0
        run: |
          set -euo pipefail
          mkdir -p bootstrap actors
          gh run download 44318145987 --repo cueikusuta/p-RL1024 --name rnad-i5-shared-main-g0-bootstrap --dir bootstrap
          (cd bootstrap && sha256sum -c file-pins.sha256)
          for i in $(seq 0 19); do
            mkdir -p "actors/actor-$i"
            gh run download 44318145987 --repo cueikusuta/p-RL1024 \
              --name "rnad-i5-shared-main-g0-actor-$i" --dir "actors/actor-$i"
            test -s "actors/actor-$i/actor-$i.json.gz"
          done
      - name: ONE historical G0 Learner replay (no Actor simulation or repeated 40-update trials)
        run: |
          set -euo pipefail
          python -m scripts.rnad.shared_league_prep_profile \
            --bootstrap bootstrap --actors actors --workers 4 \
            --out rnad-learner-staging-report.json | tee profile.log
          python - <<'PY'
          import json
          r=json.load(open('rnad-learner-staging-report.json'))
          assert r['generations_replayed']==1
          assert r['actor_simulations_run']==0
          assert r['strictly_verified_actors']==20
          assert r['accepted_complete_four_win_matches']==1280
          assert r['optimizer_updates']==40
          assert r['checkpoint_published'] is False
          with open('profile-summary.md','w') as f:
              f.write('## I5 single existing G0 Learner performance profile (research only)\n')
              f.write(f"* Strict G0 accepted Matches: {r['accepted_complete_four_win_matches']}\n")
              f.write(f"* New simulations: {r['actor_simulations_run']}\n")
              f.write(f"* Preparation: {r['preparation_wall_seconds']}s (target <=60s: {r['preparation_at_most_60_seconds']})\n")
              f.write(f"* 40 updates: {r['forty_update_wall_seconds']}s\n")
              f.write(f"* Stage + updates: {r['combined_stage_and_40_update_seconds']}s\n")
              f.write(f"* Peak worker RSS (KiB): {r['peak_stage_worker_rss_kib']}\n")
              f.write(f"* Stage CPU phase SUMS (not wall times): {r['preparation_cpu_phase_sum_seconds']}\n")
              f.write('\nThe old G0 log provides an approximate baseline, not a paired same-SHA speedup proof. No model/Champion published.\n')
          PY
          cat profile-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-learner-staging-cpu-profile
          path: |
            rnad-learner-staging-report.json
            profile-summary.md
          retention-days: 30
          if-no-files-found: warn
