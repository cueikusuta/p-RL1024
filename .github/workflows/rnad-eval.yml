name: RNAD-001 GitHub-hosted held-out paired Match evaluation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed 40-character main commit to evaluate'
        required: true
        type: string
      initial_train_seed:
        description: 'Training series seed (for immutable checkpoint release)'
        required: true
        type: string
        default: '975021'
      eval_seed:
        description: 'Independent first held-out seed'
        required: true
        type: string
        default: '987613'
      pairs:
        description: 'Distinct seed pairs; both seats (up to 50)'
        required: true
        type: choice
        options: ['1', '5', '25', '50']
        default: '5'
permissions: {}
concurrency:
  group: rnad-001-cpu-single-writer
  cancel-in-progress: false
jobs:
  paired:
    if: github.repository == 'cueikusuta/p-RL1024' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # GitHub-hosted exclusively
    timeout-minutes: 330
    permissions:
      contents: write # publish immutable research report asset, no Champion
    env:
      GH_REPO: cueikusuta/p-RL1024
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Validate immutable provenance and distinct unseen-seed window
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRAIN_SEED: ${{ inputs.initial_train_seed }}
          EVAL_SEED: ${{ inputs.eval_seed }}
          RNAD_PAIRS: ${{ inputs.pairs }}
        run: |
          python - <<'PY'
          import os,re
          sha=os.environ['SOURCE_SHA']
          train=int(os.environ['TRAIN_SEED'])
          seed=int(os.environ['EVAL_SEED'])
          pairs=int(os.environ['RNAD_PAIRS'])
          if not re.fullmatch('[0-9a-f]{40}',sha) or not 1<=train<=0xffffffff or not 1<=seed<=0xffffffff or pairs not in (1,5,25,50):
              raise SystemExit('Invalid held-out job inputs')
          if seed+pairs-1>0xffffffff or any(train<=s<=train+2047 for s in range(seed,seed+pairs)):
              raise SystemExit('Evaluation seeds overlap the training window')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check pinned main ancestry and engine
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --depth=256 origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          node scripts/verify-snapshot.mjs
      - name: Install pinned CPU-only checkpoint reader
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
      - name: Restore and verify immutable research checkpoint
        env:
          RNAD_SOURCE_SHA: ${{ inputs.source_sha }}
          RNAD_SEED: ${{ inputs.initial_train_seed }}
        run: |
          TAG="rnad-001-${RNAD_SOURCE_SHA:0:16}-s${RNAD_SEED}"
          bash scripts/rnad/release-checkpoint.sh download "$TAG" artifacts/rnad-eval/checkpoints
          python -m scripts.rnad.export_checkpoint \
            --checkpoint artifacts/rnad-eval/checkpoints \
            --out artifacts/rnad-eval/evaluated-policy.json
      - name: Run two-seat paired full four-win Matches on held-out seeds
        env:
          EVAL_SEED: ${{ inputs.eval_seed }}
          RNAD_PAIRS: ${{ inputs.pairs }}
        run: |
          node scripts/rnad/evaluate.mjs \
            --model artifacts/rnad-eval/evaluated-policy.json \
            --seed "$EVAL_SEED" --pairs "$RNAD_PAIRS" \
            --out artifacts/rnad-eval/report.json
      - name: Publish immutable research evaluation report (never auto-promote)
        env:
          RNAD_SOURCE_SHA: ${{ inputs.source_sha }}
          RNAD_SEED: ${{ inputs.initial_train_seed }}
          EVAL_SEED: ${{ inputs.eval_seed }}
          RNAD_PAIRS: ${{ inputs.pairs }}
        run: |
          TAG="rnad-001-${RNAD_SOURCE_SHA:0:16}-s${RNAD_SEED}"
          MODEL_SHA="$(jq -r .model_sha256 artifacts/rnad-eval/report.json)"
          test "${#MODEL_SHA}" -eq 64
          NAME="paired-eval-s${EVAL_SEED}-n${RNAD_PAIRS}-${MODEL_SHA:0:12}.json"
          cp artifacts/rnad-eval/report.json "artifacts/rnad-eval/$NAME"
          gh release upload "$TAG" "artifacts/rnad-eval/$NAME" --repo "$GH_REPO"
      - name: Retain evidence with finite CI artifact lifetime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-001-paired-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rnad-eval/report.json
          if-no-files-found: warn
          retention-days: 30
