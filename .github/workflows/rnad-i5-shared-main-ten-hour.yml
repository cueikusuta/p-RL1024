  summary:
    needs: [handoff, g1, g2, g3, g4, g5, g6, g7, g8, g9, g10, g11, g12, g13, g14, g15, g16, g17, g18, g19, g20, g21, g22, g23, g24, g25, g26, g27, g28, g29, g30, g31, g32, g33, g34, g35, g36, g37, g38, g39, g40, g41, g42, g43, g44, g45, g46, g47, g48]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Summarize exactly completed research generations and 10h elapsed clock
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          states=json.loads(os.environ["NEEDS_JSON"])
          success=[int(k[1:]) for k,v in states.items()
                   if k.startswith('g') and v['result']=='success']
          failures=[k for k,v in states.items()
                    if v['result'] not in ('success','skipped')]
          assert states.get('handoff',{}).get('result')=='success',states
          assert success, 'No completed 1280-Match shared Learner generations'
          assert sorted(success)==list(range(1,max(success)+1)), states
          assert not failures, 'Generation failure; no silent continuation: '+str(failures)
          total=1280*len(success)
          updates=40*len(success)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Shared single Main 10h research\n')
              f.write(f'* Completed generations: {len(success)} (g1 to g{max(success)})\n')
              f.write(f'* New real accepted complete four-win Matches: {total:,}\n')
              f.write(f'* New single-writer optimizer steps: {updates:,}\n')
              f.write('* Only research. BestVerified, Champion and main are unchanged.\n')
          print(json.dumps({'generations_completed':len(success),
                            'new_complete_matches':total,
                            'new_optimizer_updates':updates,
                            'frozen_champion_unchanged':True}))
          PY
