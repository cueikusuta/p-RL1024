name: I5 shared single Main 10h repeated generation league
on:
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths:
      - docs/research/rnad/SHARED_LEAGUE_10H_LAUNCH_2026-11-18.json
permissions: {}
concurrency:
  group: rnad-i5-one-main-ten-hour-research
  cancel-in-progress: false

jobs:
  handoff:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Lock one Main, 10-hour budget, successful real Wave2 proof and old source
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          python - <<'PY'
          import json,subprocess
          d=json.load(open('docs/research/rnad/SHARED_LEAGUE_10H_LAUNCH_2026-11-18.json'))
          assert d=={
            'schema':'rnad-i5-ten-hour-single-main-generation-loop-v1',
            'source_sha':subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(),
            'verified_seed0_run':44318145987,
            'verified_wave2_handoff_proof_run':44324808407,
            'verified_original_training_source_sha':'0f348495dd381dbfd299e00c0346f61351212075',
            'target_budget_seconds':36000,
            'maximum_new_generations':48,
            'actor_count':20,
            'independent_seeds_per_actor':32,
            'both_seats':True,
            'four_win_complete_matches_per_generation':1280,
            'shared_optimizer_steps_per_generation':40,
            'single_shared_learner':True,
            'preserve_full_optim_target_magnet_rng':True,
            'no_action_setup_node':True,
            'frozen_champion_and_main_unchanged':True,
          },d
          PY
          test "$(gh api repos/cueikusuta/p-RL1024/actions/runs/44318145987 --jq .conclusion)" = success
          test "$(gh api repos/cueikusuta/p-RL1024/actions/runs/44324808407 --jq .conclusion)" = success
      - name: Install pinned CPU PyTorch and test multi-generation checkpoint contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
          python -m unittest discover -s test -p rnad_shared_league_handoff_test.py -v
          python -m unittest discover -s test -p rnad_shared_learner_checkpoint_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_contract_test.py -v
      - name: Verify immutable generation 1 Main/checkpoint from first success and reseal actor source
        run: |
          set -euo pipefail
          gh run download 44318145987 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-shared-main-g0-bootstrap --dir previous
          gh run download 44318145987 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-shared-main-g1-research-full-checkpoint --dir result
          (cd previous && sha256sum -c file-pins.sha256)
          python -m scripts.rnad.shared_league_handoff \
            --previous-bootstrap previous --previous-result result \
            --out bootstrap-g1 --budget-seconds 36000
          (cd bootstrap-g1 && sha256sum -c file-pins.sha256)
          python - <<'PY'
          import json
          m=json.load(open('bootstrap-g1/generation-manifest.json'))
          assert m['generation']==1 and m['seed_start']==9900641
          assert m['opponents']['historical'][0]['id']=='past-g0'
          assert m['main_sha256']!=m['magnet_sha256']
          d=json.load(open('bootstrap-g1/continuation-context.json'))
          assert d['budget_seconds']==36000
          assert d['original_generation']==1
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-i5-cont-bootstrap-g1
          path: bootstrap-g1/
          retention-days: 30
          if-no-files-found: error

  g1:
    needs: handoff
    if: ${{ needs.handoff.result == 'success' }}
    uses: ./.github/workflows/rnad-i5-shared-generation-reusable.yml
    with:
      generation: 1
      bootstrap_artifact: rnad-i5-cont-bootstrap-g1
    permissions:
      contents: read
      actions: read

  g2:
    needs: g1
    if: ${{ needs.g1.outputs.should_continue == 'true' }}
