name: RNAD-002 stronger built-in teacher baseline probe
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-strong-teacher-probe-i5
  cancel-in-progress: true
jobs:
  baseline:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify frozen Match engine and run paired all-phase teacher probe
        run: |
          node scripts/verify-snapshot.mjs
          mkdir -p artifacts/teacher-probe
          node scripts/rnad/probe-strong-teacher.mjs --seed 994501 --pairs 32 \
            --out artifacts/teacher-probe/paired.json
      - name: Retain real paired Match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-strong-teacher-${{ github.run_id }}
          path: artifacts/teacher-probe/paired.json
          if-no-files-found: warn
          retention-days: 30
