name: RNAD-001 GitHub-hosted CPU train and paired evaluation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/rnad/**'
      - 'src/ml/**'
      - 'scripts/dev/simulator/rnad-match.js'
      - 'test/rnad*'
      - 'requirements-rnad.txt'
      - '.github/workflows/rnad-train.yml'
  workflow_dispatch:
    inputs:
      matches:
        description: 'Bounded complete-Match learner smoke, 1–16'
        type: choice
        options: ['1', '2', '4', '8', '16']
        default: '1'
      seed:
        description: 'Initial RNG seed (1–4294967295)'
        type: string
        default: '975021'
permissions: {}
concurrency:
  # NEVER run two checkpoint writers on the same RNAD series concurrently.
  group: rnad-001-cpu-single-writer
  cancel-in-progress: false
jobs:
  neural-smoke:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest # GitHub-hosted only; self-hosted is forbidden.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
      - name: Verify fixed engine snapshot and full Stage0 mathematics
        run: |
          node scripts/verify-snapshot.mjs
          python -m unittest discover -s test -p 'rnad_*_test.py' -v
          node --test test/rnad-toy.test.js test/rnad-authority-match.test.js test/rnad-full-match.test.js
      - name: Validate bounded inputs
        env:
          RNAD_MATCHES: ${{ inputs.matches || '1' }}
          RNAD_SEED: ${{ inputs.seed || '975021' }}
        run: |
          python - <<'PY'
          import os
          n=int(os.environ["RNAD_MATCHES"])
          seed=int(os.environ["RNAD_SEED"])
          if not 1 <= n <= 16 or not 1 <= seed <= 0xffffffff:
              raise SystemExit("Invalid GitHub-hosted RNAD compute bounds")
          PY
      - name: Actual full-Match neural R-NaD smoke
        env:
          RNAD_MATCHES: ${{ inputs.matches || '1' }}
          RNAD_SEED: ${{ inputs.seed || '975021' }}
        run: |
          python -m scripts.rnad.train --matches "$RNAD_MATCHES" --seed "$RNAD_SEED" --out artifacts/rnad-001
      - name: Verify strict checkpoint resume (one additional Match)
        if: github.event_name == 'pull_request'
        run: |
          python -m scripts.rnad.train --matches 1 --seed 975021 --out artifacts/rnad-001 --resume
      - name: Paired held-out full Match evaluation (diagnostic only)
        run: |
          node scripts/rnad/evaluate.mjs --model artifacts/rnad-001/final-model.json --seed 987613 --pairs 1 --out artifacts/rnad-001/heldout.json
      - name: Save unpromoted experimental evidence (NOT durable Champion storage)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-001-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rnad-001/
          if-no-files-found: warn
          retention-days: 30
