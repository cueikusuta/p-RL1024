name: I5 B+C integrated v6 100-hour full four-win research league
on:
  push:
    branches: [research/5-bc-100h-league]
    paths:
      - .github/workflows/rnad-i5-bc-100h-run.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: rnad-i5-bc-100h-single-writer
  cancel-in-progress: false
jobs:
  smoke:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install bounded deterministic CPU learner dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Run combined B+C source and privacy/learning contract regressions
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          python -m py_compile scripts/rnad/bridge_bc_g199_100h.py scripts/rnad/prepare_b_opponent_profile.py scripts/rnad/shared_league_handoff.py scripts/rnad/shared_league_learner.py
          node --check scripts/rnad/shared_league_actor.mjs
          python -m unittest discover -s test -p rnad_shared_league_contract_test.py -v
          python -m unittest discover -s test -p rnad_upgrade_battle_v6_test.py -v
          node --test test/rnad-b-fixed-opponent.test.js test/rnad-v6-features.test.js
      - name: Fetch C-G199 immutable full optimizer/Target/Magnet/RNG baseline
        run: |
          set -euo pipefail
          gh api repos/cueikusuta/p-RL1024/actions/artifacts/14706377232 \
            --jq '{id,name,expired,workflow_run}' > source-artifact.json
          jq -e '.id==14706377232 and .name=="rnad-i5-cont-next-bootstrap-after-g198" and .workflow_run.id==44897382403 and .expired==false' source-artifact.json >/dev/null
          for attempt in 1 2 3 4 5 6 7; do
            rm -rf source; mkdir -p source
            if gh run download 44897382403 --repo cueikusuta/p-RL1024 \
              --name rnad-i5-cont-next-bootstrap-after-g198 --dir source; then break; fi
            if [ "$attempt" = 7 ]; then exit 1; fi
            sleep "$((attempt*15))"
          done
          (cd source && sha256sum -c file-pins.sha256)
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path("source/generation-manifest.json").read_text())
          assert m["generation"]==199
          assert m["source_sha"]=="a98bd7cf73b7d3fc2e7d4a9b81764833843653a7"
          assert m["main_sha256"]=="67b019669c8c902e672ef372c6d2c1e9d52141594672297b3574dcbe160343fb"
          assert m["battle_feature_schema"]=="rnad-three-phase-features-v6"
          assert m.get("league_opponent_profile") is None
          assert m["opponents"]["exploiter"]==[]
          assert len(m["opponents"]["fixed"])==3
          assert hashlib.sha256(Path("source/actor/manifest.json").read_bytes()).hexdigest()==m["main_sha256"]
          PY
      - name: New source pin / preserve C full state / adopt B fixed pool and start exact 100h deadline
        run: |
          set -euo pipefail
          python -m scripts.rnad.bridge_bc_g199_100h --source source --out resealed
          python -m scripts.rnad.prepare_b_opponent_profile --src resealed --out bootstrap
          (cd bootstrap && sha256sum -c file-pins.sha256)
          python - <<'PY'
          import json,hashlib,subprocess,time
          from pathlib import Path
          m=json.loads(Path("bootstrap/generation-manifest.json").read_text())
          c=json.loads(Path("bootstrap/continuation-context.json").read_text())
          idx=json.loads(Path("bootstrap/checkpoint-index.json").read_text())
          model=json.loads(Path("bootstrap/actor/battle.json").read_text())
          assert m["generation"]==199 and m["seed_start"]==9900001+199*640
          assert m["source_sha"]==subprocess.check_output(
              ["git","rev-parse","HEAD"],text=True).strip()
          assert m["league_opponent_profile"]=="rnad-i5-opponents-b-v1"
          assert m["battle_feature_schema"]=="rnad-three-phase-features-v6"
          assert {r["id"] for r in m["opponents"]["fixed"]}=={
              "fixed-aqbase001","fixed-coretrioaq001","fixed-base256","fixed-c005"}
          assert model["feature_schema"]=="rnad-three-phase-features-v6"
          assert (model["state_features"],model["action_features"])==(384,160)
          assert c["budget_seconds"]==360000 and c["source_run_id"]==44897382403
          assert c["deadline_epoch"]-c["start_epoch"]==360000
          assert c["new_continuation_source_sha"]==m["source_sha"]
          assert 0<c["deadline_epoch"]-int(time.time())<=360000
          assert hashlib.sha256(Path("bootstrap/checkpoint-g0.pt").read_bytes()).hexdigest()==idx["sha256"]
          assert m["optimizer_steps"]==40 and m["actor_count"]==20
          PY
      - name: Real four-win authority smoke covers Main / historical / all four B fixed opponents using C-v6
        run: |
          set -euo pipefail
          for actor in 0 8 16 17 18 19; do
            python -m scripts.rnad.shared_league_collect \
              --bootstrap bootstrap --actor-id "$actor" \
              --out "smoke/$actor" --smoke --match-workers 2
            test "$(find "smoke/$actor/accepted" -name '*.json.gz' | wc -l)" -eq 2
          done
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('bootstrap/generation-manifest.json').read_text())
          from scripts.rnad.shared_league_contract import _opponent
          assert {_opponent(m,i)[1]["id"] for i in (16,17,18,19)}=={
              "fixed-aqbase001","fixed-coretrioaq001","fixed-base256","fixed-c005"}
          for i in (0,8,16,17,18,19):
              p=json.loads(Path(f'smoke/{i}/actor-meta.json').read_text())
              role,op=_opponent(m,i)
              assert p['role']==role and p['opponent_sha256']==op['sha256']
          PY
      - name: One disposable genuine accepted Match Learner update, never counted as production
        run: |
          set -euo pipefail
          mkdir -p smoke-selected/self smoke-selected/frozen
          cp smoke/0/accepted/*.json.gz smoke-selected/self/
          cp smoke/17/accepted/*.json.gz smoke-selected/frozen/
          python -m scripts.rnad.shared_league_real_smoke \
            --bootstrap bootstrap --smoke smoke-selected --out smoke-checkpoint
          python - <<'PY'
          import json
          d=json.load(open("smoke-checkpoint/smoke-report.json"))
          assert d["optimizer_updates"]==1
          assert d["full_four_win_authoritative_matches"]==4
          assert all(d["updated_heads"].values())
          assert d["champion_promoted"] is False
          assert d["generation0_1280_match_training_finished"] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: rnad-i5-bc-g199-approved-bootstrap
          path: bootstrap/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-bc-g199-source-bridge-and-smoke-report
          path: |
            resealed/bc-source-bridge-report.json
            smoke-checkpoint/smoke-report.json
            source-artifact.json
          retention-days: 7
          if-no-files-found: warn

