name: I5 G422 four-decision recurrent memory
on:
  push:
    branches: [eval/5-short-bptt]
    paths: [docs/research/rnad/G422_SHORT_BPTT.json]
permissions: {contents: read, actions: read}
concurrency:
  group: i5-g422-short-bptt
  cancel-in-progress: false
env:
  PLAN: ../study/docs/research/rnad/G422_SHORT_BPTT.json
  GH_TOKEN: ${{ github.token }}
  GH_REPO: cueikusuta/p-RL1024
  BPTT_EXPERIMENT_HEAD: ${{ github.sha }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  RNAD_LEARNER_BACKEND: reference
  PYTHONHASHSEED: '0'
jobs:
  learner:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        rep: [rep0, rep1]
        arm: [control, bptt4]
    env:
      REP: ${{ matrix.rep }}
      ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: study, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 31118974e579e3a18aa5082f94bca4fa73f7ddb3, path: runtime, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Verify and reuse exactly the baseline controls' sources and accepted trajectories
        working-directory: runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 31118974e579e3a18aa5082f94bca4fa73f7ddb3
          test "$(git -C ../study rev-parse HEAD)" = "$BPTT_EXPERIMENT_HEAD"
          node scripts/verify-snapshot.mjs
          gh api repos/cueikusuta/p-RL1024/actions/runs/45783489939 --jq '.conclusion=="success" and .head_sha=="31118974e579e3a18aa5082f94bca4fa73f7ddb3"' | grep -x true
          python ../study/scripts/rnad/load_bptt_inputs.py "$PLAN" "$REP" sealed actors
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Forty updates under the preregistered graph truncation width
        working-directory: runtime
        run: |
          set -euo pipefail
          python ../study/scripts/rnad/short_bptt.py "$PLAN" "$REP" "$ARM" sealed actors trained "$BPTT_EXPERIMENT_HEAD"
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i5-bptt-trained-${{ matrix.rep }}-${{ matrix.arm }}
          path: |
            runtime/trained/generation423-actor/
            runtime/trained/generation423-magnet/
            runtime/trained/generation423-report.json
            runtime/trained/generation423-index.json
            runtime/trained/training-receipt.json
            runtime/trained/checkpoint-g423.pt
          retention-days: 14
          if-no-files-found: error
  eval-smoke:
    needs: learner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: study, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 31118974e579e3a18aa5082f94bca4fa73f7ddb3, path: runtime, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.14.0'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'i5-bptt-trained-*', path: runtime/evidence}
      - working-directory: runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 31118974e579e3a18aa5082f94bca4fa73f7ddb3
          git diff --exit-code HEAD --
          test "$(git -C ../study rev-parse HEAD)" = "$BPTT_EXPERIMENT_HEAD"
          node scripts/verify-snapshot.mjs
          cp ../study/scripts/rnad/short-bptt-eval.mjs scripts/rnad/short-bptt-eval.mjs
          node scripts/rnad/short-bptt-eval.mjs smoke "$PLAN" evidence
  evaluate:
    needs: eval-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        rep: [rep0, rep1]
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      REP: ${{ matrix.rep }}
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: study, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 31118974e579e3a18aa5082f94bca4fa73f7ddb3, path: runtime, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.14.0'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'i5-bptt-trained-${{ matrix.rep }}-*', path: runtime/evidence}
      - working-directory: runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 31118974e579e3a18aa5082f94bca4fa73f7ddb3
          git diff --exit-code HEAD --
          test "$(git -C ../study rev-parse HEAD)" = "$BPTT_EXPERIMENT_HEAD"
          node scripts/verify-snapshot.mjs
          cp ../study/scripts/rnad/short-bptt-eval.mjs scripts/rnad/short-bptt-eval.mjs
          node scripts/rnad/short-bptt-eval.mjs run "$PLAN" evidence "$REP" "$PART" shard.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'i5-bptt-eval-${{ matrix.rep }}-${{ matrix.part }}', path: 'runtime/shard.json', retention-days: 14, if-no-files-found: error}
  summary:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: study, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 31118974e579e3a18aa5082f94bca4fa73f7ddb3, path: runtime, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.14.0'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'i5-bptt-eval-*', path: runtime/evidence}
      - working-directory: runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 31118974e579e3a18aa5082f94bca4fa73f7ddb3
          git diff --exit-code HEAD --
          test "$(git -C ../study rev-parse HEAD)" = "$BPTT_EXPERIMENT_HEAD"
          node scripts/verify-snapshot.mjs
          cp ../study/scripts/rnad/short-bptt-eval.mjs scripts/rnad/short-bptt-eval.mjs
          mkdir results
          cp "$PLAN" results/plan.json
          node scripts/rnad/short-bptt-eval.mjs summary "$PLAN" evidence - - results/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'i5-bptt-report', path: 'runtime/results/', retention-days: 90, if-no-files-found: error}
