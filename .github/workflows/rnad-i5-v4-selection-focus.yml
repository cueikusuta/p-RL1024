name: RNAD I5 v4 selection-focus utility-hard mixture and AQ full-Match A/B
on:
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths: ['docs/research/rnad/SELECTION_FOCUS_MANIFEST.json']
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-i5-v4-selection-focus-one-writer
  cancel-in-progress: false
jobs:
  selection_focus:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install frozen CPU learning dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
      - name: Confirm source and one-writer bounded accepted 4-win setup
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          node --test test/rnad-v4-features.test.js test/rnad-selection-oracle.test.js test/rnad-v4-phase-ablation.test.js
          python -m unittest discover -s test -p 'rnad_*_test.py' -v
          mkdir -p archive models/v3 models results
          gh run download 43957735875 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-v4-utility-iteration-43957735875 --dir archive
          gh run download 43829072730 --repo cueikusuta/p-RL1024 \
            --name rnad-v3-u4-checkpoint-128-43829072730 --dir models/v3
          mapfile -t p < <(find archive -type f -path '*/v4-utility/trained-model.json')
          test "${#p[@]}" -eq 1
          cp "${p[0]}" models/utility-initial-v4.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {PersistentRNADInference} from './scripts/rnad/infer.mjs';
          import {createOpponent,weightsSha256 as AQ} from './models/aq-base.mjs';
          const h=p=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const m=JSON.parse(readFileSync('docs/research/rnad/SELECTION_FOCUS_MANIFEST.json'));
          const keys=['iteration','origin_run','teacher_seed','teacher_matches','epochs',
            'heldout_seed','heldout_matches','selfplay_seed','selfplay_matches',
            'aq_seed','aq_pairs'];
          if(m.schema!=='rnad-i5-selection-focus-v1'||Object.keys(m).length!==keys.length+1||
             keys.some(k=>!Number.isSafeInteger(m[k])||m[k]<1)||
             m.iteration!==2||m.origin_run!==43957735875||
             m.teacher_matches>256||m.epochs>6||
             m.heldout_matches>32||m.selfplay_matches>16||
             m.aq_pairs>100||!(
               m.teacher_seed+m.teacher_matches<m.heldout_seed&&
               m.heldout_seed+m.heldout_matches<m.selfplay_seed&&
               m.selfplay_seed+m.selfplay_matches<m.aq_seed))
            throw new Error('Invalid one-shot independently seeded selection study');
          if(h('models/utility-initial-v4.json')!==
             '3624014308a4667a15cf2a567dc7836cf6b8e60a6e754eac3b9d0dbfe4ad0c8c'||
             h('models/v3/selfplay/final-model.json')!==
             'c5932531a2ed9e54079dbd915962624dadabc28a2e67893f0a38e96b4adeb75b'||
             new PersistentRNADInference('models/utility-initial-v4.json').featureSchema!==
                'rnad-three-phase-features-v4'||createOpponent().modelSha256!==AQ)
            throw new Error('Frozen source model or AQ benchmark SHA changed');
          JS
      - name: Train selection-focus utility plus hard-label mixture on trusted complete AQ Matches
        run: |
          set -euo pipefail
          m=docs/research/rnad/SELECTION_FOCUS_MANIFEST.json
          field() { node -e 'const m=require("./"+process.argv[1]);console.log(m[process.argv[2]])' "$m" "$1"; }
          python -m scripts.rnad.train_teacher \
            --out artifacts/selection-focus \
            --seed "$(field teacher_seed)" --matches "$(field teacher_matches)" \
            --epochs "$(field epochs)" --three-phase --features-v4 \
            --initial-model models/utility-initial-v4.json \
            --teacher aq-public-strategy-selection \
            --phase-balanced --phase-profile selection-focus \
            --utility-distillation --utility-mix 0.5
      - name: Paired heldout utility regret and imitation against frozen original v4
        run: |
          set -euo pipefail
          m=docs/research/rnad/SELECTION_FOCUS_MANIFEST.json
          field() { node -e 'const m=require("./"+process.argv[1]);console.log(m[process.argv[2]])' "$m" "$1"; }
          for model in baseline focus; do
            if [ "$model" = baseline ]; then file=models/utility-initial-v4.json
            else file=artifacts/selection-focus/trained-model.json; fi
            python -m scripts.rnad.evaluate_aq_imitation \
              --model "$file" --features-v4 --utility-labels \
              --teacher aq-public-strategy-selection \
              --seed "$(field heldout_seed)" --matches "$(field heldout_matches)" \
              --out "artifacts/heldout-$model"
          done
          python -m scripts.rnad.phase_imitation_goals \
            --baseline artifacts/heldout-baseline/heldout-imitation.json \
            --candidate artifacts/heldout-focus/heldout-imitation.json \
            --min-examples 256 --out results/imitation.json
      - name: Bounded R-NaD continuation after selection-focused imitation
        run: |
          set -euo pipefail
          m=docs/research/rnad/SELECTION_FOCUS_MANIFEST.json
          field() { node -e 'const m=require("./"+process.argv[1]);console.log(m[process.argv[2]])' "$m" "$1"; }
          python -m scripts.rnad.train \
            --seed "$(field selfplay_seed)" --matches "$(field selfplay_matches)" \
            --three-phase --features-v4 --switch-guard anti-loop-v1 \
            --initial-model artifacts/selection-focus/trained-model.json \
            --updates-per-match 4 --out artifacts/selection-focus-rnad
      - name: Exact AQ-Base four-win seed-paired original/focus/focus-RNaD selection-only A/B
        run: |
          set -euo pipefail
          m=docs/research/rnad/SELECTION_FOCUS_MANIFEST.json
          field() { node -e 'const m=require("./"+process.argv[1]);console.log(m[process.argv[2]])' "$m" "$1"; }
          for source in original focus continued; do
            if [ "$source" = original ]; then file=models/utility-initial-v4.json
            elif [ "$source" = focus ]; then file=artifacts/selection-focus/trained-model.json
            else file=artifacts/selection-focus-rnad/final-model.json; fi
            for mode in all-v3 selection-v4; do
              node scripts/rnad/evaluate-v4-composite-vs-aq.mjs \
                --v4 "$file" --v3 models/v3/selfplay/final-model.json \
                --seed "$(field aq_seed)" --pairs "$(field aq_pairs)" \
                --mode "$mode" --out "results/$source-$mode.json"
            done
          done
      - name: Validate source and 3-arm familywise delta without model promotion
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {compareV4PhaseArms,compareV4PhaseModels}
            from './scripts/rnad/compare-v4-phase-arms.mjs';
          const get=(a,b)=>JSON.parse(readFileSync('results/'+a+'-'+b+'.json'));
          const control=get('original','all-v3');
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const rows=['original','focus','continued'].map(name=>{
            const v=get(name,'selection-v4');
            const r=compareV4PhaseArms(control,v,{familySize:3});
            if(r.source_sha!==source||r.familywise_comparisons!==3)
              throw new Error('Wrong source or unadjusted selection A/B');
            return {name,...r};
          });
          const focus=compareV4PhaseModels(get('original','selection-v4'),
            get('focus','selection-v4'),{familySize:2});
          const continued=compareV4PhaseModels(get('focus','selection-v4'),
            get('continued','selection-v4'),{familySize:2});
          const report={schema:'rnad-i5-selection-focus-study-v1',
            source_sha:source,predeclared_arms:rows.map(x=>x.name),
            familywise_method:'Bonferroni_Hoeffding95',
            rows,focus_vs_original:focus,continued_vs_focus:continued,
            champion_promoted:false};
          writeFileSync('results/selection-study.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({control:control.wins,
            variants:rows.map(x=>({name:x.name,wins:x.candidate_wins,
              delta:x.delta,family_ci:x.familywise_95pct_delta_bounds})),
            focus_vs_original:focus.paired_delta,
            continued_vs_focus:continued.paired_delta}));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-v4-selection-focus-${{ github.run_id }}
          path: |
            artifacts/selection-focus/
            artifacts/heldout-baseline/heldout-imitation.json
            artifacts/heldout-focus/heldout-imitation.json
            artifacts/selection-focus-rnad/
            results/
          retention-days: 30
          if-no-files-found: warn
