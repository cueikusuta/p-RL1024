name: RNAD-001 256 Match after optional teacher warm-start (hosted)
on:
  # Research evidence re-run queued in #43683127479; no redundant PR replays.
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-001-warmstart-256-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pretrained-selfplay:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest # GitHub-hosted only, no self-hosted runners.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch and NumPy
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Verify pinned engine and initialize from accepted Stage0 teacher
        run: |
          node scripts/verify-snapshot.mjs
          python -m scripts.rnad.research_warmstart --out artifacts/rnad-warmstart
      - name: Evaluate pure untrained initialization on same 32 seed pairs
        run: |
          node scripts/rnad/evaluate.mjs --model artifacts/rnad-warmstart/teacher/initial-model.json --seed 988201 --pairs 32 --out artifacts/rnad-warmstart/untrained-heldout.json
      - name: Evaluate optional Stage0 teacher before RNAD on same 32 pairs
        run: |
          node scripts/rnad/evaluate.mjs --model artifacts/rnad-warmstart/teacher/trained-model.json --seed 988201 --pairs 32 --out artifacts/rnad-warmstart/teacher-heldout.json
      - name: Evaluate Stage0-teacher then 256 RNAD updates on same 32 pairs
        run: |
          node scripts/rnad/evaluate.mjs --model artifacts/rnad-warmstart/selfplay/final-model.json --seed 988201 --pairs 32 --out artifacts/rnad-warmstart/rnad-heldout.json
      - name: Preserve research reports, not promote Champion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-001-warmstart-256-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rnad-warmstart/warmstart-report.json
            artifacts/rnad-warmstart/teacher/teacher-report.json
            artifacts/rnad-warmstart/teacher/initial-model.json
            artifacts/rnad-warmstart/teacher/trained-model.json
            artifacts/rnad-warmstart/untrained-heldout.json
            artifacts/rnad-warmstart/teacher-heldout.json
            artifacts/rnad-warmstart/rnad-heldout.json
            artifacts/rnad-warmstart/selfplay/report.json
            artifacts/rnad-warmstart/selfplay/checkpoints/latest.json
            artifacts/rnad-warmstart/selfplay/checkpoints/checkpoint-*.pt
            artifacts/rnad-warmstart/selfplay/final-model.json
          if-no-files-found: warn
          retention-days: 30
