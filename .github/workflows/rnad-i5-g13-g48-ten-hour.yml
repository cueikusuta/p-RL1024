    needs: bridge
    if: ${{ needs.bridge.result == 'success' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 13
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g12
      source_ref: 01501f3a1e12511140bf772d435d39c0c07319bc
    permissions:
