name: I1 one-stage eight-host 16-model CPU fast 256
on:
  push:
    branches: ['research/gha-cpu-shards-20261115']
    paths:
      - '.github/workflows/i975-cpu-matrix-fast.yml'
      - 'scripts/run-hosted-batch.mjs'
      - 'scripts/run-experiment.mjs'
      - 'scripts/merge-hosted-training.mjs'
      - 'scripts/hosted-proof.mjs'
      - 'test/hosted-proof.test.js'
  workflow_dispatch:
permissions: {}
jobs:
  train-and-aggregate:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify snapshot and Match provenance
        run: |
          node scripts/verify-snapshot.mjs
          node --test test/hosted-proof.test.js test/hosted-shards.test.js
      - name: Run two independent 16-Match learners concurrently per host
        env:
          JOB_INDEX: ${{ matrix.index }}
        shell: bash
        run: |
          node scripts/run-hosted-batch.mjs --job-index "$JOB_INDEX" --parallel 2 --shards 16 --total 256 --seed 975020 --out artifacts
      - name: Preserve peer model and checkpoint evidence
        if: always() && matrix.index != 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: i1-fast-matrix-${{ github.run_id }}-shard-${{ matrix.index }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
      - name: Wait for complete peer artifacts (leader only)
        if: matrix.index == 0
        env:
          GH_TOKEN: ${{ github.token }}
          RL_SHARDS: '8'
        run: node scripts/wait-hosted-artifacts.mjs
      - name: Download peer checkpoint evidence (leader only)
        if: matrix.index == 0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: i1-fast-matrix-${{ github.run_id }}-shard-*
          path: peer-artifacts
      - name: Stage every shard and verify all 256 Matches (leader only)
        if: matrix.index == 0
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p all-shards
          for dir in peer-artifacts/*/shard-* artifacts/shard-*; do
            cp -a "$dir" "all-shards/$(basename "$dir")"
          done
          node scripts/merge-hosted-training.mjs --dir all-shards --model RL-Deep --opponent AQ-Base-001 --total 256 --shards 16 --seed 975020 --out artifacts/training-aggregate.json
      - name: Preserve aggregate and leader model/checkpoints
        if: always() && matrix.index == 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: i1-fast-matrix-aggregate-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
