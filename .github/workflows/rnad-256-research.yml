name: RNAD-001 research 256 complete Matches (hosted-only, no promotion)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/rnad/research_256.py'
      - '.github/workflows/rnad-256-research.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-001-cpu-single-writer
  cancel-in-progress: false
jobs:
  training-256:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest # GitHub-hosted only, never self-hosted.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch (no GPU or self-hosted runner)
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Verify frozen engine before any self-play
        run: node scripts/verify-snapshot.mjs
      - name: Run exactly 16 batches of 16 real complete Matches
        run: |
          python -m scripts.rnad.research_256 --seed 975201 --out artifacts/rnad-256
      - name: Evaluate initial untrained Actor on independent 32-seed paired holdout
        run: |
          node scripts/rnad/evaluate.mjs --model artifacts/rnad-256/initial-model.json --seed 987781 --pairs 32 --out artifacts/rnad-256/initial-heldout.json
      - name: Evaluate the trained Actor on the SAME 32-seed paired holdout
        run: |
          node scripts/rnad/evaluate.mjs --model artifacts/rnad-256/final-model.json --seed 987781 --pairs 32 --out artifacts/rnad-256/trained-heldout.json
      - name: Preserve exact research evidence, never promote Champion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-001-research-256-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rnad-256/scale-report.json
            artifacts/rnad-256/report.json
            artifacts/rnad-256/initial-heldout.json
            artifacts/rnad-256/trained-heldout.json
            artifacts/rnad-256/checkpoints/latest.json
            artifacts/rnad-256/initial-model.json
            artifacts/rnad-256/final-model.json
          if-no-files-found: warn
          retention-days: 30
