name: Synthetic 20 MiB private league transport
on:
  push:
    branches: [perf/league-private-handoff-synthetic-20261127]
permissions:
  contents: read
concurrency:
  group: synthetic-league-handoff-one-shot
  cancel-in-progress: false
jobs:
  dummy:
    if: github.repository == 'cueikusuta/p-RL1024' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/perf/league-private-handoff-synthetic-20261127'
    environment: league-synthetic-handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read exactly one verified dummy file from private storage
        env:
          LEAGUE_BULK_READ_SSH_KEY: ${{ secrets.LEAGUE_BULK_READ_SSH_KEY }}
        run: bash transfer.sh "7455033f820f2712e9a2fa48006804c02b9a7bd3"
      - name: Return only fabricated data and clock proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: league-bulk-fabricated-only-v1
          path: ${{ runner.temp }}/league-synthetic-return/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
