name: Synthetic gradient scheduling
on:
  push:
    branches: [perf/league-private-handoff-synthetic-20261127]
    paths: [ci/speed-stream-gradient-test.py]
permissions:
  contents: read
concurrency:
  group: league-gradient-schedule-fixture
  cancel-in-progress: false
jobs:
  scheduler:
    if: github.repository == 'cueikusuta/p-RL1024' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 ci/speed-stream-gradient-test.py
