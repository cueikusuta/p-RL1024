name: RNAD I5 larger teacher draft imitation 128 vs frozen32
on:
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths: ['docs/research/rnad/DRAFT_IMITATION_128_LAUNCH_2026-11-17.json']
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-i5-128-draft-imitation-data-and-train
  cancel-in-progress: false
jobs:
  gather:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - name: Confirm bounded disjoint one-time teacher dataset and immutable baseline
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {plannedSeeds,readConfirmationPlan}
            from './scripts/rnad/draft-confirmation-protocol.mjs';
          const m=JSON.parse(readFileSync(
            'docs/research/rnad/DRAFT_IMITATION_128_LAUNCH_2026-11-17.json'));
          const {plan}=readConfirmationPlan(
            'docs/research/rnad/DRAFT_CONFIRMATION_PLAN_2026-11-17.json');
          if(m.schema!=='rnad-i5-imitation-128-once-v1'||
             m.train_seed!==2461001||m.train_matches!==128||
             m.holdout_seed!==2462001||m.holdout_matches!==64||
             m.epochs!==4||m.baseline_run!==43986137367||
             m.baseline_sha256!=='da186af7581485382b4f558f356ac285bbf071817239cba7271cb05615e3b037'||
             m.purpose!=='teacher-imitation-only-not-game-strength')
            throw new Error('Unregistered research budget/teacher seed or model');
          const old=new Set(plannedSeeds(plan));
          const newSeeds=Array.from({length:192},(_,i)=>
            i<128?m.train_seed+i:m.holdout_seed+i-128);
          if(newSeeds.length!==new Set(newSeeds).size||
             newSeeds.some(s=>old.has(s)))
            throw new Error('Teacher seed overlaps prior fixed-N AQ strength holdout');
          console.log('Reserved 128 training + 64 untouched teacher holdout Match seeds');
          JS
      - name: Fetch and SHA-pin old actual 32-Match Deep Sets model once
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh run download 43986137367 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-draft-deepsets-study-43986137367 --dir baseline
          test -s baseline/deepsets-soft-full.json
          printf '%s  %s\n' \
            da186af7581485382b4f558f356ac285bbf071817239cba7271cb05615e3b037 \
            baseline/deepsets-soft-full.json | sha256sum -c -
      - name: Gather full accepted AQ teacher draft choices, without holdout training
        run: |
          set -euo pipefail
          mkdir -p traces/train traces/heldout
          python - <<'PY'
          import subprocess
          for tag,start,count in [('train',2461001,128),
                                  ('heldout',2462001,64)]:
              for i in range(count):
                  seed=start+i
                  subprocess.run([
                    'node','scripts/rnad/export-teacher.mjs',
                    '--seed',str(seed),
                    '--out',f'traces/{tag}/teacher-{seed}.json',
                    '--three-phase','true',
                    '--teacher','aq-public-strategy-selection',
                    '--features-v4','true',
                    '--utility-labels','true',
                    '--draft-review','true'
                  ],check=True,stdout=subprocess.DEVNULL,timeout=480)
                  if (i+1)%16==0:
                      print(f'authority export {tag}: {i+1}/{count} complete',
                            flush=True)
          PY
          test "$(find traces/train -type f -name 'teacher-*.json' | wc -l)" -eq 128
          test "$(find traces/heldout -type f -name 'teacher-*.json' | wc -l)" -eq 64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-i5-imitation-128-frozen-data
          path: |
            traces/
            baseline/deepsets-soft-full.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  train_and_compare:
    needs: gather
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU torch and verify gradients and frozen weights contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
          node scripts/verify-snapshot.mjs
          python -m unittest discover -s test -p 'rnad_draft_deepsets_test.py' -v
          python -m unittest discover -s test -p 'rnad_draft_imitation_128_test.py' -v
      - name: Download only data from this exact Git/source workflow run
        run: |
          set -euo pipefail
          mkdir -p input
          gh run download "${{ github.run_id }}" --repo cueikusuta/p-RL1024 \
            --name rnad-i5-imitation-128-frozen-data --dir input
          test -s input/baseline/deepsets-soft-full.json
          test "$(find input/traces/train -type f -name 'teacher-*.json' | wc -l)" -eq 128
          test "$(find input/traces/heldout -type f -name 'teacher-*.json' | wc -l)" -eq 64
      - name: Train 128-Match teacher imitation and compare on untouched 64-Match holdout
        run: |
          set -euo pipefail
          python -m scripts.rnad.train_draft_imitation_128 \
            --train-dir input/traces/train --train-seed 2461001 \
            --holdout-dir input/traces/heldout --holdout-seed 2462001 \
            --frozen-baseline input/baseline/deepsets-soft-full.json \
            --out results/imitation128
          cat results/imitation128/IMITATION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          test -s results/imitation128/imitation-report.json
          test -s results/imitation128/soft128.json
          test -s results/imitation128/sharp128.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-imitation-128-training-and-heldout
          path: results/imitation128/
          retention-days: 90
          if-no-files-found: warn
          overwrite: true
