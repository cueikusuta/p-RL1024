name: I5 shared NeuRD real accepted four-win Match update smoke
on:
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths:
      - docs/research/rnad/SHARED_LEARNER_REAL_SMOKE_LAUNCH_2026-11-18.json
permissions: {}
concurrency:
  group: rnad-i5-real-smoke-one-time
  cancel-in-progress: false
jobs:
  real_shared_update:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Validate one-shot source run, distinct smoke optimizer and zero Champion permissions
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('docs/research/rnad/SHARED_LEARNER_REAL_SMOKE_LAUNCH_2026-11-18.json').read_text())
          assert m == {
             'schema':'rnad-i5-real-authority-shared-learner-smoke-v1',
             'source_run_id':44318145987,
             'original_accepted_source_sha':'0f348495dd381dbfd299e00c0346f61351212075',
             'accepted_real_matches':4,
             'optimizer_updates':1,
             'temporary_disposable_checkpoint':True,
             'reuses_only_untrained_authority_smoke':True,
             'writes_to_training_main_checkpoint':False,
             'champion_promoted':False,
          },m
          PY
          python -m py_compile scripts/rnad/shared_league_real_smoke.py
      - name: Install CPU PyTorch for actual shared update
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Reuse accepted two-seat authority smoke + exact frozen Main and Magnet
        run: |
          set -euo pipefail
          gh run download 44318145987 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-shared-main-g0-bootstrap --dir bootstrap
          gh run download 44318145987 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-shared-main-g0-real-match-smoke --dir smoke
          (cd bootstrap && sha256sum -c file-pins.sha256)
          test "$(find smoke -name '*.json.gz' | wc -l)" -eq 4
      - name: One actual accepted Match batch NeuRD/V-trace update and full restart
        run: |
          set -euo pipefail
          python -m scripts.rnad.shared_league_real_smoke \
            --bootstrap bootstrap --smoke smoke --out result
          python - <<'PY'
          import json
          r=json.load(open('result/smoke-report.json'))
          assert r['full_four_win_authoritative_matches']==4
          assert r['optimizer_updates']==1
          assert all(r['updated_heads'].values())
          assert r['generation0_1280_match_training_finished'] is False
          assert r['champion_promoted'] is False
          PY
          cat result/smoke-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-accepted-real-three-head-one-update-smoke
          path: result/
          retention-days: 90
          if-no-files-found: warn
