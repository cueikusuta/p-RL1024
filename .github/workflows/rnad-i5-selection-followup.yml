name: RNAD I5 selection gap and capacity follow-up
on:
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths:
      - docs/research/rnad/SELECTION_FOLLOWUP_LAUNCH_2026-11-17.json
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-i5-selection-followup-256-128-reuse
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    env: {PYTHONHASHSEED: '0', OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Validate pinned scope, immutable game and no league start
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/research/rnad/SELECTION_FOLLOWUP_LAUNCH_2026-11-17.json').read_text())
          assert data=={
            'schema':'rnad-i5-selection-followup-v1',
            'teacher_source_run':44032488678,
            'reference_four_arm_run':44039529263,
            'train_match_counts':[128,256],
            'network_widths':[64,96,128],
            'epochs':6,
            'development_heldout_matches':128,
            'fresh_confirmatory_holdout':False,
            'teacher_visited_only':True,
            'league_training_started':False,
            'champion_promoted':False,
          }
          PY
      - name: Public observation and legal-order JS contracts
        run: node --test test/rnad-selection-specialist.test.js test/rnad-v5-features.test.js
      - name: Pinned torch, specialist SHA and diagnostic tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
          python -m unittest discover -s test -p 'rnad_selection_specialist_test.py' -v
  compare:
    needs: preflight
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Pinned torch and project dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
      - name: Recover exactly the archived accepted AQ Matches and selected structured-hard weight
        run: |
          set -euo pipefail
          mkdir -p old-teacher old-model
          gh run download 44032488678 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-3phase-256-accepted-teacher-data \
            --dir old-teacher
          gh run download 44039529263 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-selection-specialist-fourarms \
            --dir old-model
          test "$(find old-teacher/traces/train -name 'teacher-*.json' | wc -l)" -eq 256
          test "$(find old-teacher/traces/heldout -name 'teacher-*.json' | wc -l)" -eq 128
          echo '1b5f39cee6f00d1fe5c095442996fb706086dd4456d84ce5974a861f9e4e81cd  old-model/structured-hard.json' | sha256sum -c -
      - name: Run six fixed independent-count x capacity arms and record gap/alias diagnosis
        run: |
          set -euo pipefail
          python -m scripts.rnad.selection_specialist_followup \
            --train-dir old-teacher/traces/train \
            --heldout-dir old-teacher/traces/heldout \
            --previous-model old-model/structured-hard.json \
            --out results/selection-followup
          cat results/selection-followup/FOLLOWUP_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          test -s results/selection-followup/selection-followup-report.json
          test "$(find results/selection-followup -maxdepth 1 -name '*.pt' | wc -l)" -eq 6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-selection-followup-sixarms
          path: results/selection-followup/
          if-no-files-found: warn
          retention-days: 90
