name: RNAD-I5 v3-U4 exact-checkpoint 16-to-64 continuation and original AQ AB
on:
  # One bounded checkpoint-resumed research experiment. Manual thereafter.
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths: ['.github/workflows/rnad-v3-u4-cont64-aq-i5.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-i5-v3-u4-exact-checkpoint-continuation
  cancel-in-progress: false
jobs:
  continue64:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 1239fcc57c92d5c7a7649e5fdf2b6e69e121a315
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Pin original learning implementation and reproduce full optimizer provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1239fcc57c92d5c7a7649e5fdf2b6e69e121a315"
          node scripts/verify-snapshot.mjs
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p models artifacts/v3-u4
          gh run download 43757054212 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-queue-models-43757054212 --dir models
          gh run download 43811192719 --repo cueikusuta/p-RL1024 \
            --name rnad-v3-pilot-v3-u4-43811192719 --dir artifacts/v3-u4
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/v3-u4/selfplay')
          m=json.loads((root/'checkpoints/latest.json').read_text())
          meta=m['metadata']
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          prior=root/'checkpoints'/m['checkpoint_file']
          manifest=json.loads(Path('models/manifest.json').read_text())
          if not (m['schema']=='rnad-pytorch-checkpoint-v1' and
              m['checkpoint_sha256']==sha(prior)=='b24fb8a28093cd93ba26015ee1bb4f55a74c7fae61d6d1772b26f74e338f6f71' and
              meta['model_id']=='RNAD-004-3phase-v3-anti-loop-v1-u4' and
              meta['source_sha']==meta['training_code_sha']=='1239fcc57c92d5c7a7649e5fdf2b6e69e121a315' and
              meta['engine_snapshot_sha']=='ea81165993110ee9fb3a09dcb97c6708c0d7397b' and
              meta['initial_seed']==1830001 and meta['next_match_seed']==1830017 and
              meta['completed_matches']==16 and meta['updates']==64 and
              meta['accepted_decisions']>0 and len(meta['completed_match_ids'])==16 and
              meta['optimizer_updates_per_match']==4 and
              meta['initialization_sha256']==manifest['models']['base128']==sha('models/base128.json') and
              sha(root/'final-model.json')=='b80fdb5b41205573ededc3a3668523915a2891bd98acd2e9568c63a015ded09a' and
              manifest['engine_sha']==meta['engine_snapshot_sha']):
              raise ValueError('Wrong source-bound restorable v3-U4 state; stop before training')
          print('Verified exact complete 16-Match optimizer/RNG checkpoint and model')
          PY
      - name: Resume real accepted training with three 16-Match increments to 64
        run: |
          set -euo pipefail
          for expected in 32 48 64; do
            python -m scripts.rnad.train --seed 1830001 --matches 16 \
              --resume --out artifacts/v3-u4/selfplay \
              --initial-model models/base128.json --three-phase \
              --features-v3 --migrate-from-v2 --switch-guard anti-loop-v1 \
              --updates-per-match 4
            EXPECTED="$expected" python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          root=Path('artifacts/v3-u4/selfplay')
          x=json.loads((root/'checkpoints/latest.json').read_text())
          m=x['metadata'];count=int(os.environ['EXPECTED'])
          cp=root/'checkpoints'/x['checkpoint_file']
          digest=hashlib.sha256(cp.read_bytes()).hexdigest()
          if not (x['checkpoint_sha256']==digest and
            m['source_sha']=='1239fcc57c92d5c7a7649e5fdf2b6e69e121a315' and
            m['engine_snapshot_sha']=='ea81165993110ee9fb3a09dcb97c6708c0d7397b' and
            m['completed_matches']==count and m['updates']==count*4 and
            m['next_match_seed']==1830001+count and
            len(m['completed_match_ids'])==count and
            m['completed_match_ids']==['rnad-match-'+str(i)
               for i in range(1830001,1830001+count)]):
            raise ValueError('Incomplete or untrusted checkpoint resume boundary')
          print(json.dumps({'completed_matches':count,'updates':m['updates'],
            'checkpoint_sha256':digest,'accepted_decisions':m['accepted_decisions']}))
          PY
            # Keep only the exact latest resumable optimizer checkpoint.
            LATEST=$(python -c "import json;print(json.load(open('artifacts/v3-u4/selfplay/checkpoints/latest.json'))['checkpoint_file'])")
            find artifacts/v3-u4/selfplay/checkpoints -name 'checkpoint-u*.pt' ! -name "$LATEST" -delete
          done
      - name: Verify final continuous state and record bounded training evidence
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('artifacts/v3-u4')
          weights=root/'selfplay/final-model.json'
          m=json.loads((root/'selfplay/checkpoints/latest.json').read_text())['metadata']
          b=weights.read_bytes();sha=hashlib.sha256(b).hexdigest()
          if (not len(m['completed_match_ids'])==64 or
              m['completed_matches']!=64 or m['updates']!=256 or
              sha=='b80fdb5b41205573ededc3a3668523915a2891bd98acd2e9568c63a015ded09a'):
              raise ValueError('Expected a genuinely new 64-Match trained model')
          out={'schema':'rnad-i5-v3-u4-16-to-64-resume-v1',
               'training_source_sha':'1239fcc57c92d5c7a7649e5fdf2b6e69e121a315',
               'engine_sha':'ea81165993110ee9fb3a09dcb97c6708c0d7397b',
               'origin_model_sha256':'b80fdb5b41205573ededc3a3668523915a2891bd98acd2e9568c63a015ded09a',
               'continued_model_sha256':sha,
               'completed_accepted_matches':64,
               'optimizer_updates':256,'initial_seed':1830001,
               'is_champion':False,'training_was_resumed':True}
          (root/'continuation-report.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-v3-u4-checkpoint-64-${{ github.run_id }}
          path: |
            artifacts/v3-u4/continuation-report.json
            artifacts/v3-u4/selfplay/final-model.json
            artifacts/v3-u4/selfplay/report.json
            artifacts/v3-u4/selfplay/checkpoints/latest.json
            artifacts/v3-u4/selfplay/checkpoints/checkpoint-u*.pt
          if-no-files-found: warn
          retention-days: 30
  versus_aq:
    needs: continue64
    if: needs.continue64.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: {contents: read, actions: read}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [origin16, continued64]
    env:
      GH_TOKEN: ${{ github.token }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0,persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - name: Restore both frozen models without retraining or secrets
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          mkdir -p models/continued models/origin results
          gh run download "$GITHUB_RUN_ID" --repo cueikusuta/p-RL1024 \
            --name "rnad-v3-u4-checkpoint-64-$GITHUB_RUN_ID" --dir models/continued
          gh run download 43811192719 --repo cueikusuta/p-RL1024 \
            --name rnad-v3-pilot-v3-u4-43811192719 --dir models/origin
          if [[ "$VARIANT" == origin16 ]]; then
            cp models/origin/selfplay/final-model.json models/evaluated.json
          else
            cp models/continued/selfplay/final-model.json models/evaluated.json
          fi
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {createOpponent,weightsSha256} from './models/aq-base.mjs';
          const sha=p=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const lineage=JSON.parse(readFileSync('models/continued/continuation-report.json'));
          const prior='b80fdb5b41205573ededc3a3668523915a2891bd98acd2e9568c63a015ded09a';
          const origin=sha('models/origin/selfplay/final-model.json');
          const continued=sha('models/continued/selfplay/final-model.json');
          const selected=sha('models/evaluated.json');
          if(origin!==prior||continued===origin||
             lineage.continued_model_sha256!==continued||
             selected!==(process.env.VARIANT==='origin16'?origin:continued)||
             lineage.training_was_resumed!==true||
             createOpponent().modelSha256!==weightsSha256)
            throw new Error('Mixed or missing original v3-U4 checkpoint lineage');
          JS
      - name: Compare each version versus ORIGINAL AQ on same 24 new paired seeds
        run: |
          set -euo pipefail
          node scripts/rnad/evaluate-vs-aq-full.mjs \
            --model models/evaluated.json --seed 1977001 --pairs 24 \
            --phase-mode neural-all --switch-guard anti-loop-v1 \
            --out "results/$VARIANT.json"
      - name: Source/seat/4-win provenance and old-or-new weight distinction
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const a=JSON.parse(readFileSync('results/'+process.env.VARIANT+'.json'));
          const hash=createHash('sha256').update(readFileSync('models/evaluated.json')).digest('hex');
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(a.schema!=='rnad-vs-original-aq-base-full-match-paired-v1'||
             a.source_sha!==source||a.model_sha256!==hash||
             a.seed!==1977001||a.pairs!==24||a.matches!==48||
             a.rows.length!==48||a.champion_promoted!==false||
             a.wins!==a.rows.filter(x=>x.won).length||
             new Set(a.rows.map(x=>x.seed+':'+x.candidateSeat)).size!==48)
            throw new Error('Untrusted or incomplete original AQ model comparison');
          console.log(JSON.stringify({variant:process.env.VARIANT,
             wins:a.wins,rate:a.win_rate,ci95:a.paired_hoeffding_95pct}));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-v3-u4-aq-${{ matrix.variant }}-${{ github.run_id }}
          path: results/${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 30
