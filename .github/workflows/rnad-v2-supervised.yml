name: RNAD-003 hosted semantic v2 AQ teacher 128-Match pretraining
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ml/rnad-phase-features-v2.js'
      - 'scripts/rnad/evaluate_aq_imitation.py'
      - 'scripts/rnad/infer.mjs'
      - '.github/workflows/rnad-v2-supervised.yml'
permissions: {}
concurrency:
  group: rnad-003-semantic-v2-supervised-i5
  cancel-in-progress: false
jobs:
  teacher-v2:
    if: github.repository == 'cueikusuta/p-RL1024' && github.event.pull_request.head.sha == '39948501caf06965855b1ee3516a3b32c447f691'
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned GitHub-hosted CPU training dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Verify immutable engine, no hidden projection and semantic v2 feature contract
        run: |
          node scripts/verify-snapshot.mjs
          node --test test/rnad-three-phase-features-v2.test.js
          node --check scripts/rnad/export-teacher.mjs
          node --check scripts/rnad/infer.mjs
          python -m py_compile scripts/rnad/train_teacher.py scripts/rnad/evaluate_aq_imitation.py scripts/rnad/neural.py
      - name: Learn frozen-AQ public accepted action labels from 128 full Matches, semantic v2
        run: |
          python -m scripts.rnad.train_teacher \
            --three-phase --teacher aq-public-belief --features-v2 \
            --seed 996001 --matches 128 --epochs 4 \
            --out artifacts/aq-supervision-v2
      - name: Quantify unseen 16-Match per-phase teacher agreement (never training seeds)
        run: |
          python -m scripts.rnad.evaluate_aq_imitation \
            --features-v2 \
            --model artifacts/aq-supervision-v2/trained-model.json \
            --seed 996301 --matches 16 --out artifacts/aq-v2-heldout
      - name: Pair 128 new seed blocks, both seats, versus frozen all-phase Basic
        run: |
          node scripts/rnad/evaluate-neural-basic.mjs \
            --model artifacts/aq-supervision-v2/trained-model.json \
            --seed 997001 --pairs 128 \
            --out artifacts/aq-supervision-v2/basic-heldout.json
      - name: Preserve both teacher and out-of-sample comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-003-aq-semantic-v2-${{ github.run_id }}
          path: |
            artifacts/aq-supervision-v2/teacher-report.json
            artifacts/aq-supervision-v2/initial-model.json
            artifacts/aq-supervision-v2/trained-model.json
            artifacts/aq-supervision-v2/basic-heldout.json
            artifacts/aq-v2-heldout/heldout-imitation.json
          if-no-files-found: warn
          retention-days: 30
