name: RNAD-001 hosted-only scale batch (post-review)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed immutable 40-char main commit with Stage0 CI PASS'
        required: true
        type: string
      initial_seed:
        description: 'Fixed RNAD-001 seed (1–4294967295)'
        required: true
        type: string
        default: '975021'
      batches:
        description: 'Number of 16-Match batches (1–4 per run; never exceeds 2048 total)'
        required: true
        type: choice
        options: ['1', '2', '4']
        default: '1'
permissions: {}
concurrency:
  # Serializes with every other RNAD trainer producing immutable release assets.
  group: rnad-001-cpu-single-writer
  cancel-in-progress: false
jobs:
  batch:
    if: github.repository == 'cueikusuta/p-RL1024' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # GitHub-hosted exclusively; never self-hosted
    timeout-minutes: 330
    permissions:
      contents: write # only this post-review main workflow may publish checkpoint assets
    env:
      GH_REPO: cueikusuta/p-RL1024
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Validate inputs before checkout or asset writes
        env:
          PINNED_SHA: ${{ inputs.source_sha }}
          RNAD_SEED: ${{ inputs.initial_seed }}
          RNAD_BATCHES: ${{ inputs.batches }}
        run: |
          python - <<'PY'
          import os,re
          sha=os.environ['PINNED_SHA']; seed=int(os.environ['RNAD_SEED'])
          batches=int(os.environ['RNAD_BATCHES'])
          if re.fullmatch(r'[a-f0-9]{40}',sha) is None or not 1<=seed<=0xffffffff or batches not in (1,2,4):
              raise SystemExit('Invalid bounded source SHA / seed / batch count')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify pinned source is reviewed MAIN history
        env:
          PINNED_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          git fetch --no-tags --depth=256 origin main
          git merge-base --is-ancestor "$PINNED_SHA" origin/main
          node scripts/verify-snapshot.mjs
          test -f docs/research/rnad/PLAN.md
      - name: Install pinned CPU-only research environment
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
      - name: Verify source pinned mathematical and inference contracts
        run: |
          python -m unittest discover -s test -p 'rnad_*_test.py' -v
          node --test test/rnad-stage0-contract.test.js test/rnad-receipts.test.js test/rnad-authority-match.test.js test/rnad-full-match.test.js test/rnad-toy.test.js test/rnad-evaluation.test.js
      - name: Restore latest immutable accepted full-Match checkpoint (if present)
        env:
          RNAD_SOURCE_SHA: ${{ inputs.source_sha }}
          RNAD_SEED: ${{ inputs.initial_seed }}
        run: |
          TAG="rnad-001-${RNAD_SOURCE_SHA:0:16}-s${RNAD_SEED}"
          bash scripts/rnad/release-checkpoint.sh download "$TAG" artifacts/rnad-001/checkpoints
      - name: Continue a small bounded 16-Match batch, publish each batch
        env:
          RNAD_SOURCE_SHA: ${{ inputs.source_sha }}
          RNAD_SEED: ${{ inputs.initial_seed }}
          RNAD_BATCHES: ${{ inputs.batches }}
        run: |
          set -euo pipefail
          TAG="rnad-001-${RNAD_SOURCE_SHA:0:16}-s${RNAD_SEED}"
          for ((i=0;i<RNAD_BATCHES;i++)); do
            if [[ -f artifacts/rnad-001/checkpoints/latest.json ]]; then
              COMPLETED="$(jq -r '.metadata.completed_matches' artifacts/rnad-001/checkpoints/latest.json)"
              [[ "$COMPLETED" =~ ^[0-9]+$ ]] || exit 2
              if (( COMPLETED + 16 > 2048 )); then
                echo "RNAD-001 research limit reached: completed=$COMPLETED"
                python -m scripts.rnad.export_checkpoint \\
                  --checkpoint artifacts/rnad-001/checkpoints \\
                  --out artifacts/rnad-001/final-model.json
                exit 0
              fi
              python -m scripts.rnad.train --seed "$RNAD_SEED" --matches 16 \
                --out artifacts/rnad-001 --resume
            else
              python -m scripts.rnad.train --seed "$RNAD_SEED" --matches 16 \
                --out artifacts/rnad-001
            fi
            bash scripts/rnad/release-checkpoint.sh upload "$TAG" \
              artifacts/rnad-001/checkpoints
          done
      - name: Evaluate a small held-out paired sample (not Champion)
        if: success()
        run: |
          node scripts/rnad/evaluate.mjs --model artifacts/rnad-001/final-model.json \
            --seed 987613 --pairs 2 --out artifacts/rnad-001/heldout-batch.json
      - name: Retain bounded diagnostic logs separately from durable checkpoint releases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-001-hosted-scale-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rnad-001/report.json
            artifacts/rnad-001/heldout-batch.json
            artifacts/rnad-001/checkpoints/latest.json
            artifacts/rnad-001/checkpoints/checkpoint-*.pt
          if-no-files-found: warn
          retention-days: 30
