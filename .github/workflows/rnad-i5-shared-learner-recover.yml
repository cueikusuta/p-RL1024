name: I5 Shared Main Learner recovery from immutable 20 Actor artifacts
on:
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths:
      - docs/research/rnad/SHARED_LEAGUE_V1_RECOVERY_2026-11-18.json
permissions: {}
concurrency:
  group: rnad-i5-one-shared-learner-recovery
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Ensure source run completed accepted actors but never succeeded as learner
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('docs/research/rnad/SHARED_LEAGUE_V1_RECOVERY_2026-11-18.json').read_text())
          assert m == {
             'schema':'rnad-i5-shared-learner-single-writer-recovery-v1',
             'source_run_id':44318145987,
             'actor_checkout_sha':'0f348495dd381dbfd299e00c0346f61351212075',
             'streaming_learner_source_sha':'ed8b5f7b83b8bc23d6e4b12772b70278afa1a86b',
             'source_1280_complete_match_artifacts_reused':True,
             'new_authority_matches_generated':False,
             'separate_champion_and_research':True,
             'learner_restarted_from_genesis_if_no_checkpoint':True,
             'no_second_writer_on_same_run':True,
          }, m
          PY
          gh api repos/cueikusuta/p-RL1024/actions/runs/44318145987/jobs \
            --paginate --jq '.jobs[] | [.name,.conclusion] | @tsv' > /tmp/jobs.tsv
          python - <<'PY'
          rows=dict(line.strip().split('\t') for line in open('/tmp/jobs.tsv'))
          assert len([k for k in rows if k.startswith('actor (') and rows[k]=='success'])==20,rows
          assert rows.get('preflight')=='success' and rows.get('bootstrap')=='success'
          assert rows.get('authority_smoke')=='success'
          assert rows.get('learner') in ('failure','cancelled'),rows
          PY
  learner:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Recover only bounded-memory Learner implementation with auditable code delta
        run: |
          set -euo pipefail
          git cat-file -e 0f348495dd381dbfd299e00c0346f61351212075^{commit}
          git cat-file -e ed8b5f7b83b8bc23d6e4b12772b70278afa1a86b^{commit}
          git show ed8b5f7b83b8bc23d6e4b12772b70278afa1a86b:scripts/rnad/shared_league_learner.py > /tmp/recovery-learner.py
          git switch --detach 0f348495dd381dbfd299e00c0346f61351212075
          cp /tmp/recovery-learner.py scripts/rnad/shared_league_learner.py
          sha256sum scripts/rnad/shared_league_learner.py > /tmp/recovery-learner.sha256
          python -m py_compile scripts/rnad/shared_league_learner.py
          printf '%s\n' 'Actor source SHA and explicit patched Learner code SHA are distinct.' \
            >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/recovery-learner.sha256 >> "$GITHUB_STEP_SUMMARY"
      - name: Install CPU learner
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Reuse all 20 SHA-pinned accepted actor artifacts, never rerun Matches
        run: |
          set -euo pipefail
          gh run download 44318145987 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-shared-main-g0-bootstrap --dir bootstrap
          (cd bootstrap && sha256sum -c file-pins.sha256)
          for n in $(seq 0 19); do
            mkdir -p "actors/actor-$n"
            gh run download 44318145987 --repo cueikusuta/p-RL1024 \
              --name "rnad-i5-shared-main-g0-actor-$n" --dir "actors/actor-$n"
            test -s "actors/actor-$n/actor-$n.json.gz"
          done
          node scripts/verify-snapshot.mjs
      - name: Exact 1280 accepted Match strict verification, 40 shared optimizer steps
        run: |
          set -euo pipefail
          python -m scripts.rnad.shared_league_learner \
            --bootstrap bootstrap --actors actors --out research-output \
            --original-draft bootstrap/original-draft.json \
            --original-selection-js bootstrap/original-selection-js.json
          sha256sum scripts/rnad/shared_league_learner.py > research-output/learner-code.sha256
          python - <<'PY'
          import json
          r=json.load(open('research-output/generation1-report.json'))
          assert r['accepted_complete_four_win_matches']==1280
          assert r['optimizer_updates_completed']==40
          assert r['champion_promoted'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-shared-main-g1-recovered-sha-pinned-checkpoint
          path: research-output/
          retention-days: 90
          if-no-files-found: warn
