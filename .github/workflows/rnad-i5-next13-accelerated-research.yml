name: I5 accelerated 13-generation shared league (source-pinned smoke first)
on:
  push:
    branches: [perf/5-rnad-shared-league-throughput]
    paths:
      - docs/research/rnad/NEXT13_SHARED_LEAGUE_LAUNCH_2026-11-19.json
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-i5-next13-accelerated-research
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Confirm one-shot immutable 20 Actor 40 update research protocol
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('docs/research/rnad/NEXT13_SHARED_LEAGUE_LAUNCH_2026-11-19.json').read_text())
          assert m == {
            'schema':'rnad-i5-next13-accelerated-research-launch-v1',
            'source_sha':subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(),
            'generation_count':13,'actor_count':20,'seeds_per_actor':32,
            'both_seats':True,'complete_matches_per_generation':1280,
            'updates_per_generation':40,'github_hosted_cpu_only':True,
            'small_real_match_smoke_first':True,'recovery_fail_closed':True,
            'no_automatic_champion_promotion':True
          },m
          PY
          python -m py_compile scripts/rnad/shared_league_bootstrap.py \
            scripts/rnad/integrated_policy_v1.py \
            scripts/rnad/shared_league_contract.py \
            scripts/rnad/shared_league_collect.py \
            scripts/rnad/shared_league_learner.py
          node --check scripts/rnad/shared_league_actor.mjs
      - name: Install bounded CPU PyTorch + deterministic NumPy
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
      - name: Trainable three-head graph, 20 actor aggregation and seed/restart contract tests
        run: |
          set -euo pipefail
          python -m unittest discover -s test -p rnad_integrated_policy_v1_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_contract_test.py -v
          python -m unittest discover -s test -p rnad_neural_test.py -v
          python -m unittest discover -s test -p rnad_draft_battle_holdout_recovery_test.py -v
          node --test test/rnad-authority-match.test.js test/rnad-receipts.test.js test/rnad-three-phase.test.js test/rnad-infer-allocation-parity.test.js test/rnad-draft-fastpath-parity.test.js test/rnad-paired-league-eval.test.js
          python -m unittest discover -s test -p rnad_shared_league_advanced_perf_test.py -v
          python -m unittest discover -s test -p rnad_shared_initial_historical_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_artifact_recovery_test.py -v

  bootstrap:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install pinned torch CPU
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Download and pin only previously trained specialist/model artifacts
        run: |
          set -euo pipefail
          mkdir -p frozen/DB frozen/A frozen/AJS frozen/old
          download_frozen() {
            local run="$1" name="$2" dir="$3" attempt
            for attempt in 1 2 3 4 5; do
              rm -rf "$dir"; mkdir -p "$dir"
              if gh run download "$run" --repo cueikusuta/p-RL1024 \
                  --name "$name" --dir "$dir"; then return 0; fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed verified frozen source artifact $name" >&2
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }
          download_frozen 44096608535 rnad-i5-draft-battle-512-frozen-trained-model-archive frozen/DB
          download_frozen 44067733118 rnad-i5-selection-A-4096-six-models-and-dev frozen/A
          download_frozen 44085352444 rnad-i5-A4096-vs-A2048-public-js-SHA-checked frozen/AJS
          download_frozen 43757054212 rnad-i5-queue-models-43757054212 frozen/old
          for path in frozen/DB/draft512/draft512-e6.json \
              frozen/DB/draft512/study.json \
              frozen/DB/battle512/trained-model.json \
              frozen/DB/battle512/teacher-report.json \
              frozen/A/selection-A-4096-e60-s90252.pt \
              frozen/A/selection-A-4096-development.json \
              frozen/AJS/A4096.json frozen/old/manifest.json; do
            test -s "$path"
          done
          python -m scripts.rnad.shared_league_bootstrap \
            --draft frozen/DB/draft512/draft512-e6.json \
            --draft-report frozen/DB/draft512/study.json \
            --selection frozen/A/selection-A-4096-e60-s90252.pt \
            --selection-study frozen/A/selection-A-4096-development.json \
            --selection-js frozen/AJS/A4096.json \
            --battle frozen/DB/battle512/trained-model.json \
            --battle-report frozen/DB/battle512/teacher-report.json \
            --old-pool frozen/old --out bootstrap
          python - <<'PY'
          import json
          m=json.load(open('bootstrap/generation-manifest.json'))
          assert len(m['opponents']['fixed'])==3
          assert m['actor_count']==20 and m['optimizer_steps']==40
          assert m['seed_start']==9900001
          PY
          cp frozen/DB/draft512/draft512-e6.json bootstrap/original-draft.json
          cp frozen/AJS/A4096.json bootstrap/original-selection-js.json
          (cd bootstrap && sha256sum actor/*.json fixed/*.json \
            checkpoint-g0.pt > file-pins.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-i5-next13-g0-bootstrap
          path: bootstrap/
          retention-days: 90
          if-no-files-found: error

  authority_smoke:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Real complete four-win Match acceptance with self and frozen opponent
        run: |
          set -euo pipefail
          gh run download "${{ github.run_id }}" --repo cueikusuta/p-RL1024 \
            --name rnad-i5-next13-g0-bootstrap --dir bootstrap
          (cd bootstrap && sha256sum -c file-pins.sha256)
          node scripts/verify-snapshot.mjs
          python -m scripts.rnad.shared_league_collect --bootstrap bootstrap \
            --actor-id 0 --smoke --out smoke/self
          python -m scripts.rnad.shared_league_collect --bootstrap bootstrap \
            --actor-id 8 --smoke --out smoke/historical
          python -m scripts.rnad.shared_league_collect --bootstrap bootstrap \
            --actor-id 14 --smoke --out smoke/frozen
          test "$(find smoke -name '*.json.gz' | wc -l)" -eq 6
          # Validate ALL 20 logical Actor IDs on real authority Matches before
          # allocating 1,280 Matches and running any shared optimizer generation.
          # The smoke population is 40 distinct full Matches and is diagnostic;
          # it is NOT a full training generation or a strength comparison.
          python - <<'PY'
          import gzip, json
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from scripts.rnad.shared_league_collect import collect
          root = Path("smoke")
          directories = {0:"self", 8:"historical", 14:"frozen"}
          missing = [i for i in range(20) if i not in directories]
          def run(i):
              result = collect(bootstrap="bootstrap", actor_id=i,
                  out=str(root/f"actor-{i}"), smoke=True)
              assert result["smoke_complete_matches"] == 2
              return i
          with ThreadPoolExecutor(max_workers=4) as pool:
              completed = sorted(pool.map(run, missing))
          assert completed == missing
          records = {}
          for i in range(20):
              directory = root/directories.get(i, f"actor-{i}")/"accepted"
              paths = sorted(directory.glob("*.json.gz"))
              assert len(paths) == 2, f"Actor {i} incomplete smoke"
              rows = []
              for path in paths:
                  with gzip.open(path,"rt") as source:
                      row = json.load(source)
                  assert row["completed"] is True
                  assert row["score"][row["winner"]] == 4
                  assert row["learner_seat"] in (0,1)
                  assert row["source_sha"] == json.load(
                      open("bootstrap/generation-manifest.json"))["source_sha"]
                  assert row["events"]
                  rows.append(row)
              assert sorted(x["learner_seat"] for x in rows) == [0,1]
              for row in rows:
                  assert row["match_id"] not in records
                  records[row["match_id"]] = row
          assert len(records) == 40
          (root/"twenty-actor-real-smoke-report.json").write_text(json.dumps({
              "schema":"rnad-i5-20actor-two-matches-per-actor-smoke-v1",
              "actors_checked":20,"complete_matches":40,
              "all_seats_verified":True,"not_a_full_generation":True,
              "not_a_strength_claim":True
          },indent=2)+"\n")
          PY
          # This is a functional optimizer/checkpoint smoke only, never a strength estimate.
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
          python - <<'PY'
          import gzip, hashlib, json, math
          from pathlib import Path
          import torch
          from scripts.rnad.shared_league_learner import _models, _match_loss
          torch.set_num_threads(1)
          root=Path("bootstrap")
          cp=torch.load(root/"checkpoint-g0.pt",map_location="cpu",weights_only=True)
          model,target,magnet,optimizer,scheduler=_models(root,cp)
          losses=[]
          for directory,role in (("self","self"),("historical","historical"),("frozen","fixed")):
              matches=sorted((Path("smoke")/directory/"accepted").glob("*.json.gz"))
              assert len(matches)==2, f"Expected 2 accepted Matches from {directory}"
              with gzip.open(matches[0],"rt") as src: record=json.load(src)
              assert record["completed"] is True
              loss,ratio=_match_loss(model,target,magnet,record,role=role)
              assert math.isfinite(float(loss.detach())) and math.isfinite(float(ratio))
              (loss/3).backward()
              losses.append(float(loss.detach()))
          norm=torch.nn.utils.clip_grad_norm_(model.parameters(),10.0,error_if_nonfinite=True)
          assert math.isfinite(float(norm))
          optimizer.step()
          scheduler.step()
          assert all(torch.isfinite(p).all() for p in model.parameters())
          cp["model"]={k:v.clone() for k,v in model.state_dict().items()}
          cp["optimizer"]=optimizer.state_dict()
          cp["scheduler"]=scheduler.state_dict()
          cp["torch_rng"]=torch.get_rng_state()
          torch.save(cp,"smoke/checkpoint-smoke.pt")
          restored=torch.load("smoke/checkpoint-smoke.pt",map_location="cpu",weights_only=True)
          model2,_,_,optimizer2,scheduler2=_models(root,restored)
          assert all(torch.equal(a,b) for a,b in zip(model.parameters(),model2.parameters()))
          assert optimizer2.state_dict()["state"]
          assert scheduler2.last_epoch == scheduler.last_epoch
          report={"schema":"rnad-i5-next13-two-match-optimizer-smoke-v1",
                  "complete_real_matches_generated":6,
                  "matches_used_in_smoke_optimizer":3,
                  "finite_losses":True,"optimizer_step":1,
                  "checkpoint_restored":True,
                  "not_a_full_generation":True,"not_a_strength_claim":True}
          (Path("smoke")/"small-optimizer-report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report))
          PY
          rm -f smoke/checkpoint-smoke.pt
          # Do not release the first 20-Actor generation until same-SHA
          # accelerated regression checks have completed successfully.
          ci_success=0
          for attempt in $(seq 1 180); do
            conclusions="$(gh api "repos/cueikusuta/p-RL1024/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "I5 shared R-NaD throughput isolated regression") | .conclusion' 2>/dev/null || true)"
            if printf '%s\n' "$conclusions" | grep -qx success; then
              ci_success=1; break
            fi
            if printf '%s\n' "$conclusions" | grep -Eqx 'failure|timed_out|cancelled|action_required'; then
              echo "Same-source accelerated regression CI is not green" >&2
              exit 1
            fi
            sleep 20
          done
          test "$ci_success" = 1
          echo "Same-source performance CI green; small accepted-Match optimizer/checkpoint smoke green" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-next13-small-real-match-smoke
          path: smoke/
          retention-days: 30
          if-no-files-found: warn

  g0:
    needs: authority_smoke
    if: ${{ needs.authority_smoke.result == 'success' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 0
      bootstrap_artifact: rnad-i5-next13-g0-bootstrap
    permissions:
      contents: read
      actions: read

  g1:
    needs: g0
    if: ${{ needs.g0.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 1
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g0
    permissions:
      contents: read
      actions: read

  g2:
    needs: g1
    if: ${{ needs.g1.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 2
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g1
    permissions:
      contents: read
      actions: read

  g3:
    needs: g2
    if: ${{ needs.g2.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 3
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g2
    permissions:
      contents: read
      actions: read

  g4:
    needs: g3
    if: ${{ needs.g3.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 4
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g3
    permissions:
      contents: read
      actions: read

  g5:
    needs: g4
    if: ${{ needs.g4.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 5
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g4
    permissions:
      contents: read
      actions: read

  g6:
    needs: g5
    if: ${{ needs.g5.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 6
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g5
    permissions:
      contents: read
      actions: read

  g7:
    needs: g6
    if: ${{ needs.g6.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 7
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g6
    permissions:
      contents: read
      actions: read

  g8:
    needs: g7
    if: ${{ needs.g7.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 8
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g7
    permissions:
      contents: read
      actions: read

  g9:
    needs: g8
    if: ${{ needs.g8.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 9
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g8
    permissions:
      contents: read
      actions: read

  g10:
    needs: g9
    if: ${{ needs.g9.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 10
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g9
    permissions:
      contents: read
      actions: read

  g11:
    needs: g10
    if: ${{ needs.g10.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 11
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g10
    permissions:
      contents: read
      actions: read

  g12:
    needs: g11
    if: ${{ needs.g11.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 12
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g11
    permissions:
      contents: read
      actions: read
