name: RNAD-003 validate completed switch-guard A/B without rerunning Matches
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/rnad-switch-guard-archive-audit-i5.yml']
  workflow_dispatch:
permissions: {}
jobs:
  audit:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Restore exact saved complete Match outcomes and frozen weights
        run: |
          set -euo pipefail
          mkdir -p models reports
          gh run download 43757054212 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-queue-models-43757054212 --dir models
          gh run download 43779235844 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-switch-guard-ab-43779235844 --dir reports
      - name: Audit exact two-seat outcomes and policy versions from archive only
        run: |
          python -m scripts.rnad.audit_switch_guard_ab \
            --models models --reports reports --out reports/verified-switch-guard-ab.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-switch-guard-archive-verification-${{ github.run_id }}
          path: reports/verified-switch-guard-ab.json
          if-no-files-found: warn
          retention-days: 30
