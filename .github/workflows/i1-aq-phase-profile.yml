name: I1 AQ CPU phase profiler
on:
  push:
    branches: ['research/gha-cpu-shards-20261115']
    paths: ['.github/workflows/i1-aq-phase-profile.yml', 'scripts/profile-aq-training.mjs']
  workflow_dispatch:
permissions: {}
jobs:
  profile:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify source snapshot
        run: node scripts/verify-snapshot.mjs
      - name: Profile 16 complete AQ-Base Matches and prove identical learned model
        run: node scripts/profile-aq-training.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: i1-aq-phase-profile-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
