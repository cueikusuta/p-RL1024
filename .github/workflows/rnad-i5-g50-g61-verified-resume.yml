name: I5 G50-G61 verified recovery continuation (no extra strength evaluation)
on:
  push:
    branches: [research/5-g49-strength-continuation]
    paths:
      - docs/research/rnad/G50_G61_RESUME_LAUNCH_2026-11-20.json
permissions: {}
concurrency:
  group: rnad-i5-g49-strength-single-writer
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read}
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - id: verify
        name: Verify immutable source and one-shot G50 launch scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          path = 'docs/research/rnad/G50_G61_RESUME_LAUNCH_2026-11-20.json'
          request = json.load(open(path))
          code_sha = subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          diff = subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).strip()
          assert diff == path, 'One-shot launch must not edit any source or weights'
          assert request == {
              'schema':'rnad-i5-g50-g61-source-migration-launch-v1',
              'source_sha':code_sha,
              'previous_source_sha':'a54ff4d14e2e5aa56cf35f44b95685a3f744cb69',
              'g49_recovery_run_id':44707159157,
              'g50_artifact_id':14615009232,
              'g50_bootstrap_artifact':'rnad-i5-cont-next-bootstrap-after-g49',
              'first_generation':50,'last_generation':61,
              'matches_per_generation':1280,'updates_per_generation':40,
              'full_state_preservation':True,
              'github_hosted_cpu_only':True,
              'no_extra_strength_evaluation':True,'no_champion_promotion':True,
          }, 'Wrong artifact, SHA, generation or approved scope'
          print('Approved immutable G50 continuation source:', code_sha)
          PY
          echo "source_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Strict G50-G61 artifact and source migration contract check
        run: |
          set -euo pipefail
          python -m py_compile scripts/rnad/g50_strength_resume_migration.py
          python -m unittest discover -s test -p rnad_shared_league_artifact_recovery_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_handoff_test.py -v

  bootstrap:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Verify origin recovery artifact identity and fetch without replay
        run: |
          set -euo pipefail
          gh api repos/cueikusuta/p-RL1024/actions/artifacts/14615009232 > origin-artifact.json
          python - <<'PY'
          import json
          a=json.load(open('origin-artifact.json'))
          assert a['id']==14615009232
          assert a['name']=='rnad-i5-cont-next-bootstrap-after-g49'
          assert a['expired'] is False
          assert a.get('workflow_run',{}).get('id')==44707159157
          PY
          for attempt in 1 2 3 4 5 6 7; do
            rm -rf previous-g50; mkdir -p previous-g50
            if gh run download 44707159157 --repo cueikusuta/p-RL1024 \
                --name rnad-i5-cont-next-bootstrap-after-g49 --dir previous-g50; then break; fi
            if [ "$attempt" = 7 ]; then exit 1; fi
            sleep "$((attempt*10))"
          done
          (cd previous-g50 && sha256sum -c file-pins.sha256)
      - name: CPU PyTorch for exact audited full-state migration
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Migrate immutable G50 checkpoint with all tensors and RNG preserved
        run: |
          set -euo pipefail
          python -m scripts.rnad.g50_strength_resume_migration --source previous-g50 --out bootstrap
          (cd bootstrap && sha256sum -c file-pins.sha256)
          python - <<'PY'
          import json, torch, subprocess
          m=json.load(open('bootstrap/generation-manifest.json'))
          c=torch.load('bootstrap/checkpoint-g0.pt',map_location='cpu',weights_only=True)
          assert m['generation']==c['generation']==50
          assert m['seed_start']==9900001+50*640
          assert m['source_sha']==c['source_sha']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert c['cumulative_complete_matches']==64000 and c['cumulative_optimizer_updates']==2000
          assert len(m['opponents']['historical'])==3
          assert c['is_champion'] is False
          PY
          node scripts/verify-snapshot.mjs
      - name: Required real accepted Match smoke only; no strength evaluation
        run: |
          set -euo pipefail
          for actor in 0 8 16; do
            python -m scripts.rnad.shared_league_collect \
              --bootstrap bootstrap --actor-id "$actor" --smoke --out "smoke/$actor"
          done
          test "$(find smoke -name '*.json.gz' | wc -l)" -eq 6
          echo 'Verified full G50 Main/Target/Magnet/optimizer/scheduler/RNG, source and real Match legality' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rnad-i5-strength-g50-bootstrap
          path: bootstrap/
          retention-days: 30
          if-no-files-found: error


  g50:
    needs: [preflight, bootstrap]
    if: ${{ needs.bootstrap.result == 'success' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
      generation: 50
      bootstrap_artifact: rnad-i5-strength-g50-bootstrap
      source_ref: ${{ needs.preflight.outputs.source_sha }}
    permissions:
      contents: read
      actions: read

  g51:
