name: RNAD-002 exact frozen AQ-Base versus Basic quality gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/rnad/probe-exact-aq-teacher.mjs'
      - '.github/workflows/rnad-exact-aq-probe.yml'
permissions: {}
concurrency:
  group: rnad-exact-aq-probe-i5
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify immutable engine and exact frozen AQ artifact
        run: |
          node scripts/verify-snapshot.mjs
          mkdir -p artifacts/exact-aq-teacher
          node scripts/rnad/probe-exact-aq-teacher.mjs --seed 994701 --pairs 64 \
            --out artifacts/exact-aq-teacher/paired.json
      - name: Preserve paired outcomes and immutable source SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-exact-aq-probe-${{ github.run_id }}
          path: artifacts/exact-aq-teacher/paired.json
          if-no-files-found: warn
          retention-days: 30
