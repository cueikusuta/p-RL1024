name: RNAD I5 v4 selection-only frozen v3 ensemble AQ screening
on:
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths: ['docs/research/rnad/SELECTION_ENSEMBLE_MANIFEST.json']
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-i5-selection-ensemble-one-writer
  cancel-in-progress: false
jobs:
  ensemble:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0,persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - name: Confirm public-receipt and original AQ model contracts
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          node --test test/rnad-v4-phase-ablation.test.js test/rnad-v4-features.test.js
          mkdir -p archive/v4 models/v3 models results
          gh run download 43957735875 --repo cueikusuta/p-RL1024 \
            --name rnad-i5-v4-utility-iteration-43957735875 --dir archive/v4
          gh run download 43829072730 --repo cueikusuta/p-RL1024 \
            --name rnad-v3-u4-checkpoint-128-43829072730 --dir models/v3
          mapfile -t possible < <(find archive/v4 -type f -path '*/v4-utility/trained-model.json')
          test "${#possible[@]}" -eq 1
          cp "${possible[0]}" models/v4-utility.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {createOpponent,weightsSha256} from './models/aq-base.mjs';
          const h=p=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const m=JSON.parse(readFileSync('docs/research/rnad/SELECTION_ENSEMBLE_MANIFEST.json'));
          if(m.schema!=='rnad-i5-selection-ensemble-v1'||m.iteration!==1||
             m.source_run!==43957735875||!Number.isSafeInteger(m.seed)||m.seed<1||
             !Number.isSafeInteger(m.pairs)||m.pairs<1||m.pairs>100)
            throw new Error('Invalid source-bound selection ensemble manifest');
          if(h('models/v4-utility.json')!==
              '3624014308a4667a15cf2a567dc7836cf6b8e60a6e754eac3b9d0dbfe4ad0c8c'||
             h('models/v3/selfplay/final-model.json')!==
              'c5932531a2ed9e54079dbd915962624dadabc28a2e67893f0a38e96b4adeb75b'||
             createOpponent().modelSha256!==weightsSha256)
            throw new Error('Wrong original AQ, v3 battle or utility v4 model');
          JS
      - name: Evaluate predeclared selection alpha arms vs exact AQ, same fresh seed/seat
        run: |
          set -euo pipefail
          m=docs/research/rnad/SELECTION_ENSEMBLE_MANIFEST.json
          field() { node -e 'const m=require("./"+process.argv[1]);console.log(m[process.argv[2]])' "$m" "$1"; }
          for mode in all-v3 selection-quarter-v4 selection-half-v4 selection-threequarter-v4 selection-v4; do
            node scripts/rnad/evaluate-v4-composite-vs-aq.mjs \
              --v4 models/v4-utility.json --v3 models/v3/selfplay/final-model.json \
              --seed "$(field seed)" --pairs "$(field pairs)" \
              --mode "$mode" --out "results/$mode.json"
          done
      - name: Check paired receipts and familywise multi-arm 95 percent bounds
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {compareV4PhaseArms} from './scripts/rnad/compare-v4-phase-arms.mjs';
          const get=m=>JSON.parse(readFileSync('results/'+m+'.json'));
          const base=get('all-v3');
          const modes=['selection-quarter-v4','selection-half-v4',
            'selection-threequarter-v4','selection-v4'];
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const rows=modes.map(m=>compareV4PhaseArms(base,get(m),{familySize:4}));
          if(rows.some(x=>x.source_sha!==source||
             x.familywise_comparisons!==4||x.champion_promoted))
            throw new Error('Invalid familywise selection ensemble result');
          const report={schema:'rnad-i5-v4-selection-ensemble-screen-v1',
            source_sha:source,predeclared_arms:modes,
            independent_seeds:base.pairs,
            multiple_testing_method:'Bonferroni_Hoeffding95',
            exploratory_only:true,champion_promoted:false,rows};
          writeFileSync('results/selection-ensemble-summary.json',
            JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(rows.map(x=>({mode:x.candidate_mode,
            wins:x.candidate_wins,control:x.baseline_wins,
            delta:x.delta,familywise_ci:x.familywise_95pct_delta_bounds}))));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-v4-selection-ensemble-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
