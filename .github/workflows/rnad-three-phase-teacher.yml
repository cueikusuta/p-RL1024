name: RNAD-002 hosted 3-phase Basic teacher plus 16 R-NaD Matches
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/rnad/research_threephase_teacher.py'
      - 'scripts/rnad/train_teacher.py'
      - 'scripts/rnad/export-teacher.mjs'
      - 'test/rnad-three-phase-teacher.test.js'
      - 'scripts/rnad/evaluate-direct.mjs'
      - '.github/workflows/rnad-three-phase-teacher.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-002-basic-teacher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  three-phase-warmstart:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest # GitHub-hosted ONLY.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU training dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Verify frozen production engine and accepted teacher records
        run: |
          node scripts/verify-snapshot.mjs
          node --test test/rnad-three-phase-teacher.test.js
      - name: Eight teacher Matches then 16 actual complete three-phase RNAD updates
        run: |
          python -m scripts.rnad.research_threephase_teacher \
            --out artifacts/rnad-3phase-teacher
      - name: Independent 8 seed-pair initial random Actor diagnostic
        run: |
          node scripts/rnad/evaluate.mjs \
            --model artifacts/rnad-3phase-teacher/teacher/initial-model.json \
            --seed 988901 --pairs 8 \
            --out artifacts/rnad-3phase-teacher/initial-heldout.json
      - name: Same 8 seed pairs after Basic/Stage0 supervised imitation
        run: |
          node scripts/rnad/evaluate.mjs \
            --model artifacts/rnad-3phase-teacher/teacher/trained-model.json \
            --seed 988901 --pairs 8 \
            --out artifacts/rnad-3phase-teacher/teacher-heldout.json
      - name: Same 8 seed pairs after 16 three-phase RNAD updates
        run: |
          node scripts/rnad/evaluate.mjs \
            --model artifacts/rnad-3phase-teacher/selfplay/final-model.json \
            --seed 988901 --pairs 8 \
            --out artifacts/rnad-3phase-teacher/rnad-heldout.json
      - name: Direct teacher-vs-RNAD pair-swapped on disjoint 8 seeds
        run: |
          node scripts/rnad/evaluate-direct.mjs \
            --teacher artifacts/rnad-3phase-teacher/teacher/trained-model.json \
            --rnad artifacts/rnad-3phase-teacher/selfplay/final-model.json \
            --seed 988921 --pairs 8 \
            --out artifacts/rnad-3phase-teacher/direct-heldout.json
      - name: Preserve non-Champion training and evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-002-basic-teacher-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rnad-3phase-teacher/study-report.json
            artifacts/rnad-3phase-teacher/teacher/teacher-report.json
            artifacts/rnad-3phase-teacher/teacher/initial-model.json
            artifacts/rnad-3phase-teacher/teacher/trained-model.json
            artifacts/rnad-3phase-teacher/selfplay/report.json
            artifacts/rnad-3phase-teacher/selfplay/final-model.json
            artifacts/rnad-3phase-teacher/selfplay/checkpoints/latest.json
            artifacts/rnad-3phase-teacher/selfplay/checkpoints/checkpoint-u16-*.pt
            artifacts/rnad-3phase-teacher/initial-heldout.json
            artifacts/rnad-3phase-teacher/teacher-heldout.json
            artifacts/rnad-3phase-teacher/rnad-heldout.json
            artifacts/rnad-3phase-teacher/direct-heldout.json
          if-no-files-found: warn
          retention-days: 30
