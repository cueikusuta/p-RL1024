name: Phase AI interface and Match contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ai/phase-pipeline.js'
      - 'scripts/dev/simulator/phase-agents.js'
      - 'scripts/dev/simulator/phase-match.js'
      - 'test/phase-pipeline-*.test.js'
      - '.github/workflows/phase-ai.yml'
      - 'README.md'
  workflow_dispatch:
permissions: {}
concurrency:
  group: phase-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase-ai:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify original experiment snapshot
        run: node scripts/verify-snapshot.mjs
      - name: Unit and integration contracts
        run: node --test test/phase-pipeline-contract.test.js test/phase-pipeline-integration.test.js test/pure-rl-phases.test.js test/model-contract.test.js
