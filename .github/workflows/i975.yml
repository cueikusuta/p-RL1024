name: RL model smoke and training
on:
  push:
    branches: [main, 'research/**']
  workflow_dispatch:
    inputs:
      model:
        description: 'Model family'
        type: choice
        options: [RL-Linear, RL-Deep, RL-Deep-001]
        default: RL-Linear
      opponent:
        description: 'Evaluation opponent'
        type: choice
        options: [V2E, RL-Deep, AQ-Base-001]
        default: V2E
      matches:
        description: 'Training matches (9–256); frozen RL-Deep-001 requires default 9 and runs evaluation only'
        type: string
        default: '9'
      seed:
        description: 'Training seed (1–4294967295)'
        type: string
        default: '975020'
permissions: {}
concurrency:
  group: i975-${{ github.ref }}
  cancel-in-progress: false
jobs:
  experiment:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify source snapshot
        run: node scripts/verify-snapshot.mjs
      - name: Verify contracts
        run: node --test test/pure-rl-linear.test.js test/pure-rl-phases.test.js test/pure-rl-acceptance.test.js test/verify-evaluation.test.js test/model-contract.test.js test/checkpoint-contract.test.js test/aq-opponent.test.js test/deep001-eval.test.js
      - name: Train and evaluate
        env:
          RL_MODEL: ${{ inputs.model || 'RL-Linear' }}
          RL_OPPONENT: ${{ inputs.opponent || 'V2E' }}
          RL_MATCHES: ${{ inputs.matches || '9' }}
          RL_SEED: ${{ inputs.seed || '975020' }}
        run: node scripts/run-experiment.mjs
      - name: Save results and any checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: i975-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
