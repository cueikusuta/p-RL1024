name: RNAD-003 bounded 100-variant evolutionary screening
on:
  pull_request:
    branches: [main]
    # One bounded research trigger on introducing/changing THIS workflow.
    # Routine commits to population code must not re-run expensive trials.
    paths: ['.github/workflows/rnad-population-study.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-003-population-i5
  cancel-in-progress: false
jobs:
  evolutionary-screen:
    if: github.repository == 'cueikusuta/p-RL1024' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == 'cueikusuta/p-RL1024')
    runs-on: ubuntu-latest # ONLY GitHub-hosted CPU; never self-hosted.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      GH_REPO: cueikusuta/p-RL1024
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ROOT: artifacts/population-origin
      OUTPUT: artifacts/population-search
    steps:
      - name: Checkout exact PR HEAD or manual selected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure Node 22.14.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU learning dependencies and run fast contracts
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
          node scripts/verify-snapshot.mjs
          python -m unittest test.rnad_population_test -v
          python -m scripts.rnad.population_probe --plan-only > /tmp/rnad-population-plan.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rnad-population-plan.json'))
          assert p['count']==len(p['plan'])==100 and p['is_champion'] is False
          print('Reproducible 100 policy trials validated',flush=True)
          PY
      - name: Download previous verified v2 128-Match exact-optimizer origin
        run: |
          mkdir -p "$ROOT"
          gh run download 43747882146 --repo "$GH_REPO" \
            --name rnad-003-v2-continued-128-43747882146 \
            --dir "$ROOT"
          test -s "$ROOT/generations/model-u128.json"
          test -s "$ROOT/generations/progress.json"
      - name: Verify origin checkpoint and run 100 screening / 16 selection / 4 true training trials
        run: |
          python -m scripts.rnad.population_probe \
            --origin "$ROOT" --out "$OUTPUT"
      - name: Verify final trial count, no Champion and disjoint frozen holdouts
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['OUTPUT'])
          s=json.loads((p/'population-report.json').read_text())
          if not (s['schema']=='rnad-003-population-100-screen-v1'
              and s['population']==len(s['stages'])==100
              and s['trained_finalists']==len(s['finalists'])==4
              and s['matches_per_finalist']==16
              and s['holdout_pairs']==32
              and s['optimization_is_exact_checkpoint_continuation'] is False
              and s['exploration_seed_is_a_champion_test'] is False
              and s['champion_promoted'] is False):
              raise ValueError('Incomplete or falsely promoted population study')
          assert len({x['id'] for x in s['finalists']}) == 4
          print(json.dumps({'completed_population':100,
                'trained_finalists':4,'finalists':s['finalists'],
                'champion_promoted':False}),flush=True)
          PY
      - name: Preserve bounded summary and only four trained full-state checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnad-003-population-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/population-search/population-report.json
            artifacts/population-search/screen/
            artifacts/population-search/select/
            artifacts/population-search/holdout/
            artifacts/population-search/training/*/report.json
            artifacts/population-search/training/*/final-model.json
            artifacts/population-search/training/*/checkpoints/latest.json
            artifacts/population-search/training/*/checkpoints/checkpoint-u16-*.pt
          if-no-files-found: warn
          retention-days: 30
