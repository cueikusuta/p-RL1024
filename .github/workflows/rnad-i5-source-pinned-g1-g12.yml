      contents: read
      actions: read

  g6:
    needs: g5
    if: ${{ needs.g5.result == 'success' && needs.g5.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
