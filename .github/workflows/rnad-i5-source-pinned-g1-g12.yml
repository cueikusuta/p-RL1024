      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g5
      source_ref: 01501f3a1e12511140bf772d435d39c0c07319bc
    permissions:
      contents: read
      actions: read

  g7:
    needs: g6
    if: ${{ needs.g6.result == 'success' && needs.g6.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
