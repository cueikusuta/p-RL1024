      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g9
      source_ref: 01501f3a1e12511140bf772d435d39c0c07319bc
    permissions:
      contents: read
      actions: read

  g11:
    needs: g10
    if: ${{ needs.g10.result == 'success' && needs.g10.outputs.should_continue == 'true' }}
    uses: ./.github/workflows/rnad-i5-next13-fast-generation-reusable.yml
    with:
