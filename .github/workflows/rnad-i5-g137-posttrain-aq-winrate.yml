name: I5 G137 final AQ-Base win rate (auto)
on:
  workflow_run:
    workflows:
      - I5 G137 onward verified 10-hour league continuation
    types: [completed]
permissions: {}
concurrency:
  group: rnad-i5-posttrain-aq-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

# This is a separate descriptive benchmark. AQ-Base is NOT an opponent in
# the 20-Actor training league (which uses three frozen legacy models).
# Run only after the specific preapproved 10-hour training run succeeds.
# Training checkpoints and Champion are never modified or promoted.
jobs:
  prepare:
    if: >-
      github.repository == 'cueikusuta/p-RL1024' &&
      github.event.workflow_run.id == 44860357036 &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == '94d59f54ea6d3a850bff638dbd235fa152aacbf0' &&
      github.event.workflow_run.head_branch == 'research/5-g49-strength-continuation'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      TRAINING_RUN_ID: '44860357036'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4ac6ad652365318aa4f8b9736dffdd00cf696915
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Select only the last fully trained, full-state-verified generation
        run: |
          set -euo pipefail
          gh api "repos/cueikusuta/p-RL1024/actions/runs/$TRAINING_RUN_ID" \
            --jq '{id,head_sha,status,conclusion}' > training-run.json
          test "$(jq -r .id training-run.json)" = "$TRAINING_RUN_ID"
          test "$(jq -r .head_sha training-run.json)" = '94d59f54ea6d3a850bff638dbd235fa152aacbf0'
          test "$(jq -r .status training-run.json)" = completed
          test "$(jq -r .conclusion training-run.json)" = success
          for attempt in 1 2 3 4 5; do
            if gh api "repos/cueikusuta/p-RL1024/actions/runs/$TRAINING_RUN_ID/artifacts?per_page=100" \
                 --paginate --jq '.artifacts[] | [.id,.name,.expired] | @tsv' > artifacts.tsv; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          fresh={},{}
          results,boots=fresh
          for row in Path('artifacts.tsv').read_text().splitlines():
              fields=row.split('\t')
              if len(fields)!=3:
                  raise ValueError('Invalid source artifact listing')
              ident,name,expired=fields
              if expired!='false':
                  continue
              for regex,target in [
                  (r'rnad-i5-cont-g(\d+)-full-learner-result',results),
                  (r'rnad-i5-cont-next-bootstrap-after-g(\d+)',boots)]:
                  m=re.fullmatch(regex,name)
                  if m:
                      g=int(m.group(1))
                      if g == 136 and name == 'rnad-i5-cont-next-bootstrap-after-g136':
                          # G136 bridge is a legitimate preserved input, not a final model.
                          # Keep the source evidence but exclude it from G137+ selection.
                          continue
                      if not 137<=g<=237:
                          raise ValueError('Unapproved complete generation artifact')
                      # A recovered/retried job may publish multiple immutable
                      # artifacts with the same logical generation. Prefer the
                      # latest artifact ID, then verify its full SHA-pinned
                      # contents against the successor handoff before use.
                      if g not in target or int(ident)>target[g][0]:
                          target[g]=(int(ident),name)
          if not results or not boots or max(results)!=max(boots):
              raise ValueError('Missing last Learner or successor handoff')
          g=max(results)
          if g not in boots or g<137:
              raise ValueError('Last generation lacks full-state handoff')
          report={
              'schema':'rnad-i5-posttrain-aq1024-selection-v1',
              'training_run_id':44860357036,
              'completed_generation':g,
              'checkpoint_generation':g+1,
              'learner_artifact_id':results[g][0],
              'bootstrap_artifact_id':boots[g][0],
              'bootstrap_artifact_name':boots[g][1],
              'seed_start':11000001,
              'independent_seed_blocks':512,
              'complete_four_win_matches':1024,
              'source_sha':'4ac6ad652365318aa4f8b9736dffdd00cf696915',
              'opponent_id':'AQ-Base-001',
              'research_only':True,
              'champion_promoted':False,
          }
          Path('selection.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Restore the exact successful learner handoff and SHA-check the entire full state
        run: |
          set -euo pipefail
          artifact="$(jq -r .bootstrap_artifact_name selection.json)"
          for attempt in 1 2 3 4 5 6 7; do
            rm -rf frozen; mkdir -p frozen
            if gh run download "$TRAINING_RUN_ID" --repo cueikusuta/p-RL1024 \
                --name "$artifact" --dir frozen; then break; fi
            if [ "$attempt" = 7 ]; then exit 1; fi
            delay=$((10 << (attempt - 1)))
            if [ "$delay" -gt 180 ]; then delay=180; fi
            sleep "$delay"
          done
          (cd frozen && sha256sum -c file-pins.sha256)
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=Path('frozen')
          p=json.loads(Path('selection.json').read_text())
          read=lambda x:json.loads((b/x).read_text())
          sha=lambda x:hashlib.sha256((b/x).read_bytes()).hexdigest()
          m,idx,h,actor=(read(x) for x in
              ['generation-manifest.json','checkpoint-index.json',
               'handoff-report.json','actor/manifest.json'])
          g=p['completed_generation'];src=p['source_sha']
          assert m['generation']==idx['generation']==actor['generation']==g+1
          assert h['generation']==g+1 and h['previous_generation']==g
          assert m['source_sha']==h['source_sha']==actor['source_sha']==src
          assert m['engine_sha']==h['engine_sha']==actor['engine_sha']
          assert m['main_sha256']==h['main_sha256']==sha('actor/manifest.json')
          assert h['exact_previous_complete_matches']==1280
          assert h['prior_optimizer_updates']==40
          assert idx['sha256']==h['new_full_checkpoint_sha256']==sha('checkpoint-g0.pt')
          assert idx['prior_generation_checkpoint_sha256']==h['prior_checkpoint_sha256']
          assert all(h[k] is True for k in
              ('optimizer_full_state_preserved','target_full_state_preserved',
               'magnet_full_state_preserved','rng_full_state_preserved'))
          assert h['research_only'] is True and h['champion_promoted'] is False
          assert set(actor['files'])=={'draft','selection','battle','values'}
          for name,digest in actor['files'].items():
              assert sha('actor/'+name+'.json')==digest
          pin={**p,'model_manifest_sha256':m['main_sha256'],
               'engine_sha':m['engine_sha']}
          (b/'model-pin.json').write_text(json.dumps(pin,indent=2)+'\n')
          (b/'selection.json').write_text(json.dumps(p,indent=2)+'\n')
          print('Exactly verified post-G'+str(g)+' frozen research model')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rnad-i5-posttrain-aq-model
          path: |
            frozen/actor/
            frozen/model-pin.json
            frozen/selection.json
          retention-days: 90
          if-no-files-found: error

  evaluate:
    name: "AQ-Base paired seed shard ${{ matrix.part }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: {contents: read, actions: read}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part: [0,1,2,3,4,5,6,7]
    env:
      GH_TOKEN: ${{ github.token }}
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4ac6ad652365318aa4f8b9736dffdd00cf696915
          persist-credentials: false
      - name: Install authenticated Node 22 if the runner has another major version
        run: |
          set -euo pipefail
          if ! command -v node || ! node --version | grep -Eq '^v22\.'; then
            archive=node-v22.14.0-linux-x64.tar.xz
            curl -fsSL --retry 3 "https://nodejs.org/dist/v22.14.0/$archive" -o "$RUNNER_TEMP/$archive"
            curl -fsSL --retry 3 "https://nodejs.org/dist/v22.14.0/SHASUMS256.txt" -o "$RUNNER_TEMP/SHASUMS256.txt"
            (cd "$RUNNER_TEMP" && grep -F " $archive" SHASUMS256.txt | sha256sum --check)
            tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/node-v22.14.0-linux-x64/bin" >> "$GITHUB_PATH"
          fi
      - name: Download one frozen immutable final model
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            rm -rf pinned; mkdir -p pinned
            if gh run download "$GITHUB_RUN_ID" --repo cueikusuta/p-RL1024 \
                --name rnad-i5-posttrain-aq-model --dir pinned; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep "$((attempt * 12))"
          done
          test -s pinned/actor/manifest.json
          test -s pinned/model-pin.json
      - name: Execute 64 independent seeds in both seats against AQ-Base, without learning
        run: |
          set -euo pipefail
          mkdir -p result
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {createIntegratedAQSession} from './scripts/rnad/evaluate-shared-g012-vs-aq.mjs';
          import {runStrategyMatch} from './aq-runtime/scripts/dev/simulator/strategy-match.js';
          import {createOpponent,weightsSha256 as AQ_BASE_SHA} from './models/aq-base.mjs';
          import {verifiedRunningSourceSha} from './scripts/dev/simulator/rnad-match.js';
          import provenance from './provenance/manifest.json' with {type:'json'};
          const check=(v,msg)=>{if(!v)throw Error(msg);};
          const sha=p=>createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const pin=JSON.parse(fs.readFileSync('pinned/model-pin.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('pinned/actor/manifest.json','utf8'));
          const part=Number(process.env.PART);
          check(Number.isInteger(part)&&part>=0&&part<8,'Invalid shard');
          check(pin.schema==='rnad-i5-posttrain-aq1024-selection-v1'&&
            pin.training_run_id===44860357036&&
            pin.seed_start===11000001&&pin.independent_seed_blocks===512&&
            pin.source_sha==='4ac6ad652365318aa4f8b9736dffdd00cf696915'&&
            pin.source_sha===verifiedRunningSourceSha()&&
            pin.engine_sha===provenance.sourceCommit&&
            pin.model_manifest_sha256===sha('pinned/actor/manifest.json')&&
            manifest.generation===pin.checkpoint_generation&&
            manifest.source_sha===pin.source_sha&&
            manifest.engine_sha===pin.engine_sha&&
            pin.opponent_id==='AQ-Base-001'&&pin.champion_promoted===false,
            'Final frozen model identity mismatch');
          for(const [head,digest] of Object.entries(manifest.files)){
            check(sha('pinned/actor/'+head+'.json')===digest,
              'Tampered frozen integrated head '+head);
          }
          const aq=createOpponent();
          check(aq.modelSha256===AQ_BASE_SHA,'Unexpected AQ baseline');
          const start=11000001+part*64,rows=[];
          for(let seed=start;seed<start+64;seed++){
            for(const candidateSeat of [0,1]){
              const actor=createIntegratedAQSession({
                modelDir:'pinned/actor',seat:candidateSeat});
              const match=runStrategyMatch({
                seed,policies:[0,1].map(s=>s===candidateSeat?'pure-rl-linear':'aq-base'),
                pureRlSessions:[0,1].map(s=>s===candidateSeat?actor:null),
                pureRlAllPhases:true,strategyMode:'integrated',
                v2Weights:{blend:.28,exposure:.75,continuation:.4},aqBase:aq
              });
              const stats=match.pureRlStats?.[candidateSeat];
              check(match.completed===true&&[0,1].includes(match.winner)&&
                Array.isArray(match.score)&&match.score.length===2&&
                match.score[match.winner]===4&&match.score[1-match.winner]<4&&
                Number.isInteger(match.rounds)&&match.rounds>=4&&match.rounds<=64&&
                stats?.updates===0&&stats?.pending===false&&
                stats?.accepted_decisions===match.actionCounts[candidateSeat]+2*match.rounds,
                'Incomplete frozen AQ four-win match seed '+seed+' seat '+candidateSeat);
              rows.push({seed,candidateSeat,won:match.winner===candidateSeat,
                completed:true,score:match.score,rounds:match.rounds,
                accepted_decisions:stats.accepted_decisions});
            }
          }
          const wins=rows.filter(x=>x.won).length;
          fs.writeFileSync('result/result.json',JSON.stringify({
            schema:'rnad-i5-posttrain-aq1024-shard-v1',
            training_run_id:pin.training_run_id,
            completed_generation:pin.completed_generation,
            checkpoint_generation:pin.checkpoint_generation,
            model_manifest_sha256:pin.model_manifest_sha256,
            source_sha:pin.source_sha,engine_sha:pin.engine_sha,
            opponent_id:pin.opponent_id,aq_model_sha256:AQ_BASE_SHA,
            part,seed_start:start,seed_blocks:64,
            evaluation_policy:'frozen-greedy-no-training',
            training_during_evaluation:false,champion_promoted:false,
            complete_four_win_matches:128,wins,rows,
          })+'\n',{flag:'wx'});
          console.log(JSON.stringify({part,completed_generation:pin.completed_generation,
            complete_four_win_matches:128,wins,champion_promoted:false}));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rnad-i5-posttrain-aq-part${{ matrix.part }}
          path: result/result.json
          retention-days: 90
          if-no-files-found: warn

  summarize:
    needs: [prepare, evaluate]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: {contents: read, actions: read, issues: write}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4ac6ad652365318aa4f8b9736dffdd00cf696915
          persist-credentials: false
      - name: Verify all completed paired seeds and publish only AQ-Base win rate
        run: |
          set -euo pipefail
          test "${{ needs.evaluate.result }}" = success
          mkdir -p pinned evidence final
          gh run download "$GITHUB_RUN_ID" --repo cueikusuta/p-RL1024 \
            --name rnad-i5-posttrain-aq-model --dir pinned
          gh run download "$GITHUB_RUN_ID" --repo cueikusuta/p-RL1024 \
            --pattern 'rnad-i5-posttrain-aq-part*' --dir evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {pairedClusterCI} from './scripts/rnad/paired-league-stats.mjs';
          import {weightsSha256 as AQ_BASE_SHA} from './models/aq-base.mjs';
          const requireOk=(v,m)=>{if(!v)throw Error(m);};
          const pin=JSON.parse(fs.readFileSync('pinned/model-pin.json','utf8'));
          const first=11000001,records=new Map();
          let wins=0;
          for(let part=0;part<8;part++){
            const file=path.join('evidence','rnad-i5-posttrain-aq-part'+part,'result.json');
            const x=JSON.parse(fs.readFileSync(file,'utf8'));
            requireOk(x.schema==='rnad-i5-posttrain-aq1024-shard-v1'&&
              x.training_run_id===pin.training_run_id&&
              x.completed_generation===pin.completed_generation&&
              x.checkpoint_generation===pin.checkpoint_generation&&
              x.model_manifest_sha256===pin.model_manifest_sha256&&
              x.source_sha===pin.source_sha&&x.engine_sha===pin.engine_sha&&
              x.opponent_id==='AQ-Base-001'&&x.aq_model_sha256===AQ_BASE_SHA&&
              x.part===part&&x.seed_start===first+part*64&&x.seed_blocks===64&&
              x.evaluation_policy==='frozen-greedy-no-training'&&
              x.training_during_evaluation===false&&x.champion_promoted===false&&
              x.complete_four_win_matches===128&&x.rows?.length===128&&
              x.wins===x.rows.filter(r=>r.won).length,
              'Unverified/faulty AQ-Base shard '+part);
            for(const r of x.rows){
              const key=r.seed+':'+r.candidateSeat;
              requireOk(Number.isSafeInteger(r.seed)&&
                r.seed>=x.seed_start&&r.seed<x.seed_start+64&&
                [0,1].includes(r.candidateSeat)&&!records.has(key)&&
                r.completed===true&&typeof r.won==='boolean'&&
                Array.isArray(r.score)&&r.score.length===2&&
                r.score.every(v=>Number.isInteger(v)&&v>=0&&v<=4)&&
                r.score[r.won?r.candidateSeat:1-r.candidateSeat]===4&&
                r.score[r.won?1-r.candidateSeat:r.candidateSeat]<4&&
                Number.isInteger(r.rounds)&&r.rounds>=4&&r.rounds<=64&&
                Number.isInteger(r.accepted_decisions)&&r.accepted_decisions>0,
                'Non-unique/incomplete authority AQ-Base Match '+key);
              records.set(key,r);
              wins+=Number(r.won);
            }
          }
          const block=[];
          for(let seed=first;seed<first+512;seed++){
            const a=records.get(seed+':0'),b=records.get(seed+':1');
            requireOk(a&&b,'Missing seat-swapped seed block '+seed);
            block.push((Number(a.won)+Number(b.won))/2);
          }
          requireOk(records.size===1024&&block.length===512,
            'Not exactly 1024 independently seeded complete Matches');
          const stats=pairedClusterCI(block,{
            familywiseAlpha:.05,comparisons:1,range:[0,1],nullValue:.5,
          });
          const report={
            schema:'rnad-i5-posttrain-aq1024-final-v1',
            training_run_id:pin.training_run_id,
            completed_generation:pin.completed_generation,
            checkpoint_generation:pin.checkpoint_generation,
            model_manifest_sha256:pin.model_manifest_sha256,
            source_sha:pin.source_sha,
            engine_sha:pin.engine_sha,
            opponent_id:'AQ-Base-001',
            aq_model_sha256:AQ_BASE_SHA,
            seed_start:first,independent_seed_blocks:512,
            both_seats:true,complete_four_win_matches:1024,
            wins,losses:1024-wins,win_rate:wins/1024,
            confidence_level:.95,paired_seed_confidence_interval:stats.confidence_interval,
            research_only:true,champion_promoted:false,
            note:'Final frozen trained generation vs AQ-Base only. AQ is not the frozen opponent pool used during league training; no strength claims versus other opponents.',
          };
          fs.writeFileSync('final/result.json',JSON.stringify(report,null,2)+'\n');
          const pct=x=>(100*x).toFixed(2)+'%';
          const interval=report.paired_seed_confidence_interval;
          const url='https://github.com/cueikusuta/p-RL1024/actions/runs/'+process.env.GITHUB_RUN_ID;
          const summary='# R-NaD G'+pin.completed_generation+' vs AQ-Base\n\n'+
            '**AQ-Base相手の勝率：'+pct(report.win_rate)+'** ('+wins+'/1024 完全4勝Match)\n\n'+
            '独立512 seed、先後両席入替。対応あり95%信頼区間：'+
            pct(interval[0])+'〜'+pct(interval[1])+'。\n\n'+
            '学習終了時のG'+pin.completed_generation+'を凍結して評価。'+
            'リーグ学習にAQ-Baseは含まれないため、これは終了後の別評価です。'+
            'Champion昇格・他のモデルとの強さ比較は行っていません。\n\n'+
            '検証結果：'+url+'\n';
          fs.writeFileSync('final/report.md',summary);
          console.log(JSON.stringify({generation:pin.completed_generation,
            win_rate:report.win_rate,match_count:1024,interval},null,2));
          JS
          cat final/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rnad-i5-posttrain-aq-final-report
          path: final/
          retention-days: 90
          if-no-files-found: warn
      - name: Record the AQ-only evaluation in Issue 5 for asynchronous visibility
        if: success()
        continue-on-error: true
        run: gh issue comment 5 --repo cueikusuta/p-RL1024 --body-file final/report.md
