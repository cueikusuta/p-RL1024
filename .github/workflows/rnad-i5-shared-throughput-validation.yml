name: I5 shared R-NaD throughput isolated regression
on:
  push:
    branches: [perf/5-rnad-shared-league-throughput]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: i5-shared-throughput-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Validate syntax and original fixed-source engine
        run: |
          set -euo pipefail
          node --check scripts/rnad/shared_league_actor.mjs
          python -m py_compile scripts/rnad/shared_league_collect.py scripts/rnad/shared_league_learner.py scripts/rnad/integrated_policy_v1.py scripts/rnad/selection_ab.py scripts/rnad/shared_league_batched.py scripts/rnad/shared_league_parallel.py scripts/rnad/shared_league_parallel_parity.py scripts/rnad/shared_league_pipelined.py scripts/rnad/shared_league_onnx_cpu_export.py scripts/rnad/shared_league_compiler_repeat.py
          node scripts/verify-snapshot.mjs
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Independent phase batching, data decode and checkpoint contracts
        run: |
          python -m unittest discover -s test -p rnad_shared_league_perf_test.py -v
          python -m unittest discover -s test -p rnad_shared_learner_checkpoint_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_advanced_perf_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_contract_test.py -v
      - name: Original four-win authoritative Match replay through improved Learner
        run: |
          set -euo pipefail
          mkdir -p bootstrap smoke
          gh run download 44318145987 --repo cueikusuta/p-RL1024 --name rnad-i5-shared-main-g0-bootstrap --dir bootstrap
          gh run download 44318145987 --repo cueikusuta/p-RL1024 --name rnad-i5-shared-main-g0-real-match-smoke --dir smoke
          (cd bootstrap && sha256sum -c file-pins.sha256)
          python -m scripts.rnad.shared_league_real_smoke --bootstrap bootstrap --smoke smoke --out real-smoke-optimized
          test -s real-smoke-optimized/smoke-report.json
          python -m scripts.rnad.shared_league_vector_parity --bootstrap bootstrap --smoke smoke
  actor-parity:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU torch for a disposable, source-correct bootstrap
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Generate NEW isolated bootstrap from immutable audited teacher sources
        run: |
          set -euo pipefail
          mkdir -p frozen/DB frozen/A frozen/AJS frozen/old
          gh run download 44096608535 --repo cueikusuta/p-RL1024 --name rnad-i5-draft-battle-512-frozen-trained-model-archive --dir frozen/DB
          gh run download 44067733118 --repo cueikusuta/p-RL1024 --name rnad-i5-selection-A-4096-six-models-and-dev --dir frozen/A
          gh run download 44085352444 --repo cueikusuta/p-RL1024 --name rnad-i5-A4096-vs-A2048-public-js-SHA-checked --dir frozen/AJS
          gh run download 43757054212 --repo cueikusuta/p-RL1024 --name rnad-i5-queue-models-43757054212 --dir frozen/old
          python -m scripts.rnad.shared_league_bootstrap \
            --draft frozen/DB/draft512/draft512-e6.json \
            --draft-report frozen/DB/draft512/study.json \
            --selection frozen/A/selection-A-4096-e60-s90252.pt \
            --selection-study frozen/A/selection-A-4096-development.json \
            --selection-js frozen/AJS/A4096.json \
            --battle frozen/DB/battle512/trained-model.json \
            --battle-report frozen/DB/battle512/teacher-report.json \
            --old-pool frozen/old --out bootstrap
          test -s bootstrap/generation-manifest.json
      - name: Compare 64 authoritative Matches byte-for-byte as decoded JSON
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json,subprocess,time
          from pathlib import Path
          from scripts.rnad.shared_league_collect import collect
          manifest=json.loads(Path("bootstrap/generation-manifest.json").read_text())
          start=time.monotonic()
          result=collect(bootstrap="bootstrap",actor_id=0,out="batched")
          fast_elapsed=time.monotonic()-start
          assert result["accepted_matches"]==64
          Path("serial").mkdir(exist_ok=True)
          meta="batched/actor-meta.json"
          magnet="bootstrap/magnet" if Path("bootstrap/magnet").exists() else "bootstrap/actor"
          start=time.monotonic()
          for seed in range(manifest["seed_start"], manifest["seed_start"]+32):
              for seat in (0,1):
                  ident=f"g{manifest['generation']}-a0-s{seed}-seat{seat}"
                  dest=Path("serial")/(ident+".json.gz")
                  subprocess.run([
                      "node","scripts/rnad/shared_league_actor.mjs",
                      "--seed",str(seed),"--seat",str(seat),"--meta",meta,
                      "--main","bootstrap/actor","--magnet",magnet,
                      "--out",str(dest)],check=True,timeout=180,
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  with gzip.open(dest,"rt") as f:
                      serial=json.load(f)
                  with gzip.open(Path("batched/accepted")/(ident+".json.gz"),"rt") as f:
                      batch=json.load(f)
                  assert serial==batch, f"Actor seed/seat parity failed: {ident}"
          serial_elapsed=time.monotonic()-start
          report={
              "schema":"rnad-i5-actor-batch-parity-timing-research-v1",
              "source_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True).strip(),
              "matches":64,"paired_seeds":32,
              "decoded_accepted_trajectory_identical":True,
              "persistent_actor_seconds":round(fast_elapsed,3),
              "single_match_process_seconds":round(serial_elapsed,3),
              "speed_ratio_old_over_new":round(serial_elapsed/fast_elapsed,3),
              "strength_or_champion_claim":False,
          }
          print(json.dumps(report,indent=2),flush=True)
          with open("actor-parity-report.json","w") as f:json.dump(report,f,indent=2)
          PY
          cat actor-parity-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Profile actual accepted Actor CPU hotspots (8 Matches)
        run: |
          set -euo pipefail
          mkdir -p cpu-prof/accepted
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("bootstrap/generation-manifest.json").read_text())
          jobs=[]
          for seed in range(m["seed_start"],m["seed_start"]+4):
              for seat in (0,1):
                  ident=f"g{m['generation']}-a0-s{seed}-seat{seat}"
                  jobs.append({"seed":seed,"seat":seat,
                               "out":str(Path("cpu-prof/accepted")/(ident+".json.gz"))})
          Path("cpu-prof/jobs.json").write_text(json.dumps({
              "schema":"rnad-shared-actor-batch-jobs-v1","jobs":jobs}))
          PY
          magnet=bootstrap/actor
          test ! -d bootstrap/magnet || magnet=bootstrap/magnet
          node --cpu-prof --cpu-prof-dir=cpu-prof --cpu-prof-name=rnad.cpuprofile scripts/rnad/shared_league_actor.mjs --meta batched/actor-meta.json --main bootstrap/actor --magnet "$magnet" --batch-jobs cpu-prof/jobs.json
          node scripts/rnad/shared_league_actor_profile.mjs cpu-prof/rnad.cpuprofile | tee actor-cpu-profile-report.json
          cat actor-cpu-profile-report.json >> "$GITHUB_STEP_SUMMARY"
  parallel-learner:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Recover immutable bootstrap and one complete 64 Match actor bundle
        run: |
          set -euo pipefail
          mkdir -p bootstrap real-actor
          gh run download 44318145987 --repo cueikusuta/p-RL1024 --name rnad-i5-shared-main-g0-bootstrap --dir bootstrap
          gh run download 44318145987 --repo cueikusuta/p-RL1024 --name rnad-i5-shared-main-g0-actor-0 --dir real-actor
          test -s real-actor/actor-0.json.gz
          (cd bootstrap && sha256sum -c file-pins.sha256)
      - name: Compare 32 real Match CPU-parallel gradients against original
        run: |
          set -euo pipefail
          python -m scripts.rnad.shared_league_parallel_parity --bootstrap bootstrap --actor real-actor/actor-0.json.gz --workers 4 | tee cpu-parallel-report.json
          cat cpu-parallel-report.json >> "$GITHUB_STEP_SUMMARY"
  compiled-candidate:
    needs: verify
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      RNAD_TORCH_COMPILE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU PyTorch + build runtime for TorchInductor
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Trusted original four-match bootstrap
        run: |
          mkdir -p bootstrap smoke
          gh run download 44318145987 --repo cueikusuta/p-RL1024 --name rnad-i5-shared-main-g0-bootstrap --dir bootstrap
          gh run download 44318145987 --repo cueikusuta/p-RL1024 --name rnad-i5-shared-main-g0-real-match-smoke --dir smoke
          (cd bootstrap && sha256sum -c file-pins.sha256)
      - name: Isolated TorchInductor real-Match parity and cold compilation cost
        run: |
          set -euo pipefail
          python -m scripts.rnad.shared_league_vector_parity --bootstrap bootstrap --smoke smoke | tee compile-candidate-report.json
          cat compile-candidate-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Reused TorchInductor head hot-run versus cold compilation study
        run: |
          set -euo pipefail
          python -m scripts.rnad.shared_league_compiler_repeat --bootstrap bootstrap --smoke smoke | tee compile-hot-report.json
          cat compile-hot-report.json >> "$GITHUB_STEP_SUMMARY"
  native-candidate:
    needs: verify
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install CPU ONNX/Node candidate dependencies (research only)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1
          npm install --prefix .rnad-onnx-deps --no-save --no-audit --no-fund onnxruntime-node@1.20.1 --onnxruntime-node-install-cuda=skip
      - name: Obtain immutable actual actor, full-Match inputs and export frozen battle head
        run: |
          set -euo pipefail
          mkdir -p bootstrap smoke
          gh run download 44318145987 --repo cueikusuta/p-RL1024 --name rnad-i5-shared-main-g0-bootstrap --dir bootstrap
          gh run download 44318145987 --repo cueikusuta/p-RL1024 --name rnad-i5-shared-main-g0-real-match-smoke --dir smoke
          (cd bootstrap && sha256sum -c file-pins.sha256)
          python -m scripts.rnad.shared_league_onnx_cpu_export --actor-battle bootstrap/actor/battle.json --out onnx-study
      - name: Accepted Battle decisions Node.js vs CPU ONNX numerical/speed comparison
        run: |
          set -euo pipefail
          node scripts/rnad/shared_league_onnx_node_study.mjs --onnx onnx-study/research-battle-only.onnx --manifest onnx-study/manifest.json --battle bootstrap/actor/battle.json --smoke smoke --deps .rnad-onnx-deps | tee native-candidate-report.json
          cat native-candidate-report.json >> "$GITHUB_STEP_SUMMARY"
