name: Synthetic CPU budget timing
on:
  push:
    branches: [perf/league-private-handoff-synthetic-20261127]
    paths: [ci/speed-cpu-budget.py]
permissions:
  contents: read
concurrency:
  group: league-cpu-budget-synthetic
  cancel-in-progress: false
jobs:
  schedule:
    if: github.repository == 'cueikusuta/p-RL1024' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip -q install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - run: python ci/speed-cpu-budget.py
