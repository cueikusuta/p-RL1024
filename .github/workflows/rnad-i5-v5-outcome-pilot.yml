name: RNAD I5 v5 public-feature vs outcome-rank bounded pilot
on:
  push:
    branches: [feat/5-rnad-stage0-contracts]
    paths: ['docs/research/rnad/V5_OUTCOME_PILOT_MANIFEST.json']
  workflow_dispatch:
permissions: {}
concurrency:
  group: rnad-i5-v5-outcome-one-writer
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.14.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU training dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check -r requirements-rnad.txt
      - name: Validate unique bounded blocks and all feature/experiment contracts
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          node --test test/rnad-v5-features.test.js test/rnad-v5-paired-eval.test.js test/rnad-selection-outcome-contract.test.js
          python -m unittest discover -s test -p 'rnad_selection_outcome_test.py' -v
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('docs/research/rnad/V5_OUTCOME_PILOT_MANIFEST.json'));
          const names=['teacher_seed','teacher_matches','heldout_seed','heldout_matches',
            'selfplay_seed','selfplay_matches','aq_seed','aq_pairs',
            'outcome_train_seed','outcome_heldout_seed','outcome_pairs','outcome_ranks'];
          if(m.schema!=='rnad-i5-v5-outcome-pilot-v1'||
             Object.keys(m).length!==names.length+1||
             names.some(k=>!Number.isSafeInteger(m[k])||m[k]<1)||
             m.teacher_matches>16||m.heldout_matches>16||
             m.selfplay_matches>4||m.aq_pairs>8||
             m.outcome_pairs>8||m.outcome_ranks>4||
             m.outcome_ranks<2)
            throw new Error('Invalid bounded experimental manifest');
          const ranges=[
            [m.teacher_seed,m.teacher_matches],
            [m.heldout_seed,m.heldout_matches],
            [m.selfplay_seed,m.selfplay_matches],
            [m.aq_seed,m.aq_pairs],
            [m.outcome_train_seed,m.outcome_pairs],
            [m.outcome_heldout_seed,m.outcome_pairs]
          ];
          for(let i=0;i<ranges.length;i++)for(let j=i+1;j<ranges.length;j++){
            const [a,n]=ranges[i],[b,k]=ranges[j];
            if(a<=b+k-1&&b<=a+n-1)
              throw new Error('Reused experimental seed block');
          }
          console.log(JSON.stringify(m));
          JS
      - name: Download SHA-bound frozen v3 battle and draft control
        run: |
          set -euo pipefail
          mkdir -p models/v3 artifacts results
          gh run download 43829072730 --repo cueikusuta/p-RL1024 \
            --name rnad-v3-u4-checkpoint-128-43829072730 --dir models/v3
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {PersistentRNADInference} from './scripts/rnad/infer.mjs';
          const p='models/v3/selfplay/final-model.json';
          const digest=createHash('sha256').update(readFileSync(p)).digest('hex');
          if(digest!=='c5932531a2ed9e54079dbd915962624dadabc28a2e67893f0a38e96b4adeb75b'|| 
             new PersistentRNADInference(p).featureSchema!=='rnad-three-phase-features-v3')
            throw new Error('Untrusted frozen v3 control SHA/schema');
          JS
      - name: Matched-budget v4 and v5 accepted AQ imitation
        run: |
          set -euo pipefail
          f() { node -e 'const m=require("./docs/research/rnad/V5_OUTCOME_PILOT_MANIFEST.json");console.log(m[process.argv[1]])' "$1"; }
          for variant in v4 v5; do
            python -m scripts.rnad.train_teacher \
              --out "artifacts/$variant-teacher" \
              --seed "$(f teacher_seed)" --matches "$(f teacher_matches)" \
              --epochs 1 --three-phase "--features-$variant" \
              --phase-balanced --phase-profile draft-selection \
              --teacher aq-public-strategy-selection --utility-distillation
            python -m scripts.rnad.evaluate_aq_imitation \
              --model "artifacts/$variant-teacher/trained-model.json" \
              --teacher aq-public-strategy-selection "--features-$variant" --utility-labels \
              --seed "$(f heldout_seed)" --matches "$(f heldout_matches)" \
              --out "artifacts/$variant-heldout"
          done
          # Four-Match pilot is diagnostic only; the formal phase gate requires
          # at least 24 completed teacher Matches and must not be weakened.
          python -m scripts.rnad.compare_v5_imitation_pilot \
            --baseline artifacts/v4-heldout/heldout-imitation.json \
            --candidate artifacts/v5-heldout/heldout-imitation.json \
            --out results/v4-v5-imitation-screen.json
      - name: v5 real accepted four-win R-NaD continuation smoke
        run: |
          set -euo pipefail
          f() { node -e 'const m=require("./docs/research/rnad/V5_OUTCOME_PILOT_MANIFEST.json");console.log(m[process.argv[1]])' "$1"; }
          python -m scripts.rnad.train \
            --seed "$(f selfplay_seed)" --matches "$(f selfplay_matches)" \
            --three-phase --features-v5 --switch-guard anti-loop-v1 \
            --initial-model artifacts/v5-teacher/trained-model.json \
            --updates-per-match 1 --out artifacts/v5-rnad
      - name: New independent paired AQ seed screen with frozen v3 battle
        run: |
          set -euo pipefail
          f() { node -e 'const m=require("./docs/research/rnad/V5_OUTCOME_PILOT_MANIFEST.json");console.log(m[process.argv[1]])' "$1"; }
          for mode in all-v3 selection-v5; do
            node scripts/rnad/evaluate-v5-composite-vs-aq.mjs \
              --v5 artifacts/v5-teacher/trained-model.json \
              --v3 models/v3/selfplay/final-model.json \
              --seed "$(f aq_seed)" --pairs "$(f aq_pairs)" \
              --mode "$mode" --out "results/aq-$mode.json"
          done
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {compareV5PhaseAgainstV3} from './scripts/rnad/compare-v5-phase-arms.mjs';
          const base=JSON.parse(readFileSync('results/aq-all-v3.json'));
          const other=JSON.parse(readFileSync('results/aq-selection-v5.json'));
          const r=compareV5PhaseAgainstV3(base,other);
          writeFileSync('results/v5-v3-aq-paired.json',JSON.stringify(r,null,2)+'\n');
          console.log(JSON.stringify(r));
          JS
      - name: Outcome-aligned first-selection rank intervention, disjoint seed blocks
        run: |
          set -euo pipefail
          f() { node -e 'const m=require("./docs/research/rnad/V5_OUTCOME_PILOT_MANIFEST.json");console.log(m[process.argv[1]])' "$1"; }
          for role in train heldout; do
            if [ "$role" = train ]; then seed="$(f outcome_train_seed)"; else seed="$(f outcome_heldout_seed)"; fi
            node scripts/rnad/evaluate-selection-outcome-rank.mjs \
              --v3 models/v3/selfplay/final-model.json \
              --seed "$seed" --pairs "$(f outcome_pairs)" \
              --ranks "$(f outcome_ranks)" --out "results/outcome-$role.json"
          done
          python -m scripts.rnad.learn_selection_outcome \
            --train results/outcome-train.json \
            --heldout results/outcome-heldout.json \
            --out artifacts/outcome-linear --epochs 40
      - name: Fail closed on insufficient evidence or wrong phase versions
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=Path('artifacts')
          old=json.loads((r/'v4-heldout/heldout-imitation.json').read_text())
          new=json.loads((r/'v5-heldout/heldout-imitation.json').read_text())
          screen=json.loads(Path('results/v4-v5-imitation-screen.json').read_text())
          rnad=json.loads((r/'v5-rnad/report.json').read_text())
          aq=json.loads(Path('results/v5-v3-aq-paired.json').read_text())
          outcome=json.loads((r/'outcome-linear/report.json').read_text())
          if not (old['feature_schema']=='rnad-three-phase-features-v4'
             and new['feature_schema']=='rnad-three-phase-features-v5'
             and screen['strength_established'] is False
             and rnad['feature_schema']=='rnad-three-phase-features-v5'
             and rnad['completed_matches']>0
             and aq['strength_established'] is False
             and aq['champion_promoted'] is False
             and outcome['strength_established'] is False
             and outcome['selection_policy_deployed'] is False
             and outcome['champion_promoted'] is False):
             raise ValueError('Wrong schema or untrusted promotion in pilot')
          print(json.dumps({'v4_phases':old['phases'],
             'v5_phases':new['phases'],'paired':aq,
             'outcome':{k:v for k,v in outcome.items() if k!='choices'}},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-v5-outcome-pilot-${{ github.run_id }}
          path: |
            artifacts/v4-teacher/teacher-report.json
            artifacts/v4-teacher/trained-model.json
            artifacts/v5-teacher/teacher-report.json
            artifacts/v5-teacher/trained-model.json
            artifacts/v4-heldout/heldout-imitation.json
            artifacts/v5-heldout/heldout-imitation.json
            artifacts/v5-rnad/report.json
            artifacts/v5-rnad/final-model.json
            artifacts/outcome-linear/
            results/
          retention-days: 30
          if-no-files-found: warn
