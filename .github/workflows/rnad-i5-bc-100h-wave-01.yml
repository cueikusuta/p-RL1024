    uses: ./.github/workflows/rnad-i5-bc-100h-generation-reusable.yml
    with:
      generation: 199
      bootstrap_artifact: ${{ inputs.initial_artifact }}
      last_generation: 598
      source_ref: ${{ inputs.source_ref || github.sha }}
    permissions: {contents: read, actions: write}
