name: I5 G62 onward verified 10-hour league continuation
on:
  push:
    branches: [research/5-g49-strength-continuation]
    paths:
      - docs/research/rnad/G62_G160_TEN_HOUR_LAUNCH_2026-11-21.json
permissions: {}
concurrency:
  group: rnad-i5-g49-strength-single-writer
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify one-shot approval and source-pinned G61 full-state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          path = 'docs/research/rnad/G62_G160_TEN_HOUR_LAUNCH_2026-11-21.json'
          x = json.loads(Path(path).read_text())
          prelaunch = subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          changed = subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          assert changed == [path], 'Launch commit must change only the request'
          assert x == {
              'schema':'rnad-i5-g62-source-pinned-ten-hour-v1',
              'workflow_prelaunch_sha':prelaunch,
              'training_source_sha':'26bcb35e6a1e7e74daa7e05c74c4b381c751188b',
              'previous_completed_run_id':44733372530,
              'previous_completed_run_sha':'b1a2d350f5344ca0555db0bf7d15169943600f5e',
              'g62_bootstrap_artifact_id':14633376773,
              'g61_learner_result_artifact_id':14633386838,
              'first_generation':62,'last_generation':160,
              'budget_seconds':36000,
              'actor_count':20,'matches_per_generation':1280,'updates_per_generation':40,
              'github_hosted_cpu_only':True,
              'preserve_full_main_target_optimizer_magnet_rng':True,
              'no_extra_strength_evaluation':True,'no_champion_promotion':True,
          }, 'Wrong verified run, artifact, source, or training scope'
          workflow = Path('.github/workflows/rnad-i5-next13-fast-generation-reusable.yml').read_text()
          assert 'last_generation:' in workflow and 'again=remaining>1200 and g<int(' in workflow, 'Budget and generation gate missing'
          print('Approved G62 10h continuation; immutable training source 26bcb35e6a1e7e74daa7e05c74c4b381c751188b')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Verify G62-G160 recovery ceiling with negative and mixed-generation tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/rnad/shared_league_artifact_recovery.py scripts/rnad/shared_league_parallel_download.py scripts/rnad/g62_strength_resume_migration.py
          python -m unittest discover -s test -p rnad_shared_league_artifact_recovery_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_parallel_download_test.py -v
          python - <<'PY'
          from scripts.rnad.shared_league_artifact_recovery import artifact_name,MAX_RECOVERY_GENERATION
          assert MAX_RECOVERY_GENERATION == 160
          assert artifact_name(62,19) == 'rnad-i5-cont-g62-actor-19'
          assert artifact_name(160,0) == 'rnad-i5-cont-g160-actor-0'
          try:
              artifact_name(161,0)
          except ValueError:
              pass
          else:
              raise AssertionError('Unapproved G161 must be rejected')
          PY
          gh api repos/cueikusuta/p-RL1024/actions/runs/44733372530 \
            --jq '{id,head_sha,status,conclusion}' > prior-run.json
          test "$(jq -r .head_sha prior-run.json)" = 'b1a2d350f5344ca0555db0bf7d15169943600f5e'
          test "$(jq -r .status prior-run.json)" = completed
          test "$(jq -r .conclusion prior-run.json)" = success
          for record in "14633376773 rnad-i5-cont-next-bootstrap-after-g61" "14633386838 rnad-i5-cont-g61-full-learner-result"; do
            set -- $record
            gh api "repos/cueikusuta/p-RL1024/actions/artifacts/$1" \
              --jq '{id,name,expired,workflow_run}' > "artifact-$1.json"
            test "$(jq -r .id "artifact-$1.json")" = "$1"
            test "$(jq -r .name "artifact-$1.json")" = "$2"
            test "$(jq -r .expired "artifact-$1.json")" = false
            test "$(jq -r .workflow_run.id "artifact-$1.json")" = 44733372530
          done

  bridge:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 26bcb35e6a1e7e74daa7e05c74c4b381c751188b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Verify immutable G61 handoff and re-seal exact full state to repaired source
        run: |
          set -euo pipefail
          for record in "rnad-i5-cont-next-bootstrap-after-g61 previous-g62" "rnad-i5-cont-g61-full-learner-result prior-result"; do
            set -- $record
            for attempt in 1 2 3 4 5 6 7; do
              rm -rf "$2"; mkdir -p "$2"
              if gh run download 44733372530 --repo cueikusuta/p-RL1024 \
                   --name "$1" --dir "$2"; then break; fi
              if [ "$attempt" -eq 7 ]; then exit 1; fi
              sleep "$((attempt * 10))"
            done
          done
          (cd previous-g62 && sha256sum -c file-pins.sha256)
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
          python -m scripts.rnad.g62_strength_resume_migration --source previous-g62 --out bootstrap
          (cd bootstrap && sha256sum -c file-pins.sha256)
      - name: Validate source migration and G61->G62 10-hour handoff provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          import torch
          b,o,p=Path('bootstrap'),Path('previous-g62'),Path('prior-result')
          rd=lambda x:json.loads(x.read_text())
          sha=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          m,idx,mig,ctx=(rd(b/x) for x in (
              'generation-manifest.json','checkpoint-index.json',
              'migration-report.json','continuation-context.json'))
          prior_m,prior_i,prior_r=(rd(o/x) for x in (
              'generation-manifest.json','checkpoint-index.json','handoff-report.json'))
          result,result_i=(rd(p/x) for x in ('generation62-report.json','generation62-index.json'))
          src='26bcb35e6a1e7e74daa7e05c74c4b381c751188b'
          oldsrc='3486890f5ba3e4858540857c4fde3c3493efe66a'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==src
          assert prior_m['generation']==m['generation']==idx['generation']==62
          assert prior_m['source_sha']==oldsrc and m['source_sha']==src
          assert m['seed_start']==9900001+62*640
          assert m['actor_count']==20 and m['seeds_per_actor']==32
          assert m['optimizer_steps']==40 and m['optimizer_batch_matches']==32
          assert prior_r['previous_generation']==result['generation']==61
          assert prior_r['prior_optimizer_updates']==result['optimizer_updates_completed']==40
          assert prior_r['exact_previous_complete_matches']==result['accepted_complete_four_win_matches']==1280
          assert result['cumulative_complete_matches']==1280*62
          assert result['cumulative_optimizer_updates']==40*62
          assert result['champion_promoted'] is False
          assert result_i['full_checkpoint_sha256']==prior_r['prior_checkpoint_sha256']==prior_i['prior_generation_checkpoint_sha256']
          assert all(prior_r[k] is True for k in ('optimizer_full_state_preserved','target_full_state_preserved','magnet_full_state_preserved','rng_full_state_preserved'))
          assert mig['previous_source_sha']==oldsrc and mig['source_sha']==src
          assert mig['old_checkpoint_sha256']==prior_i['sha256']==sha(o/'checkpoint-g0.pt')
          assert mig['new_checkpoint_sha256']==idx['sha256']==sha(b/'checkpoint-g0.pt')
          assert idx['prior_generation_checkpoint_sha256']==prior_i['sha256']
          assert mig['verified_model_target_magnet_optimizer_scheduler_rng'] is True
          assert [r['id'] for r in m['opponents']['historical']]==['past-g59','past-g60','past-g61']
          cp=torch.load(b/'checkpoint-g0.pt',map_location='cpu',weights_only=True)
          assert cp['generation']==62 and cp['source_sha']==src and cp['is_champion'] is False
          assert cp['cumulative_complete_matches']==1280*62 and cp['cumulative_optimizer_updates']==40*62
          assert all(k in cp for k in ('model','target','magnet','optimizer','scheduler','torch_rng','python_rng'))
          assert ctx['schema']=='rnad-i5-shared-league-handoff-v1'
          assert ctx['source_run_id']==44318145987 and ctx['new_continuation_source_sha']==src
          assert ctx['budget_seconds']==36000 and ctx['deadline_epoch']==ctx['start_epoch']+36000
          assert ctx['new_budget_phase']=='g62-user-approved-ten-hour-continuation'
          assert ctx['previous_budget_context_sha256']==sha(o/'continuation-context.json')
          assert ctx['original_generation']==62
          assert not (b/'previous-budget-context.json').exists()
          (b/'previous-budget-context.json').write_bytes((o/'continuation-context.json').read_bytes())
          files=sorted(x for x in b.rglob('*') if x.is_file() and x.name!='file-pins.sha256')
          (b/'file-pins.sha256').write_text(''.join(
              f'{sha(x)}  {x.relative_to(b)}\n' for x in files))
          print(json.dumps({'start_generation':62,'prior_accepted_matches':1280*62,
            'prior_optimizer_steps':40*62,'source_sha':src,
            'budget_seconds':36000,'deadline_epoch':ctx['deadline_epoch'],
            'tensor_optimizer_rng_preserved':True,'champion_promoted':False},indent=2))
          PY
          (cd bootstrap && sha256sum -c file-pins.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rnad-i5-cont-next-bootstrap-after-g61
          path: bootstrap/
          retention-days: 30
          if-no-files-found: error

