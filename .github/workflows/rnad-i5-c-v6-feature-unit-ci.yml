name: I5 Battle v6 feature expansion unit CI
on:
  pull_request:
    paths:
      - scripts/rnad/**
      - src/ml/**
      - src/ai/draft-core-trio.js
      - test/rnad-*
      - .github/workflows/rnad-i5-*-unit-ci.yml
permissions: {}
concurrency:
  group: i5-c-unit-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Run feature and strict fixed-opponent contract tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/rnad/prepare_c_v6_bootstrap.py scripts/rnad/upgrade_battle_v6.py scripts/rnad/shared_league_learner.py
          node --test test/rnad-v6-features.test.js test/rnad-v5-features.test.js
          python -m unittest discover -s test -p rnad_upgrade_battle_v6_test.py -v
          python -m unittest discover -s test -p rnad_shared_league_contract_test.py -v
