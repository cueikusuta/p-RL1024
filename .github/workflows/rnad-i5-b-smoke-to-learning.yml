name: I5 B isolated source-pinned smoke then full learning
on:
  push:
    branches: [research/5-next-opponent-mix-b]
    paths:
      - .github/workflows/rnad-i5-b-smoke-to-learning.yml
permissions: {}
concurrency:
  group: rnad-i5-b-research-learning
  cancel-in-progress: false
jobs:
  actual_four_win_smoke:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install CPU learner
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Regression gate before authority smoke (second attempt)
        run: |
          set -euo pipefail
          node --test test/rnad-b-fixed-opponent.test.js
      - name: Validate immutable completed G195 baseline and fetch without modifying it
        run: |
          set -euo pipefail
          node scripts/verify-snapshot.mjs
          gh api repos/cueikusuta/p-RL1024/actions/artifacts/14702954785 \
            --jq '{id,name,expired,workflow_run}' > source-artifact.json
          python - <<'PY'
          import json
          row=json.load(open('source-artifact.json'))
          assert row['id']==14702954785
          assert row['name']=='rnad-i5-cont-next-bootstrap-after-g195'
          assert row['expired'] is False
          assert row['workflow_run']['id']==44860357036
          PY
          for attempt in 1 2 3 4 5; do
            rm -rf previous; mkdir -p previous
            if gh run download 44860357036 --repo cueikusuta/p-RL1024 \
              --name rnad-i5-cont-next-bootstrap-after-g195 --dir previous; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep "$((attempt*10))"
          done
          (cd previous && sha256sum -c file-pins.sha256)
      - name: Preserve full prior checkpoint and reseal for this exact research source
        run: |
          set -euo pipefail
          python -m scripts.rnad.bridge_bc_source --source previous --out resealed
          python -m scripts.rnad.prepare_b_opponent_profile --src resealed --out bootstrap
          (cd bootstrap && sha256sum -c file-pins.sha256)
          python - <<'PY'
          import json,subprocess
          manifest=json.load(open("bootstrap/generation-manifest.json"))
          assert manifest["generation"]==196
          assert manifest["source_sha"]==subprocess.check_output(
              ["git","rev-parse","HEAD"],text=True).strip()
          assert manifest["policy_manifest_sha256"]==manifest["main_sha256"]
          assert manifest["actor_count"]==20 and manifest["seeds_per_actor"]==32
          assert manifest["optimizer_steps"]==40
          assert manifest["league_opponent_profile"]=="rnad-i5-opponents-b-v1"
          assert set(x["id"] for x in manifest["opponents"]["fixed"])=={"fixed-aqbase001","fixed-coretrioaq001","fixed-base256","fixed-c005"}
          assert manifest.get("battle_feature_schema", "rnad-three-phase-features-v5")=="rnad-three-phase-features-v5"
          PY
      - name: Collect genuine accepted full four-win Match smoke using distinct fixed and self seats
        run: |
          set -euo pipefail
          for actor in 0 16 17 18 19; do
            python -m scripts.rnad.shared_league_collect \
              --bootstrap bootstrap --actor-id "$actor" \
              --out "smoke/$actor" --smoke --match-workers 2
            test "$(find "smoke/$actor/accepted" -name '*.json.gz' | wc -l)" -eq 2
          done
          mkdir -p smoke-selected/self smoke-selected/frozen
          cp smoke/0/accepted/*.json.gz smoke-selected/self/
          cp smoke/16/accepted/*.json.gz smoke-selected/frozen/
          test "$(find smoke-selected -name '*.json.gz' | wc -l)" -eq 4
      - name: One real NeuRD/V-trace shared Learner update and disposable full-state save
        run: |
          set -euo pipefail
          python -m scripts.rnad.shared_league_real_smoke \
            --bootstrap bootstrap --smoke smoke-selected --out smoke-checkpoint
          python - <<'PY'
          import json
          s=json.load(open('smoke-checkpoint/smoke-report.json'))
          assert s["optimizer_updates"]==1
          assert s["full_four_win_authoritative_matches"]==4
          assert all(s["updated_heads"].values())
          assert s["champion_promoted"] is False
          assert s["generation0_1280_match_training_finished"] is False
          print("PASS actual accepted 4-win Match and real shared Learner gradient")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: rnad-i5-b-g196-smoke-approved-bootstrap
          path: bootstrap/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rnad-i5-b-g196-smoke-evidence
          path: |
            smoke-checkpoint/smoke-report.json
            resealed/bc-source-bridge-report.json
          retention-days: 30
          if-no-files-found: warn
  production_g196:
    permissions:
      contents: read
      actions: read
    needs: actual_four_win_smoke
    if: needs.actual_four_win_smoke.result == 'success'
    uses: ./.github/workflows/rnad-i5-shared-generation-reusable.yml
    with:
      generation: 196
      bootstrap_artifact: rnad-i5-b-g196-smoke-approved-bootstrap
  production_g197:
    permissions:
      contents: read
      actions: read
    needs: production_g196
    if: needs.production_g196.result == 'success'
    uses: ./.github/workflows/rnad-i5-shared-generation-reusable.yml
    with:
      generation: 197
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g196
  production_g198:
    permissions:
      contents: read
      actions: read
    needs: production_g197
    if: needs.production_g197.result == 'success'
    uses: ./.github/workflows/rnad-i5-shared-generation-reusable.yml
    with:
      generation: 198
      bootstrap_artifact: rnad-i5-cont-next-bootstrap-after-g197
