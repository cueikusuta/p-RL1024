name: I5 B+C v6 8/8/4 integration contract CI
on:
  push:
    branches: [research/5-bc-100h-league]
    paths:
      - .github/workflows/rnad-i5-bc-100h-contract-ci.yml
      - scripts/rnad/**
      - src/ai/draft-core-trio.js
      - src/ml/**
      - test/rnad-*
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: i5-bc-v6-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'cueikusuta/p-RL1024'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install deterministic CPU-only Learner dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Run strict B pool, C Battle and complete-state contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/rnad/bridge_bc_g199_100h.py scripts/rnad/shared_league_handoff.py scripts/rnad/prepare_b_opponent_profile.py scripts/rnad/shared_league_learner.py scripts/rnad/shared_league_collect.py scripts/rnad/shared_league_contract.py
          node --check scripts/rnad/shared_league_actor.mjs
          python -m unittest discover -s test -p rnad_shared_league_contract_test.py -v
          python -m unittest discover -s test -p rnad_upgrade_battle_v6_test.py -v
          node --test test/rnad-b-fixed-opponent.test.js test/rnad-v6-features.test.js test/rnad-v5-features.test.js
